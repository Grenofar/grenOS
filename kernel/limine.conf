# No boot menu: grenOS is the only entry, and it starts straight away.
# timeout 0 boots it without waiting, quiet keeps the bootloader's own
# messages off the screen, so the first thing the human sees is the desktop.
timeout: 0
quiet: yes

# The entry name, which the menu would show if a key were held at startup.
/grenOS
    # We use the Limine boot protocol.
    protocol: limine

    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    kernel_path: boot():/boot/kernel
