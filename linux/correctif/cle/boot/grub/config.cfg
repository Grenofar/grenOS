# grenOS — le menu de démarrage, SANS changer le mode vidéo (20 novembre).
#
# Le menu est invisible (timeout 0, style « hidden » ; maintenir Maj le fait
# apparaître, en texte). GRUB ne touche donc plus du tout à l'écran :
# `gfxpayload=keep` donne au noyau le mode que le FIRMWARE a choisi — celui
# de son logo, en général la définition de l'écran.
#
# Pourquoi : `gfxmode=auto` + `terminal_output gfxterm` faisait changer le
# mode par GRUB, et le noyau recevait une géométrie (1280×800) que l'écran
# n'affichait pas (800×600) : image du firmware rayée et VERTE dès que X y
# peignait (vu par cle.yml le 20 novembre, carte sans pilote). Sur la RTX
# 5060 de Grenofar, c'est exactement le chemin pris quand `nouveau` est
# écarté. Avant encore, `gfxmode=800x600` léguait un 800×600 pixelisé.
#
# Le bip du gabarit d'origine reste retiré : grenOS démarre sans bruit.
set default=0
set timeout=0
set timeout_style=hidden
set gfxpayload=keep
