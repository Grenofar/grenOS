---
# grenOS — SEULEMENT dans le correctif de clé (linux/correctif) : l'installateur
# recopie l'image PUIS le correctif posé par-dessus, pour qu'un système
# installé depuis une clé corrigée ait les mêmes corrections que la clé.
# (Debian, calamares-settings-debian 13 : la première entrée seule.)
unpack:
    -   source: "/run/live/medium/live/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/live/medium/live/grenos-correctif.squashfs"
        sourcefs: "squashfs"
        destination: ""
