[package]
name = "grenos-ui"
version = "0.1.0"
edition = "2021"
description = "L'interface de grenOS : un seul processus Rust/Tauri pour toutes les fenêtres du système"
license = "MIT"

[[bin]]
name = "grenos-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `custom-protocol` : les pages sont intégrées dans le binaire et servies
# sans serveur. Sans cette fonction, Tauri croit être en développement et
# cherche un serveur Vite qui n'existe pas sur la machine de quelqu'un.
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GIO (déjà tiré par WebKitGTK, même version) : le type des fichiers en
# français, la corbeille, les volumes de « Ce PC » — l'explorateur (18
# novembre). Linux seulement : `cargo test` doit continuer de tourner sous
# Windows, où il n'y a pas de GLib.
[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
glib = "0.18"
gtk = "0.18"

[profile.release]
# La taille et la mémoire comptent plus que quelques pour cent de vitesse :
# ce binaire est chargé à chaque fenêtre ouverte sur des machines modestes.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
