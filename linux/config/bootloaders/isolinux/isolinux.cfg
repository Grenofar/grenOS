# Démarrage BIOS : aucun menu. Le gabarit de live-build affiche « Debian
# GNU/Linux ... Boot menu » et attend une touche (timeout 0) ; on démarre
# directement la première entrée, sans rien montrer.
#
# live.cfg est écrit par live-build et contient le label live-amd64 ; le menu
# n'est pas chargé du tout, donc ni titre, ni logo, ni attente. Une touche
# maintenue au démarrage (Échap) ramène l'invite pour les cas désespérés.
include live.cfg
default live-amd64
prompt 0
timeout 1
