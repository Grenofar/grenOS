# Le menu de démarrage BIOS. Le gabarit de live-build attend une touche pour
# toujours (timeout 0) : la machine restait sur le menu sans jamais démarrer.
# Trois secondes suffisent pour attraper le menu quand on le veut, et le
# démarrage se fait tout seul quand on ne fait rien.
include menu.cfg
default vesamenu.c32
prompt 0
timeout 30
