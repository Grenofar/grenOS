# Le chargeur d'amorçage de l'image, en BIOS.
#
# `CONSOLE 0` coupe l'affichage d'isolinux lui-même : sans elle, on voit ses
# messages et un « Loading /live/vmlinuz... » avant même que le noyau ne
# démarre. C'est la première chose qu'on voit de grenOS, et ce n'était pas
# grenOS.
#
# Pas de menu : `timeout 1` démarre tout de suite (l'unité est le dixième de
# seconde), et `prompt 0` ne demande rien.

CONSOLE 0
SERIAL 0 115200

include live.cfg
default live-amd64
prompt 0
timeout 1
