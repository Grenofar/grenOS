# Démarrage UEFI : aucun menu non plus. timeout 0 avec le style « hidden »
# lance la première entrée sans rien afficher ; maintenir Maj pendant le
# démarrage fait réapparaître le menu si l'on en a besoin.
#
# Le bip du gabarit d'origine est retiré : grenOS démarre sans faire de bruit.
set default=0
set timeout=0
set timeout_style=hidden

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Repris de l'image netinst de Debian — sauf la définition.
#
# `gfxmode=800x600` + `gfxpayload=keep` LÈGUE le 800×600 au noyau. Sur une
# machine dont la carte n'a pas (encore) de pilote, rien ne le remplace :
# l'écran de chargement et le bureau restent en 800×600 étiré. Vu par
# Grenofar le 19 novembre sur sa RTX 5060 : « extrêmement pixelisé ».
# `auto` prend le mode préféré de l'écran que le firmware annonce.
if loadfont $font ; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

terminal_output gfxterm
