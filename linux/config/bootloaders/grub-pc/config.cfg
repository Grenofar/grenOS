# grenOS — le menu de démarrage de la clé, SANS changer le mode vidéo.
#
# Le menu est invisible (timeout 0, style « hidden » ; maintenir Maj le fait
# apparaître, en texte). GRUB ne touche plus du tout à l'écran :
# `gfxpayload=keep` donne au noyau le mode que le FIRMWARE a choisi — celui
# de son logo, en général la définition de l'écran.
#
# L'HISTOIRE DE CE FICHIER, sur la RTX 5060 de Grenofar :
#   - 19 novembre : `gfxmode=800x600` (gabarit de Debian) léguait un 800×600
#     « extrêmement pixelisé » au noyau ;
#   - puis `gfxmode=auto` + gfxterm : GRUB changeait le mode, et le noyau
#     recevait une géométrie que l'écran n'affichait pas. PROUVÉ le 20
#     novembre par cle.yml (carte sans pilote, image du firmware) : le noyau
#     peignait en 1280×800, l'écran montrait 800×600 — image rayée et VERTE.
#     Avec ce fichier, la même machine affiche l'assistant net en 1280×800.
#
# Le bip du gabarit d'origine reste retiré : grenOS démarre sans bruit.
set default=0
set timeout=0
set timeout_style=hidden
set gfxpayload=keep
