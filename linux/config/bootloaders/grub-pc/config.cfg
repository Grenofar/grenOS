# Le menu de démarrage UEFI. Comme pour le BIOS : trois secondes, puis la
# première entrée. Le bip du gabarit d'origine est retiré — grenOS démarre
# sans faire de bruit.
set default=0
set timeout=3
set timeout_style=menu

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Repris de l'image netinst de Debian.
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
