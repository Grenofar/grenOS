# grenOS — l'étape « bootloader » de l'installateur.
#
# Posé dans /etc/calamares/modules par appliquer-systeme, à la place de celui
# de calamares-settings-debian (21 novembre). Les mêmes valeurs que Debian,
# sauf deux :
#   - grubInstall passe par /usr/lib/grenos/grenos-grub-install, qui pose le
#     chemin de secours AVEC shim (Secure Boot) et jamais sur la partition EFI
#     de Windows ;
#   - installEFIFallback: false, parce que la copie de Calamares mettait
#     grubx64.efi — refusé par un PC en Secure Boot — à la place de shim, et
#     écrasait celui de Windows sur une partition partagée.
---
efiBootLoader: "grub"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"
grubInstall: "/usr/lib/grenos/grenos-grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: false
