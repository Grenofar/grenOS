# Comment grenOS occupe le disque quand on l'installe.
#
# RIEN N'EST PRÉCHOISI, ET C'EST UN CHANGEMENT DU 1er OCTOBRE.
#
# Ce fichier demandait que « effacer le disque » soit la case déjà cochée quand
# la page s'ouvre. Il suffisait de cliquer « Suivant » sans lire pour perdre
# Windows.
#
# Grenofar, le 1er octobre : « de garder les données de Windows ou d'une autre
# distribution Linux, fais un truc clean ».
#
# Et les auteurs de Calamares disent exactement la même chose, dans le fichier
# d'exemple de leur propre module (src/modules/partition/partition.conf), lu le
# jour même :
#
#     For most installers, "none" is the right choice: it makes the user pick
#     something specific, rather than accidentally being able to click past an
#     important choice (in particular, "erase" is a dangerous choice).
#     The default is "none"
#
# Nous avions donc choisi, et documenté comme un confort, précisément ce que
# l'outil désigne comme dangereux. Les quatre possibilités restent offertes —
# effacer, remplacer, installer À CÔTÉ, tout décider soi-même — mais aucune
# n'est cochée d'avance : il faut en désigner une.
#
# Ce qui rend « installer à côté » réellement disponible, vérifié dans le
# binaire du module (libcalamares_viewmodule_partition.so) :
#
#   - « This storage device has multiple operating systems on it » : les autres
#     systèmes sont détectés par os-prober, qui est dans notre liste ;
#   - « System is EFI but there's no EFI system partition, DISABLING alongside
#     and replace features » : sur une machine UEFI il faut une partition EFI,
#     et Windows en a toujours une ;
#   - redimensionner une partition Windows demande ntfs-3g, qui est dans notre
#     liste aussi.
#
# Ce fichier remplace celui de calamares-settings-debian : includes.chroot est
# copié après l'installation des paquets, donc c'est le nôtre qui reste.

efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: ESP

# Le disque entier, d'un seul tenant : pas de partitions imbriquées à
# expliquer, et une seule partition de données qui prend tout ce qui reste.
userSwapChoices:
  - none
  - small
  - suspend
initialSwapChoice: small
initialPartitioningChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes:
  - ext4
  - btrfs
  - xfs

# Tout décider soi-même reste possible : c'est la deuxième moitié de la phrase
# « tout l'espace, ou à la guise de la personne ».
allowManualPartitioning: true
drawNestedPartitions: false
alwaysShowPartitionLabels: true
enableLuksAutomatedPartitioning: true
