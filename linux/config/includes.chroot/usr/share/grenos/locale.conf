# Le fuseau horaire de l'installateur (21 novembre). Posé par
# appliquer-systeme dans /etc/calamares/modules/locale.conf.
#
# calamares-settings-debian n'en livre aucun : Calamares prenait donc son
# défaut, AMÉRIQUE/NEW YORK, et — `adjustLiveTimezone` étant vrai par
# défaut — passait aussi la session de la clé à l'heure de New York. Chez
# Grenofar, l'erreur de l'installateur s'affichait à « 14:33 » pour 20 h 33.
---
# Paris présélectionné : la personne peut toujours en choisir un autre.
region: "Europe"
zone: "Paris"

# La session de la clé garde son heure : c'est le système INSTALLÉ qui prend
# le fuseau choisi (étape « locale »), pas la clé.
adjustLiveTimezone: false

# Aucune géolocalisation par le réseau : pas toujours de réseau, et rien à
# envoyer à personne pour savoir qu'on est à Paris.
