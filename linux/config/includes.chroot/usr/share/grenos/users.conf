# Le compte créé par l'installateur (Calamares, module « users »).
#
# Repris de calamares-settings-debian 13.0.13 (groupes, sudo, pas de mot de
# passe root), SAUF la force du mot de passe.
#
# 20 novembre, Grenofar, en installant sur son PC : l'installateur disait
# qu'il « n'a pas réussi à avoir le dictionnaire » et que la sécurité était
# « affaiblie ». Debian demande à libpwquality de juger le mot de passe ; même
# avec minlen=0, libpwquality consulte le dictionnaire de cracklib, qui n'est
# pas dans grenOS — d'où le message. Il a demandé : « que le nombre de
# caractères soit autant qu'on veut, et que le seul message qui dit non soit
# l'incohérence entre les deux mots de passe ». Donc : aucune règle de force,
# aucune longueur imposée. Calamares refuse toujours deux mots de passe
# différents (c'est dans le module, pas dans ce fichier), et un mot de passe
# VIDE — sans lui, `sudo` et l'écran de verrouillage ne s'ouvriraient pas.
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

passwordRequirements:
    nonempty: true

# Un mot de passe « faible » n'est jamais refusé ni signalé.
allowWeakPasswords: true
allowWeakPasswordsDefault: true
