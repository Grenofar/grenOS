# grenOS — ce que l'installateur retire du système installé.
#
# Posé dans /etc/calamares/modules par appliquer-systeme, à la place de celui
# de calamares-settings-debian (21 novembre).
#
# POURQUOI LE NÔTRE. Celui de Debian enchaîne un seul `apt-get remove` de
# neuf paquets, dont quatre que grenOS n'a jamais installés (live-boot-doc,
# live-config-doc, live-task-localisation, live-task-recommended). Les ISO de
# Debian gardent les listes d'apt, et apt répond « pas installé ». L'image de
# grenOS ne les garde pas (`--apt-indices false`, auto/config) et le chroot de
# l'installation n'a pas de DNS (/run y est un tmpfs) : apt répondait
# « paquet introuvable », sortait en 100, et l'installation finissait en
# ERREUR après avoir déjà copié le système et posé GRUB.
#
# `try_remove` retire un paquet à la fois et passe outre un refus : ce qui
# n'est pas là n'arrête plus rien. Calamares part aussi : sur une machine
# installée, l'installateur n'a plus rien à faire (grenos-session ne pose son
# icône que sur la clé).
---
backend: apt
operations:
  - try_remove:
      - live-boot
      - live-boot-initramfs-tools
      - live-config
      - live-config-systemd
      - live-tools
      - calamares-settings-debian
      - calamares
