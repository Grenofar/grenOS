# Ce que grenOS écrit dans le /etc/fstab d'une machine installée.
#
# POURQUOI CE FICHIER EXISTE — c'est la ligne A11 de sa liste, mot pour mot :
# « un périphérique attendu ne doit jamais faire échouer le démarrage ».
#
# Jusqu'ici, chaque ligne du fstab d'une machine grenOS portait `defaults`, et
# rien d'autre. Vérifié dans le paquet calamares 3.3.14-1, `modules/mount/
# main.py`, qui le dit en toutes lettres :
#
#     # If there are no mount options defined then we use the defaults
#     if mount_options is None:
#         return "defaults"
#
# Et le `mount.conf` livré par calamares-settings-debian 13.0.13-1 ne contient
# **aucune** clé `mountOptions` — seulement `extraMounts`. Ouvert et lu, pas
# supposé. La chaîne est donc : pas de `mountOptions` → `defaults` partout →
# aucun `nofail` nulle part.
#
# CE QUE CELA COÛTE, et c'est littéralement « machine perdue » :
#
# Sans `nofail`, un point de montage est **requis** par `local-fs.target` et
# ordonné avant lui (`systemd.mount(5)`). Et `local-fs.target`, lu dans
# systemd 257.13-1~deb13u1, porte :
#
#     OnFailure=emergency.target
#
# Donc un second disque débranché, en panne, ou simplement absent au démarrage
# fait attendre systemd, échouer la cible, et bascule la machine en mode
# secours — lequel demande un mot de passe root que grenOS ne définit JAMAIS.
# Pas de bureau, pas de retour en arrière.
#
# Ce n'est pas théorique chez lui : il a écrit « l'OS détecte plusieurs disques
# de stockage », et notre installateur permet le partitionnement manuel, donc
# un /home sur un second disque. Et `initialSwapChoice: small` crée une
# partition d'échange qui tombe sous la même règle.
#
# DEUX PIÈGES À NE PAS MANQUER, et le premier casserait l'installation :
#
# 1. Ce fichier remplace celui de Debian, donc il doit **recopier ses sept
#    `extraMounts` mot pour mot**. Sans eux, ni /proc, ni /sys, ni /dev, ni
#    /dev/pts dans la cible — et apt échoue pendant l'installation. Ils sont
#    recopiés tels quels ci-dessous, commentaire de Debian compris.
# 2. Il est livré dans /usr/share/grenos et posé par `appliquer-systeme`,
#    jamais directement dans /etc/calamares : c'est un conffile de
#    calamares-settings-debian, et deux paquets ne peuvent pas posséder le
#    même chemin. Règle apprise le 24 septembre, au prix d'une image.
---
# Extra filesystems to mount. The key's value is a list of entries; each
# entry has five keys:
#   - device    The device node to mount
#   - fs (optional) The filesystem type to use
#   - mountPoint Where to mount the filesystem
#   - options (optional) An array of options to pass to mount
#   - efi (optional) A boolean that when true is only mounted for UEFI installs
#
# The device is not mounted if the mountPoint is unset or if the fs is
# set to unformatted.
#
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /dev/pts
      mountPoint: /dev/pts
      options: [ bind ]
      # /dev/pts is required by apt for storing the logs

# Les options de montage, par système de fichiers. La forme est celle que lit
# `get_mount_options()` de calamares 3.3.14 : une liste d'entrées portant
# `filesystem`, `options`, et facultativement `ssdOptions` / `hddOptions`.
#
# `nofail` sur TOUTES les lignes, y compris la racine. Sans danger : la racine
# est montée par l'initramfs, et `systemd.special(7)` dit de `-.mount` qu'elle
# est « unconditionally active ». Aucun `nofail` ne peut empêcher une machine
# de démarrer sur sa racine ; il empêche seulement un disque ABSENT de la
# retenir.
#
# `x-systemd.device-timeout=10s` fait tomber l'attente de 90 s à 10. Quatre-
# vingt-dix secondes devant un écran noir, pour un disque qui ne viendra pas,
# c'est déjà une panne aux yeux de celui qui regarde.
#
# `noatime` est posé au passage : Debian croyait le poser depuis des années —
# son `fstab.conf` le contient — mais ce fichier est écrit pour une version
# antérieure de Calamares, et 3.3.14 ne lit plus cette clé. Elle tombait en
# silence, comme nos sept clés `places_*` dans la mauvaise section de
# `libfm.conf`.
#
# `umask=0077` sur la partition EFI : sans lui elle est lisible par tous.
# L'installateur de Debian le pose ; Calamares, non.
mountOptions:
    - filesystem: default
      options: [ defaults, nofail, noatime, "x-systemd.device-timeout=10s" ]
    - filesystem: efi
      options: [ defaults, nofail, "umask=0077", "x-systemd.device-timeout=10s" ]
    - filesystem: linuxswap
      options: [ defaults, nofail ]
