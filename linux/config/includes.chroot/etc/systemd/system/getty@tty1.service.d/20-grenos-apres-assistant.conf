# La console tty1 attend la fin de l'assistant (21 novembre).
#
# L'assistant ferme plymouth avant de lancer son serveur X (grenos-premier-x :
# sur la RTX 5060 de Grenofar, plymouth gardait la carte, « drmSetMaster
# failed »). Mais tty1 n'attendait QUE la fin de plymouth : elle démarrait
# aussitôt, la clé y ouvre une session automatique, et logind basculait
# l'écran sur cette session texte — l'assistant tournait sur vt7, invisible,
# devant un écran noir (cle.yml, run 44842167737). Elle attend donc aussi la
# fin de l'assistant ; une machine déjà nommée n'a pas d'assistant, et rien
# ne change pour elle.
[Unit]
After=grenos-premier.service
