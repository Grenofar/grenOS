# zramswap échouait À L'ARRÊT, à chaque extinction (rapport de démarrage
# relu par cle.yml, 20 novembre) : l'échange est bien retiré, puis
# `modprobe -r zram` répond « Module zram is in use » sous le noyau 7.3, et
# le script rend 1. Rien n'est perdu (la machine s'éteint), mais une unité
# « en échec » à chaque arrêt n'est pas propre — et elle cacherait une vraie
# panne le jour où il y en aurait une. Le « - » laisse passer ce seul échec.
# La commande est celle du paquet zram-tools (unité d'origine).
[Service]
ExecStop=
ExecStop=-/usr/sbin/zramswap stop
