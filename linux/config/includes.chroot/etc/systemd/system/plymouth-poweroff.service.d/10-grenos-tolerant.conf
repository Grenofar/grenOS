# Laisser passer un plymouthd deja la.
#
# POURQUOI CE FICHIER EXISTE
#
# `grenos-taire-larret` leve la splash des la PREMIERE vague de l arret, parce
# que la mesure a montre que l unite Debian la leve trop tard : son demon
# repond a la fin de l arret, quand tout le journal est deja ecrit.
#
# Quand cette unite-ci demarre ensuite, elle trouve donc un demon en place. Son
# `ExecStart` d origine n a pas de `-` : il echouerait, l unite serait en
# erreur, et systemd afficherait une ligne `[FAILED]` — on aurait AJOUTE une
# ligne a l ecran en croyant en retirer quarante.
#
# On ne reecrit pas le fichier du paquet : deux paquets ne peuvent pas posseder
# le meme chemin, et cette regle nous a deja coute une image le 24 septembre.
# Un fragment sous `/etc/systemd/system/<unite>.d/` est a nous, et systemd le
# lit par-dessus. La ligne `ExecStart=` vide efface la precedente ; c est la
# seule facon documentee de remplacer une commande dans un fragment.
#
# La commande est recopiee MOT POUR MOT depuis le paquet (plymouth
# 24.004.60-5), au `-` pres. Si Debian la change un jour, le hook le dira.
#
# ET `--tty=tty1`, QUI EST LA SEULE DIFFERENCE AVEC LA COMMANDE DU PAQUET.
#
# Mesure sur cinq arrets, chacun avec sa photo :
#
#   quand NOUS levons plymouthd (avec --tty=tty1)  -> notre splash est peinte
#   quand celui de Debian arrive le premier        -> ecran NOIR, ou le journal
#
# Et le 2 octobre, on a demande `show-splash` au demon deja present : il a
# ACCEPTE, et l ecran est reste noir a 100 %. *Accepter n est pas peindre* —
# c est la lecon du `[ OK ] Started plymouth-poweroff.service`, qui ne prouvait
# rien non plus.
#
# La seule difference entre les deux commandes est `--tty=tty1`. Notre ecran
# est tty1 (la ligne de commande du noyau porte `console=tty1`), tandis que
# `--attach-to-session` seul attache le demon au tty de la SESSION, qui n est
# pas forcement celui qu on regarde. On la donne donc aussi a l unite de
# Debian : qui que ce soit qui demarre le premier, le demon est lance de la
# facon qui dessine, et la course cesse de compter.
[Service]
ExecStart=
ExecStart=-/usr/sbin/plymouthd --mode=shutdown --attach-to-session --tty=tty1
