# Les limites que PipeWire reçoit vraiment.
#
# Deuxième mesure, deuxième leçon. Après avoir ajouté `rtkit` puis les limites
# PAM de `/etc/security/limits.d`, l'image répondait encore :
#
#     son : aucun fil de pipewire en temps reel sur 2
#
# La raison est précise, et elle explique aussi pourquoi `rtkit` n'avait rien
# changé : **PipeWire n'est pas lancé par une session de connexion.** C'est un
# service `systemd --user`, démarré par `user@.service`. Or les limites de
# `limits.d` sont posées par PAM au moment de la connexion, et systemd
# n'en hérite pas : il donne à ses services utilisateur ses propres valeurs par
# défaut, où `RTPRIO` vaut zéro.
#
# Autrement dit, les deux corrections précédentes s'appliquaient à un endroit
# par lequel PipeWire ne passe pas. C'est exactement la forme de tous les
# défauts de cette semaine : *le bon réglage, au mauvais étage.*
#
# Ici, en revanche, c'est le bon étage : `user@.service` lit ce fichier, et
# tout ce qu'il démarre en hérite.
#
#   RTPRIO 95   — PipeWire demande 88 pour son fil `data-loop`, le seul qui
#                 porte le son. Sans ce droit il reste en priorité ordinaire et
#                 se fait doubler par le décodeur vidéo : c'est le hoquet.
#   MEMLOCK     — ses tampons ne partent jamais en zone d'échange. Un tampon
#                 audio relu depuis le disque arrive trop tard, et c'est le
#                 même bruit.
[Manager]
DefaultLimitRTPRIO=95
DefaultLimitMEMLOCK=infinity
DefaultLimitNICE=-19
