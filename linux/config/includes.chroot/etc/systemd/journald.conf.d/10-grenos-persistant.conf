# Configuration de la journalisation systemd pour grenOS
#
# Storage=persistent : les journaux sont écrits sur disque et survivent aux redémarrages.
# Cela permet de conserver l'historique du système pour le dépannage, même après une perte
# d'alimentation ou un plantage.
#
# SystemMaxUse=100M : limite l'espace disque utilisé par les journaux à 100 mégaoctets.
# Sans cette limite, les journaux pourraient croître indéfiniment et remplir le disque,
# rendant le système inutilisable. Sur une machine avec un seul disque, cette protection
# est essentielle pour garantir qu'il reste toujours de l'espace pour les opérations
# critiques et les données utilisateur.
#
# MaxRetentionSec=1month : conserve les journaux pendant un mois maximum.
# Au-delà, les anciens journaux sont supprimés automatiquement pour respecter la limite
# de taille. Cette durée offre un bon compromis entre historique utile et utilisation
# raisonnable de l'espace.
[Journal]
Storage=persistent
SystemMaxUse=100M
MaxRetentionSec=1month
