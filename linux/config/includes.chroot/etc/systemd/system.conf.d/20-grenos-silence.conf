# systemd se tait, au démarrage COMME à l'extinction.
#
# POURQUOI CE FICHIER, ET CE QU'IL NE SUFFIT PAS À RÉGLER
#
# « à l'extinction : pas de logs » est une demande du 23 septembre. Elle a été
# « vérifiée » pendant une semaine en relisant la ligne de commande du noyau,
# qui porte bien `systemd.show_status=false` — c'est-à-dire vérifiée en lisant
# la promesse, jamais l'écran.
#
# Le 29 septembre, la CI a photographié l'extinction pour la première fois.
# Verdict, mot pour mot :
#
#     [  OK  ] Started plymouth-poweroff.service - Show Plymouth Power Off Screen.
#
# La ligne de commande donne la valeur de DÉPART de `ShowStatus` ; systemd la
# remet ensuite à `yes` dès qu'il juge utile de montrer où il en est, et
# l'arrêt est précisément un de ces moments. Ce fichier, lui, est une
# configuration : elle ne se laisse pas reprendre.
[Manager]
ShowStatus=no
