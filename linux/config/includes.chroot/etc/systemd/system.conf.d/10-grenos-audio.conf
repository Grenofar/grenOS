# Le plafond, sans lequel l'étage du dessous ne sert à rien.
#
# Quatrième tentative sur le même symptôme. Les trois précédentes — `rtkit`,
# les limites PAM, puis `/etc/systemd/user.conf.d` — n'ont rien changé :
#
#     son : aucun fil de pipewire en temps reel sur 2
#
# Ce que la troisième a oublié : **un processus ne peut jamais relever sa
# propre limite dure.** `systemd --user` est lancé par `user@.service`,
# c'est-à-dire par le gestionnaire SYSTÈME. Si celui-ci lui donne
# `RLIMIT_RTPRIO = 0` — la valeur par défaut de systemd — alors `systemd --user`
# a zéro pour plafond et ne peut accorder 95 à personne, quoi qu'on écrive dans
# `user.conf`.
#
# Il faut donc les deux fichiers, et dans cet ordre de lecture : celui-ci lève
# le plafond, `user.conf.d` le transmet aux services de la personne.
#
# Je ne prétends pas que cela suffit : la session mesure désormais la limite
# réelle de PipeWire dans `/proc/<pid>/limits` et la dit. Si elle reste à zéro
# après ce fichier, la cause est encore ailleurs, et on le saura sans deviner.
[Manager]
DefaultLimitRTPRIO=95
DefaultLimitMEMLOCK=infinity
DefaultLimitNICE=-19
