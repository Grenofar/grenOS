# Dire à PipeWire de se servir du droit qu'on vient de lui donner.
#
# Cinquième tentative, et la première appuyée sur une mesure qui tranche. Les
# quatre précédentes corrigeaient un étage plausible ; celle-ci part d'un
# chiffre lu sur l'image :
#
#     son : plafond temps reel de pipewire = 95
#     son : aucun fil de pipewire en temps reel sur 2
#
# Les deux lignes ensemble disent tout : **PipeWire a le droit de demander la
# priorité temps réel, et ne le demande pas.** Ce n'est donc plus une affaire
# de permissions — `rtkit`, `limits.d`, `system.conf`, `user.conf` ont fait
# leur travail — mais du module qui devrait s'en servir.
#
# `libpipewire-module-rt` connaît trois chemins pour obtenir la priorité : le
# portail de bureau, rtkit, et la demande directe au noyau via les rlimits.
# Dans PipeWire 1.x le dernier est **désactivé par défaut** : le module préfère
# rtkit, et quand rtkit ne répond pas, il abandonne en silence — le module est
# chargé avec `nofail`, donc son échec ne se voit nulle part.
#
# On lui dit donc de tenter aussi la demande directe. C'est ce chemin-là que
# les limites posées hier rendent possible, et il ne dépend de personne :
# ni D-Bus, ni polkit, ni service tiers.
#
# `rt.prio = 88` est la valeur que PipeWire demande de lui-même ; on la répète
# pour que ce fichier se lise seul. `rt.time.soft/hard` bornent le temps que le
# fil peut passer en temps réel sans rendre la main : sans cette borne, un
# programme en temps réel qui boucle gèle la machine, et le noyau le sait.
context.modules = [
    { name = libpipewire-module-rt
      args = {
          nice.level     = -11
          rt.prio        = 88
          rt.time.soft   = 200000
          rt.time.hard   = 200000
          rlimits.enabled = true
          rtportal.enabled = false
          rtkit.enabled  = true
      }
      flags = [ ifexists nofail ]
    }
]
