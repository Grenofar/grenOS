# Un tampon assez large pour encaisser une machine qui rame.
#
# Grenofar, le 26 septembre : « on entend des bom bom bom quand y'a la vidéo ».
# Le son sortait ; il hachait. PipeWire travaille par paquets d'échantillons
# — le « quantum ». À chaque tour il doit en préparer un avant que la carte
# n'ait fini de jouer le précédent. S'il arrive en retard ne serait-ce qu'une
# fois, la carte joue du vide : c'est ce trou qu'on entend.
#
# Le défaut de PipeWire est 1024 échantillons, soit 21 ms à 48 kHz. Sur une
# machine confortable c'est parfait, et c'est pourquoi personne ne le change.
# Dans une machine virtuelle qui décode une vidéo **par le processeur** — il
# n'y a aucun décodage matériel en VM — les cœurs sont saturés et 21 ms
# deviennent une promesse intenable.
#
# On demande donc 2048 par défaut, et on autorise jusqu'à 8192 quand ça coince.
# Ce que cela coûte : 43 ms de latence au lieu de 21. Inaudible pour regarder
# une vidéo, écouter de la musique ou jouer un son d'interface — cela ne se
# remarquerait qu'en s'enregistrant en direct, ce que grenOS ne propose pas.
# Ce que cela rapporte : le tampon ne se vide plus.
#
# `min-quantum` reste bas : une application qui sait faire mieux peut le
# demander. On relève le plancher commun, on ne ferme aucune porte.
#
# Ce réglage vient AVEC `rtkit`, ajouté en même temps, et les deux se
# complètent : rtkit donne à PipeWire le droit de passer devant, le tampon lui
# donne de la marge quand il ne passe quand même pas.
context.properties = {
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 8192
}
