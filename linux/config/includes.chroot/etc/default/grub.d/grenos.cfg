# grenOS — le menu de démarrage du système INSTALLÉ (20 novembre).
#
# Lu par update-grub après /etc/default/grub (celui que l'installateur
# écrit) : ce fichier a donc le dernier mot.
#
# Grenofar : « rends le boot de l'OS plus rapide », et « garde la base comme
# Windows » — il installe grenOS à côté de Windows, sur un autre disque.
#
#   - Windows présent : le menu S'AFFICHE 5 secondes, avec Windows dedans.
#     os-prober est désactivé par défaut depuis GRUB 2.06 : sans la ligne
#     ci-dessous, Windows n'apparaîtrait même pas. On reconnaît Windows à sa
#     « partition réservée Microsoft » (MSR), que tout Windows sur GPT crée :
#     une lecture des tables de partitions, rien n'est monté.
#   - pas d'autre système : aucun menu, aucune attente (Maj ou Échap au
#     démarrage le fait apparaître).
#   - GRUB ne change plus le mode vidéo (console texte, gfxpayload=keep) : le
#     noyau garde le mode choisi par le firmware. Le 20 novembre, un
#     changement de mode par GRUB donnait une image du firmware rayée et
#     verte (cle.yml) ; et c'est une étape de moins au démarrage.
GRUB_DISABLE_OS_PROBER=false
GRUB_TERMINAL=console
GRUB_GFXPAYLOAD_LINUX=keep
if lsblk -rno PARTTYPE 2>/dev/null | grep -qi 'e3c9e316-0b5c-4db8-817d-f92df00215ae'; then
    GRUB_TIMEOUT_STYLE=menu
    GRUB_TIMEOUT=5
else
    GRUB_TIMEOUT_STYLE=hidden
    GRUB_TIMEOUT=0
fi
