# grenOS — le démarrage du système INSTALLÉ (20 novembre, revu le 22).
#
# Lu par update-grub après /etc/default/grub (celui que l'installateur
# écrit) : ce fichier a donc le dernier mot.
#
# Grenofar, le 20 : « rends le boot de l'OS plus rapide ». Le 22, devant son
# disque installé : « affiche plusieurs trucs, choix, je sais pas quoi :
# enlève », puis une ligne d'erreur qui passe.
#
#   - AUCUN MENU, AUCUNE ATTENTE, même avec Windows (Échap au tout début le
#     rappelle). Windows se choisit dans Fin de session › « Redémarrer sous
#     Windows » (grenos-demarrage). os-prober reste : ce menu de secours
#     garde ainsi Windows. Un démarrage raté ne l'affiche pas non plus 30 s
#     (GRUB_RECORDFAIL_TIMEOUT, 30 par défaut dans 00_header).
#   - LA LIGNE DU NOYAU DE LA CLÉ : le disque installé n'avait que
#     « quiet splash », qui laisse passer les erreurs du noyau et les états
#     de systemd. On ajoute, sans rien retirer.
#   - GRUB ne change plus le mode vidéo (console texte, gfxpayload=keep) : le
#     noyau garde le mode choisi par le firmware. Le 20 novembre, un
#     changement de mode par GRUB donnait une image du firmware rayée et
#     verte (cle.yml) ; et c'est une étape de moins au démarrage.
GRUB_DISABLE_OS_PROBER=false
GRUB_TERMINAL=console
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=0
export GRUB_RECORDFAIL_TIMEOUT=0
for grenos_mot in loglevel=3 systemd.show_status=false rd.systemd.show_status=false \
                  udev.log_level=3 rd.udev.log_level=3 vt.global_cursor_default=0; do
    case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
        *" $grenos_mot "*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }$grenos_mot" ;;
    esac
done
unset grenos_mot
