# Les cartes NVIDIA RTX 50 (Blackwell) restent sur l'image du firmware : le
# pilote libre `nouveau` y donne un écran vert au démarrage (20 novembre,
# RTX 5060 de Grenofar). Voir /usr/lib/grenos/grenos-nouveau-ou-pas, qui
# charge `nouveau` normalement sur toutes les autres cartes.
install nouveau /usr/lib/grenos/grenos-nouveau-ou-pas $CMDLINE_OPTS
