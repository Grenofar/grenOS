# Pas de lecteur de disquette. Aucune machine de 2026 n'en a.
#
# Sur la capture d'extinction du 29 septembre, une des quatre lignes restées à
# l'écran était :
#
#     I/O error, dev fd0, sector 0 op 0x0:(READ) flags 0x0 phys_seg 1 prio class 2
#
# C'est le noyau qui sonde un lecteur de disquette émulé, n'y trouve rien, et
# le dit — au niveau ERREUR, donc assez fort pour traverser `loglevel`.
#
# Ce n'est pas un défaut de grenOS, mais c'est une ligne rouge sur l'écran de
# quelqu'un qui éteint son ordinateur, pour un matériel qui n'existe plus. Le
# module retiré, la sonde n'a pas lieu et la ligne n'existe plus.
#
# Effet de bord bienvenu : un module de moins à charger au démarrage.
blacklist floppy
install floppy /bin/true
