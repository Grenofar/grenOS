# L'adaptateur sans fil Xbox (25 novembre).
#
# Dedans, c'est une puce Wi-Fi MediaTek : le pilote Wi-Fi du noyau (mt76x2u)
# la réclame au branchement, et grenos-adaptateur-xbox ne peut plus lui
# parler. Ces alias renvoient la clé vers un module qui n'existe pas : rien ne
# se charge pour elle, et elle reste libre. (Une clé Wi-Fi MediaTek ordinaire
# a d'autres identifiants : elle garde son pilote.)
alias usb:v045Ep02E6d*dc*dsc*dp*ic*isc*ip*in* grenos_adaptateur_xbox_sans_pilote
alias usb:v045Ep02FEd*dc*dsc*dp*ic*isc*ip*in* grenos_adaptateur_xbox_sans_pilote
alias usb:v045Ep091Ed*dc*dsc*dp*ic*isc*ip*in* grenos_adaptateur_xbox_sans_pilote
