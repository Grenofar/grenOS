# Les cartes NVIDIA sous le pilote LIBRE (nouveau) : un affichage simple et sûr.
#
# 20 novembre, sur la RTX 5060 de Grenofar (DisplayPort, deux écrans) : un
# écran vert au démarrage, une fois sur deux, et un curseur saccadé — même
# après avoir coupé picom. Deux suspects, tous deux sous X, et ce fichier
# les écarte tous les deux :
#   - l'ANCIEN pilote d'affichage `nouveau` (xserver-xorg-video-nouveau,
#     installé avec grenOS) : quand il est là, X le prend de lui-même, et il
#     date d'avant les RTX 50. On impose `modesetting`, le pilote moderne ;
#   - « glamor », l'accélération de modesetting, qui dessine par le rendu 3D
#     de nouveau (zink sur NVK) — encore jeune sur ces cartes. Ses tampons
#     tuilés mal lus par l'écran donnent précisément une image VERTE. Sans
#     glamor, l'image est un tampon simple que l'écran lit toujours bien.
#
# Rien ne change pour le pilote officiel de NVIDIA (son module s'appelle
# nvidia-drm, pas nouveau) ni pour AMD ou Intel. Les jeux passent par le
# pilote officiel (Jeux › Installer le pilote NVIDIA).
Section "OutputClass"
    Identifier "grenOS : NVIDIA sous nouveau, affichage simple"
    MatchDriver "nouveau"
    Driver "modesetting"
    Option "AccelMethod" "none"
EndSection
