# grenOS — des noms de périphériques audio qu'on RECONNAÎT (21 novembre).
#
# Grenofar, sur la clé : « il n'a pas trouvé tous mes périphériques audio » —
# son casque, que Windows appelle « OW810 ». Le rapport de démarrage de sa clé
# a montré que Linux le voyait très bien (carte son USB, « USB-Audio »), mais
# que sa puce USB n'a PAS de nom de produit (chaîne vide, vendeur « Beibinghe
# Technology ») : PipeWire le présentait donc sous un nom fabriqué à partir
# de ses identifiants, que personne ne reconnaît. Windows trouve « OW810 »
# ailleurs que dans la puce.
#
# On lui rend son nom, par ses identifiants USB (3206:0861) : il suit partout,
# dans nos panneaux du son comme dans Firefox, Discord ou un jeu.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x3206"
        device.product.id = "0x0861"
      }
    ]
    actions = {
      update-props = {
        device.description = "Casque OW810"
        device.nick = "OW810"
      }
    }
  }
]
