# Le droit, pour le son, de passer devant tout le reste.
#
# Mesuré sur l'image, et c'est ce qui a tranché :
#
#     son : aucun fil de pipewire en temps reel sur 3
#
# `rtkit` était pourtant installé. Il ne suffit donc pas : rtkit accorde la
# priorité temps réel **à la demande, par D-Bus**, et cette demande peut
# échouer sans bruit — pas de bus disponible au bon moment, polkit qui ne
# répond pas, service non activé. PipeWire n'insiste pas : il continue en
# priorité ordinaire, et personne n'apprend rien.
#
# Ces limites-ci sont l'autre chemin, celui que prennent toutes les
# distributions audio : le noyau autorise directement les membres du groupe
# `audio` à demander SCHED_FIFO, sans passer par personne. PipeWire essaie ce
# chemin **en premier** et ne se rabat sur rtkit que s'il échoue.
#
# Ce que chaque ligne fait :
#
#   rtprio 95    — peut demander la priorité temps réel jusqu'à 95. PipeWire
#                  demande 88 pour son fil `data-loop`, celui qui porte le son.
#   memlock      — peut verrouiller ses tampons en mémoire, pour qu'ils ne
#                  partent jamais en zone d'échange : un tampon audio relu
#                  depuis le disque arriverait trop tard, et c'est précisément
#                  le « bom bom bom ».
#   nice -19     — peut se donner la priorité maximale hors temps réel, ce qui
#                  sert aux fils qui n'ont pas besoin de FIFO.
#
# Pourquoi le groupe `audio` et pas tout le monde : un programme en temps réel
# qui boucle peut geler la machine. Le droit va donc à ceux qui font du son, et
# `appliquer-systeme` y met le compte de la personne.
@audio   -  rtprio     95
@audio   -  memlock    unlimited
@audio   -  nice      -19
