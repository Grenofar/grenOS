# Le durcissement de grenOS (todo D3, D4, D6 — 18 novembre).
#
# Chaque ligne dit ce qu'elle empêche. Aucune ne casse ce que grenOS fait :
# relu contre nos programmes avant d'écrire (personne ne lit dmesg sans être
# root, aucun ne s'attache à un processus qui n'est pas son enfant). Les
# espaces de noms non privilégiés restent OUVERTS : Flatpak, Steam et les
# navigateurs s'en servent pour leur bac à sable, et les fermer ferait
# tomber la sécurité qu'ils apportent.
#
# Un fichier à nous, sous /etc/sysctl.d : aucun paquet ne le possède.

# ---- D3 déni de service --------------------------------------------------------
# Une inondation de SYN ne remplit plus la file : le noyau répond par un
# cookie et ne garde rien tant que l'autre ne prouve pas qu'il existe.
net.ipv4.tcp_syncookies = 1
# Un ping vers l'adresse de diffusion ne fait pas répondre toute la machine.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ---- D4 usurpation (ARP et adresses) ---------------------------------------------
# Un paquet qui prétend venir d'une adresse qu'aucune route ne mène ici est
# jeté (filtre de chemin inverse). Mode LÂCHE (2), comme systemd : le mode
# strict (1) casse les VPN WireGuard « tout le trafic », qui routent par
# marque — ce serait casser G26 pour durcir D4.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
# Ne répondre en ARP que pour l'adresse de la carte qui reçoit la question,
# et annoncer la bonne : ferme les confusions entre cartes. CE N'EST PAS une
# protection complète contre l'usurpation ARP — aucun réglage du noyau ne
# l'est sur un réseau partagé ; c'est le pare-feu (D1) et un VPN (G26) qui
# protègent sur un Wi-Fi public. todo.md le dit.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
# Les redirections ICMP et le routage par la source sont des moyens de
# détourner le trafic d'un poste : un poste de travail n'en a pas besoin.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# ---- D6 isolation du noyau -------------------------------------------------------
# Les adresses du noyau ne s'affichent plus : elles servent à viser une faille.
kernel.kptr_restrict = 2
# Le journal du noyau réservé à root (il contient ces adresses).
kernel.dmesg_restrict = 1
# Un programme ne peut plus lire la mémoire d'un autre, sauf de son enfant :
# un logiciel malveillant ne vole plus les mots de passe du navigateur ouvert.
kernel.yama.ptrace_scope = 1
# eBPF réservé à root, et compilé durci.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# Les pièges classiques des dossiers partagés (/tmp) : liens, fichiers et
# tubes posés par un autre compte.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0
# Pas de chargement d'une discipline de ligne par un simple compte.
dev.tty.ldisc_autoload = 0

# ---- E8 / C15 après une panique du noyau ------------------------------------------
# Redémarrer seul au bout de dix secondes, au lieu de rester figé : le
# compteur de démarrages ratés voit l'échec, et le mode sans échec (C15)
# prend la main au démarrage suivant, avec le rapport gardé par pstore.
kernel.panic = 10
kernel.panic_on_oops = 0
