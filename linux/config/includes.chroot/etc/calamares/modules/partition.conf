# Comment grenOS occupe le disque quand on l'installe.
#
# Le choix proposé d'emblée est « effacer le disque » : grenOS prend alors
# toute la place disponible, ce qui est ce que veut quelqu'un qui installe un
# système sur une machine. Les autres possibilités restent offertes dans la
# même page — installer à côté de ce qui existe, remplacer une partition, ou
# tout décider soi-même — parce qu'un disque n'appartient qu'à son propriétaire.
#
# Ce fichier remplace celui de calamares-settings-debian : includes.chroot est
# copié après l'installation des paquets, donc c'est le nôtre qui reste.

efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: ESP

# Le disque entier, d'un seul tenant : pas de partitions imbriquées à
# expliquer, et une seule partition de données qui prend tout ce qui reste.
userSwapChoices:
  - none
  - small
  - suspend
initialSwapChoice: small
initialPartitioningChoice: erase

defaultFileSystemType: "ext4"
availableFileSystemTypes:
  - ext4
  - btrfs
  - xfs

# Tout décider soi-même reste possible : c'est la deuxième moitié de la phrase
# « tout l'espace, ou à la guise de la personne ».
allowManualPartitioning: true
drawNestedPartitions: false
alwaysShowPartitionLabels: true
enableLuksAutomatedPartitioning: true
