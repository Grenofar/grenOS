; Ce que grenOS demande à GameMode pendant qu'un jeu tourne.
;
; Grenofar, le 1er octobre : « PRIVILEGIER LES JEUX (rocket league fortnite et
; jeux steam) ».
;
; POURQUOI CE FICHIER EST DANS /etc ET PAS AILLEURS
;
; La page de manuel de gamemoded(8) donne l'ordre de lecture, et il y en a
; quatre :
;
;     gamemoded will load and merge gamemode.ini config files from these
;     directories in the following order:
;         /usr/share/gamemode/
;         /etc/
;         $XDG_CONFIG_HOME or $HOME/.config/
;         $PWD
;
; /usr/share/gamemode/gamemode.ini appartient au paquet gamemode-daemon, et
; deux paquets ne peuvent pas posséder le même chemin — la règle du
; 24 septembre, qui avait coûté une image entière. /etc/ est le premier endroit
; qui soit à nous, et il écrase le défaut du paquet. C'est aussi là que la
; personne pourra relire ce que sa machine fait, au lieu de le deviner.
;
; CE QUE LE DÉFAUT DU PAQUET NE FAIT PAS, ET QUE PERSONNE NE VOIT
;
; Debian livre `renice=0`, c'est-à-dire : GameMode ne change PAS la priorité du
; jeu. Et il livre en même temps `/etc/security/limits.d/10-gamemode.conf`, qui
; accorde « @gamemode - nice -10 ». Le paquet donne donc un droit et ne s'en
; sert pas. Mis bout à bout, installer gamemode ne change presque rien — ce qui
; est exactement ce qu'on croirait avoir fait en l'ajoutant à la liste.

[general]

; La priorité du jeu. La valeur est niée puis appliquée : 10 donne nice -10,
; soit précisément le maximum que la règle du paquet autorise. Au-delà, le
; noyau refuserait et GameMode échouerait en silence.
;
; Il faut être dans le groupe `gamemode` pour que cela marche — la page de
; manuel le dit.
;
; CETTE PHRASE A ÉTÉ FAUSSE PENDANT QUELQUES HEURES, et la construction l'a
; dit : elle disait « `appliquer-systeme` s'en charge », ce qui est vrai et
; insuffisant — `appliquer-systeme` ne s'exécute que depuis le paquet et depuis
; la mise à jour au démarrage. Sur l'image live, et sur une installation
; fraîche avant la première mise à jour, personne n'ajoutait le compte.
;
; C'est maintenant `grenos-performances.service` qui le fait, à chaque
; démarrage et avant lightdm — plus `appliquer-systeme` après chaque mise à
; jour. Deux chemins, parce que les deux moments existent.
renice=10

; La priorité d'accès au disque, classe best-effort, 0 = la plus haute. Un jeu
; qui charge un niveau lit beaucoup : passer devant la mise à jour qui tourne
; derrière, c'est quelques secondes de chargement en moins.
ioprio=0

; L'écran ne doit pas s'éteindre pendant qu'on joue à la manette, où personne
; ne touche ni la souris ni le clavier. C'est déjà le défaut ; on l'écrit pour
; que ça reste vrai si le défaut change.
inhibit_screensaver=1

; Le « split lock » est une instruction qui traverse deux lignes de cache. Le
; noyau la ralentit délibérément depuis 5.7 pour protéger les autres
; processus ; sur un jeu, cela se voit. Déjà le défaut, écrit pour la même
; raison.
disable_splitlock=1

; LE GOUVERNEUR : CE QUE CE RÉGLAGE NE FERA PAS ICI, ET IL FAUT LE DIRE
;
; `desiredgov=performance` est le défaut de GameMode. Sur grenOS il ne changera
; rien, parce que `grenos-performances.service` pose déjà `performance` en
; permanence au démarrage. Et comme `defaultgov` reste vide, GameMode restaure
; « la valeur d'origine » en sortant — c'est-à-dire performance. Les deux
; réglages ne se contredisent donc pas.
;
; Ce qui reste vraiment à GameMode ici, c'est la priorité, le disque, l'écran
; de veille et le split lock. Le dire au lieu de laisser croire que GameMode
; fait monter la fréquence : elle est déjà en haut.
desiredgov=performance

; SOFTREALTIME EST LAISSÉ À « off », ET CE N'EST PAS UN OUBLI
;
; Il demande SCHED_ISO, que le commentaire du paquet décrit comme « currently
; not supported by upstream kernels ». Notre noyau est celui de Debian, donc
; amont. L'allumer poserait un réglage qui ne peut rien faire — la forme de
; défaut que ce dépôt passe son temps à trouver.
softrealtime=off
