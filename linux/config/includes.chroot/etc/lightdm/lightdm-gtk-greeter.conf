# L'écran de connexion, quand il y a un mot de passe à demander.
#
# Il reprend le fond d'écran et la police du bureau : on ne doit pas sentir de
# rupture entre l'écran de connexion et ce qui vient après. Sans mot de passe,
# personne ne le voit jamais — la session s'ouvre directement.

[greeter]
background=/usr/share/grenos/grenos-nuit.png
theme-name=Adwaita
icon-theme-name=Adwaita
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
cursor-theme-name=Adwaita
indicators=~clock;~session;~power
clock-format=%H:%M
position=50%,center 55%,center
screensaver-timeout=0
