# L'ouverture de session de grenOS.
#
# Tant qu'aucun mot de passe n'est choisi, la session s'ouvre toute seule :
# personne ne devrait avoir à taper un mot de passe qu'il n'a pas défini. Le
# premier écran (`grenos-premier`) réécrit ce fichier avec le nom choisi, et les
# Réglages le réécrivent encore le jour où un mot de passe est mis — l'ouverture
# automatique disparaît alors, sans quoi le mot de passe ne protégerait rien.

[Seat:*]
autologin-user=grenos
autologin-user-timeout=0
autologin-session=grenos
user-session=grenos
greeter-session=lightdm-gtk-greeter
