# Verr Num allumé avant l'écran de connexion (28 novembre) : un mot de passe
# avec des chiffres se tape au pavé numérique sans y penser.
#
# Dans un fichier à part, et pas dans 60-grenos.conf : celui-ci est RÉÉCRIT
# par le premier écran et par les Réglages (ouverture automatique, mot de
# passe) ; une ligne ajoutée là disparaîtrait au premier mot de passe choisi.
#
# grenos-verr-num rend toujours 0 : LightDM n'ouvrirait pas l'écran de
# connexion si ce script échouait.

[Seat:*]
greeter-setup-script=/usr/lib/grenos/grenos-verr-num
