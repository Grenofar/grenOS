# Le réglage des applications GTK, pour toute la machine.
#
# Sombre par défaut, la police du système, et un lissage du texte qui suit ce
# que fait Windows (hinting léger, sous-pixel) : c'est ce qui sépare un texte
# moderne d'un texte des années 2000. `grenos-theme` écrit le même fichier dans
# le dossier de la personne quand elle passe en mode jour.

[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
gtk-font-name=Inter 10
gtk-application-prefer-dark-theme=true
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-enable-animations=1
gtk-primary-button-warps-slider=false
