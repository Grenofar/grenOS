# grenOS — le compositeur, sur un vrai PC seulement (19 novembre).
#
# Grenofar : « j'ai un écran 300 Hz ». Sans compositeur, GTK et WebKit
# cadencent leurs animations à ~60 images par seconde, quel que soit l'écran.
# Avec un compositeur, chaque fenêtre suit la fréquence RÉELLE de l'écran
# (_NET_WM_FRAME_DRAWN), 300 Hz compris.
#
# Il ne CHANGE PAS l'apparence : pas d'ombres, pas de fondus, pas
# d'opacité — les coins arrondis restent l'œuvre de grenos-coins. Et il
# s'efface devant un jeu en plein écran (unredir-if-possible), qui retrouve
# l'accès direct à l'écran et ses images par seconde.
#
# Lancé par grenos-session : jamais dans une machine virtuelle, jamais sans
# carte graphique reconnue, jamais en effets « Performance ».

backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;
glx-no-stencil = true;
xrender-sync-fence = true;

shadow = false;
fading = false;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
corner-radius = 0;
detect-rounded-corners = false;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
