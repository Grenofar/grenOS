# L'explorateur de fichiers de grenOS.
#
# Les réglages d'origine de pcmanfm donnent une fenêtre chargée : deux barres
# d'outils, un panneau latéral en arborescence, des onglets toujours visibles.
# Ici, la disposition est celle que tout le monde connaît — un panneau
# « Emplacements » à gauche, une barre de chemin en haut, une barre d'état en
# bas, et rien d'autre.
#
# Ce fichier est le réglage par défaut : chacun peut tout changer ensuite dans
# Édition → Préférences, et son choix ira dans son propre dossier.

[config]
bm_open_method=0

[volume]
mount_on_startup=1
mount_removable=1
autorun=0

[ui]
always_show_tabs=0
max_tab_chars=32
win_width=1040
win_height=680
splitter_pos=190
media_in_new_tab=0
desktop_folder_new_win=0
change_tab_on_drop=1
close_on_unmount=1
focus_previous=0

# « Emplacements » : le dossier personnel, le bureau, la corbeille et les
# disques branchés. Une arborescence complète effraie plus qu'elle n'aide.
side_pane_mode=places

# LA VUE EN DÉTAILS, COMME WINDOWS — et les colonnes de Windows, dans son ordre.
#
# Grenofar, le 1er octobre : « améliore l'explorateur encore », après
# « que l'explorateur soit en terme d'UI encore plus proche de celui de
# Windows ». L'Explorateur de Windows ouvre un dossier en « Détails » :
# Nom, Modifié le, Type, Taille. Nous ouvrions en grandes icônes, où l'on ne
# voit ni la date ni la taille — et où un nom un peu long se coupe au milieu
# d'un mot : la capture du 1er octobre montre « Téléchargem-ents ».
#
# LES NOMS SONT CEUX DU CODE, PAS DE MA MÉMOIRE.
#
# `view_mode` accepte quatre noms, lus dans `view_mode_names[]` de
# `src/gtk/fm-standard-view.c` (libfm 1.4.0-2) :
#
#     { "icon", ... N_("_Icon View") }, { "compact", ... N_("_Compact View") },
#     { "thumbnail", ... }, { "list", ... N_("Detailed _List View") }
#
# et `app-config.c` de pcmanfm 1.4.0-1 confirme qu'il lit bien une CHAÎNE :
#
#     tmp = g_key_file_get_string(kf, "ui", "view_mode", NULL);
#     if (tmp[0] >= '0' && tmp[0] <= '9') tmp_int = atoi(tmp);  /* ancien */
#     else tmp_int = fm_standard_view_mode_from_str(tmp);       /* portable */
#
# Cette lecture a corrigé une erreur que j'allais commettre : le fichier
# `/etc/xdg/pcmanfm/default/pcmanfm.conf` livré par le PAQUET emploie des
# entiers (`view_mode=0`, `side_pane_mode=1`), et j'en avais conclu que nos
# valeurs en toutes lettres n'étaient pas lues du tout. Elles le sont. *Un
# fichier d'exemple livré par un paquet montre un format accepté, pas le seul.*
view_mode=list

# Les colonnes, dans l'ordre de Windows. Les noms viennent de
# `column_infos_raw[]` de `src/gtk/fm-folder-model.c` :
#
#     "name" N_("Name") · "desc" N_("Description") · "size" N_("Size")
#     "perm" · "owner" · "mtime" N_("Modified") · "dirname" · "ext"
#
# « desc » est la description du type de fichier — c'est la colonne « Type »
# de Windows. Il n'y a pas de colonne « Type » sous ce nom-là.
#
# Ce que cela coûte, et qu'il faut dire : un dossier d'images est plus agréable
# en vignettes. pcmanfm garde le choix par dossier (menu Voir), donc changer
# une fois suffit et c'est gardé. Le réglage ici n'est que le point de départ.
columns=name;mtime;desc;size;

show_hidden=0
sort=name;ascending;
toolbar=newtab;navigation;home;
show_statusbar=1

# LA BARRE DE CHEMIN EN BOUTONS, comme la barre d'adresse de Windows.
#
# Windows montre le chemin en morceaux cliquables — « > Ce PC > Utilisateurs >
# ci » — et bascule en champ de saisie quand on clique dedans. pcmanfm sait
# faire exactement cela, et nous lui demandions le champ de saisie en
# permanence : la capture montre « /home/ci » écrit en toutes lettres, ce que
# Windows n'affiche jamais ainsi.
#
# `app-config.c` : `fm_key_file_get_bool(kf, "ui", "pathbar_mode_buttons", …)`.
pathbar_mode_buttons=1
