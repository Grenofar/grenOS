# L'explorateur de fichiers de grenOS.
#
# Les réglages d'origine de pcmanfm donnent une fenêtre chargée : deux barres
# d'outils, un panneau latéral en arborescence, des onglets toujours visibles.
# Ici, la disposition est celle que tout le monde connaît — un panneau
# « Emplacements » à gauche, une barre de chemin en haut, une barre d'état en
# bas, et rien d'autre.
#
# Ce fichier est le réglage par défaut : chacun peut tout changer ensuite dans
# Édition → Préférences, et son choix ira dans son propre dossier.

[config]
bm_open_method=0

[volume]
mount_on_startup=1
mount_removable=1
autorun=0

[ui]
always_show_tabs=0
max_tab_chars=32
win_width=1040
win_height=680
splitter_pos=190
media_in_new_tab=0
desktop_folder_new_win=0
change_tab_on_drop=1
close_on_unmount=1
focus_previous=0

# « Emplacements » : le dossier personnel, le bureau, la corbeille et les
# disques branchés. Une arborescence complète effraie plus qu'elle n'aide.
side_pane_mode=places

# Double-clic pour ouvrir, comme partout ailleurs.
view_mode=icon
show_hidden=0
sort=name;ascending;
toolbar=newtab;navigation;home;
show_statusbar=1
pathbar_mode_buttons=0
