# Le comportement des fichiers, partagé par l'explorateur et les boîtes
# « Ouvrir » et « Enregistrer ».
#
# Deux choix qui comptent : **double-clic** pour ouvrir — le clic simple
# surprend tout le monde et fait ouvrir des fichiers par accident — et une
# confirmation avant de supprimer.

[config]
single_click=0
use_trash=1
confirm_del=1
confirm_trash=1
advanced_mode=0
si_unit=0
drop_default_action=auto
show_full_names=0
force_startup_notify=1
backup_as_hidden=1
no_usb_trash=1
no_child_non_expandable=0
show_full_names=0
places_home=1
places_desktop=1
places_root=0
places_computer=1
places_trash=1
places_applications=1
places_unmounted=1

[ui]
big_icon_size=48
small_icon_size=20
pane_icon_size=20
thumbnail_size=128
show_thumbnail=1
thumbnail_local=1
thumbnail_max=4096
