# Le comportement des fichiers, partagé par l'explorateur et les boîtes
# « Ouvrir » et « Enregistrer ».
#
# Deux choix qui comptent : **double-clic** pour ouvrir — le clic simple
# surprend tout le monde et fait ouvrir des fichiers par accident — et une
# confirmation avant de supprimer.

[config]
single_click=0
use_trash=1
confirm_del=1
confirm_trash=1
advanced_mode=0
si_unit=0
drop_default_action=auto
show_full_names=0
force_startup_notify=1
backup_as_hidden=1
no_usb_trash=1
no_child_non_expandable=0
show_full_names=0

# Les disques de la machine dans « Emplacements », comme « Ce PC » sous Windows.
#
# Grenofar : « est-ce qu'on peut les voir sur l'explorateur ? » La réponse
# était non, et la capture disait pourquoi mieux qu'une relecture : le lecteur
# de disquette apparaissait, les deux disques durs non. Le seul point commun
# des absents est qu'ils ne sont pas amovibles.
#
# `show_internal_volumes` existe bien — vérifié dans la table de chaînes de
# `libfm.so.4.2.0` du paquet trixie, où elle est la dernière clé du groupe
# `[config]`, et non écrite de mémoire comme l'avait été la règle polkit. Par
# défaut elle vaut 0 : libfm reçoit les disques internes et les cache.
#
# `places_unmounted` ci-dessus ne suffisait pas : il décide de montrer un
# volume **pas encore monté**, pas un volume **interne**. Deux filtres
# différents, et seul le premier était levé.
show_internal_volumes=1

# Le panneau « Emplacements », façon « Ce PC » de Windows.
#
# **Ces sept lignes étaient sous `[config]`, où elles ne servaient à rien.**
# Vérifié dans la table de chaînes de `libfm.so.4.2.0` : le nom d'un groupe y
# suit la première clé de ce groupe — `config` après `use_trash`, `ui` après
# `big_icon_size`, et **`places` après `places_home`**. Elles appartiennent
# donc à `[places]`, et libfm ignorait purement et simplement les nôtres.
#
# C'est pour cela que « Poste de travail » n'est jamais apparu malgré
# `places_computer=1`, et que le panneau ne ressemblait à rien de ce qu'on
# croyait avoir réglé. Une section fausse ne produit aucune erreur : le fichier
# se lit, les clés sont simplement ignorées — le silence habituel.
#
# Grenofar : « que l'explorateur soit encore plus proche de celui de Windows
# (ce PC, documents, vidéos etc) ». Poste de travail, le dossier personnel, le
# bureau, la corbeille, et les disques. Les dossiers usuels arrivent par les
# marque-pages, que la session pose au premier démarrage.
[places]
places_computer=1
places_home=1
places_desktop=1
places_trash=1
places_unmounted=1
# Windows n'a ni « Applications » ni « / » dans son volet de gauche, et les
# montrer ne ferait qu'allonger une liste qu'on veut courte.
places_applications=0
places_root=0
places_network=0

[ui]
big_icon_size=48
small_icon_size=20
pane_icon_size=20
thumbnail_size=128
show_thumbnail=1
thumbnail_local=1
thumbnail_max=4096
