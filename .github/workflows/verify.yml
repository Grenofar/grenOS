# Les « mains » de grenOS : la seule chose autorisée à dire « ça marche ».
#
# Les agents poussent sur agent/**. Ce workflow compile, boote dans QEMU, puis
# écrit son verdict directement dans Supabase — il ne renvoie rien au worker.
# Le worker apprend le résultat par Realtime, ce qui lui évite de sonder GitHub
# en boucle avec 256 Mo de RAM (D-002, D-005).
#
# Le repo est public, donc les minutes sont illimitées : le Testeur peut
# reboucler autant que nécessaire (D-006).

name: verify

on:
  push:
    branches: ["agent/**"]
  workflow_dispatch:

# Un seul run par branche : quand un agent pousse deux fois de suite, seul le
# dernier état compte et laisser tourner le précédent ne ferait qu'ajouter un
# verdict périmé dans la base.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Y a-t-il un kernel à vérifier ?
        id: probe
        run: |
          if [ -f kernel/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas encore de kernel/Cargo.toml — rien à compiler."
          fi

      - name: Toolchain Rust
        if: steps.probe.outputs.present == 'true'
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src,clippy,llvm-tools
          rustup default nightly

      - name: Cache cargo
        if: steps.probe.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
          key: cargo-${{ hashFiles('kernel/Cargo.toml', 'kernel/Cargo.lock') }}
          restore-keys: cargo-

      - name: QEMU et outils image
        if: steps.probe.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso mtools

      # ---- Étape 1 : compilation ------------------------------------------
      - name: cargo build
        id: build
        if: steps.probe.outputs.present == 'true'
        working-directory: kernel
        continue-on-error: true
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee "$RUNNER_TEMP/build.log"

      # ---- Étape 2 : lint ---------------------------------------------------
      - name: cargo clippy
        id: clippy
        if: steps.probe.outputs.present == 'true' && steps.build.outcome == 'success'
        working-directory: kernel
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --release -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"

      # ---- Étape 3 : boot réel dans QEMU -----------------------------------
      # Le timeout est le point important : un kernel qui pend doit ÉCHOUER,
      # pas attendre. Un run non concluant apprend au Testeur à ignorer le rouge.
      - name: boot QEMU
        id: qemu
        if: steps.probe.outputs.present == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          # `bash script` et non `./script` : les agents committent par l'API
          # GitHub, qui écrit tout en mode 100644. Le bit exécutable n'existe
          # donc jamais sur leurs fichiers, et un test `-x` échouerait toujours
          # — l'image ne serait pas construite et le Codeur recevrait un échec
          # qu'aucune correction de son code ne pourrait résoudre.
          if [ -f kernel/scripts/make-iso.sh ]; then
            echo "Construction de l'image via kernel/scripts/make-iso.sh"
            bash kernel/scripts/make-iso.sh
          fi

          IMAGE=$(find kernel -name '*.iso' -o -name '*.img' | head -n1)
          if [ -z "$IMAGE" ]; then
            echo "Aucune image bootable produite" | tee "$RUNNER_TEMP/qemu.log"
            exit 1
          fi

          timeout 90 qemu-system-x86_64 \
            -cdrom "$IMAGE" \
            -serial stdio \
            -display none \
            -no-reboot -no-shutdown \
            -m 256M \
            2>&1 | tee "$RUNNER_TEMP/qemu.log" || true

          # Un exit code propre ne prouve rien : on juge sur la sortie série.
          if grep -qiE 'panic|triple fault|double fault' "$RUNNER_TEMP/qemu.log"; then
            echo "::error::Le kernel a paniqué au boot"
            exit 1
          fi
          if ! grep -q 'grenOS' "$RUNNER_TEMP/qemu.log"; then
            echo "::error::Marqueur 'grenOS' absent de la sortie série"
            exit 1
          fi

      # ---- Étape 4 : verdict vers Supabase ---------------------------------
      # Toujours exécutée : un run qui ne rapporte rien laisse une tâche
      # bloquée en awaiting_verification jusqu'à intervention humaine.
      - name: Rapporter le verdict
        if: always()
        env:
          # L'URL du projet n'est pas un secret : elle part déjà en clair dans
          # le JavaScript du site à chaque visite. En exiger la configuration
          # ajoutait une étape — et une occasion de se tromper — pour aucun
          # gain. Elle reste surchargeable par un secret ou une variable.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
          # Celle-ci contourne toute la RLS : uniquement en secret, jamais en
          # variable — les variables sont lisibles en clair dans les logs d'un
          # dépôt public.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HAS_VAR_KEY: ${{ vars.SUPABASE_SERVICE_ROLE_KEY != '' }}
          PROBE: ${{ steps.probe.outputs.present }}
          BUILD: ${{ steps.build.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          QEMU: ${{ steps.qemu.outcome }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Verdict non transmis : le secret SUPABASE_SERVICE_ROLE_KEY est absent."
            echo "::error::https://github.com/Grenofar/grenOS/settings/secrets/actions/new"
            exit 1
          fi
          if [ "$HAS_VAR_KEY" = "true" ]; then
            echo "::warning::Une variable SUPABASE_SERVICE_ROLE_KEY existe. Les variables sont lisibles en clair dans les logs : supprime-la, seul le secret est utilisé."
          fi

          if [ "$PROBE" != "true" ]; then
            STATUS="error";   FAILURE="spec_gap"
          elif [ "$BUILD" != "success" ]; then
            STATUS="failed";  FAILURE="compile_error"
          elif [ "$CLIPPY" != "success" ]; then
            STATUS="failed";  FAILURE="compile_error"
          elif [ "$QEMU" != "success" ]; then
            STATUS="failed";  FAILURE="test_failure"
          else
            STATUS="passed";  FAILURE=""
          fi

          # On garde la fin des logs : l'erreur qui compte est presque toujours
          # la dernière, et un dump complet noie le Codeur au retour.
          : > combined.log
          for f in build clippy qemu; do
            if [ -f "$RUNNER_TEMP/$f.log" ]; then
              printf -- '--- %s ---
' "$f" >> combined.log
              cat "$RUNNER_TEMP/$f.log" >> combined.log
            fi
          done
          LOG=$(tail -c 6000 combined.log || true)
          [ -n "$LOG" ] || LOG="(aucun log : étapes non exécutées)"

          # JSON produit par python3 -c, pas par jq. Assembler du JSON dans un
          # programme jq passé au shell empile trois niveaux de guillemets, et
          # la moindre erreur produit un fichier vide que PostgREST rejette
          # avec « Empty or invalid json » — un message qui accuse les
          # identifiants alors que le corps était le problème. Les valeurs
          # passent par l'environnement : le shell ne les interprète jamais.
          BRANCH="$GITHUB_REF_NAME" SHA="$GITHUB_SHA" ST="$STATUS" FL="$FAILURE"           LOGTXT="$LOG" RUNID="$GITHUB_RUN_ID"           URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"           python3 -c 'import json,os,datetime; print(json.dumps({"branch":os.environ["BRANCH"],"commit_sha":os.environ["SHA"],"status":os.environ["ST"],"failure":os.environ["FL"] or None,"log_excerpt":os.environ["LOGTXT"],"log_url":os.environ["URL"],"workflow_run_id":int(os.environ["RUNID"]),"finished_at":datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}))' > payload.json

          echo "payload.json : $(wc -c < payload.json) octets"
          if [ ! -s payload.json ]; then
            echo "::error::payload.json est vide — la génération du corps a échoué."
            exit 1
          fi

          # --fail-with-body : sans ça curl sort en 0 même sur un 401, le
          # verdict n'arrive jamais et la tâche reste bloquée en
          # awaiting_verification sans que rien ne le signale.
          if ! curl -sS --fail-with-body -X POST "${SUPABASE_URL}/rest/v1/runs"                 -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"                 -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"                 -H "Content-Type: application/json"                 -H "Prefer: return=minimal"                 --data @payload.json; then
            echo "::error::Supabase a refusé le verdict (voir la réponse ci-dessus)."
            exit 1
          fi
          echo "Verdict transmis : $STATUS"

      - name: Échouer si la vérification a échoué
        if: always() && steps.probe.outputs.present == 'true'
        run: |
          [ "${{ steps.build.outcome }}"  = "success" ] || exit 1
          [ "${{ steps.clippy.outcome }}" = "success" ] || exit 1
          [ "${{ steps.qemu.outcome }}"   = "success" ] || exit 1
