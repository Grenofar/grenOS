# Les « mains » de grenOS : la seule chose autorisée à dire « ça marche ».
#
# Les agents poussent sur agent/**. Ce workflow compile, boote dans QEMU, puis
# écrit son verdict directement dans Supabase — il ne renvoie rien au worker.
# Le worker apprend le résultat par Realtime, ce qui lui évite de sonder GitHub
# en boucle avec 256 Mo de RAM (D-002, D-005).

name: verify

on:
  push:
    branches: ["agent/**"]
  workflow_dispatch:

# Un seul run par branche : quand un agent pousse deux fois de suite, seul le
# dernier état compte, et laisser tourner le précédent ajouterait un verdict
# périmé dans la base.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Y a-t-il un kernel a verifier
        id: probe
        run: |
          if [ -f kernel/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas encore de kernel/Cargo.toml, rien a compiler."
          fi

      # Un kernel/rust-toolchain.toml fixe le compilateur et fait foi. Sans lui
      # "nightly" change chaque jour : une dependance qui compilait la veille
      # casse le lendemain sans que l'agent ait rien change. Mission 1 s'est
      # heurtee a x86_64 0.14 face a un trait core::iter::Step modifie.
      - name: Toolchain Rust
        if: steps.probe.outputs.present == 'true'
        working-directory: kernel
        run: |
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup toolchain install || true
            rustup show
          else
            echo "::warning::Pas de kernel/rust-toolchain.toml : nightly du jour, build non reproductible."
            rustup toolchain install nightly --profile minimal --component rust-src,clippy,llvm-tools
            rustup default nightly
          fi

      - name: Cache cargo
        if: steps.probe.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
          key: cargo-${{ hashFiles('kernel/Cargo.toml', 'kernel/Cargo.lock') }}
          restore-keys: cargo-

      - name: QEMU et outils image
        if: steps.probe.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso mtools

      - name: cargo build
        id: build
        if: steps.probe.outputs.present == 'true'
        working-directory: kernel
        continue-on-error: true
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: cargo clippy
        id: clippy
        if: steps.probe.outputs.present == 'true' && steps.build.outcome == 'success'
        working-directory: kernel
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --release -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"

      # Le timeout est le point important : un kernel qui pend doit ECHOUER,
      # pas attendre. Un run non concluant apprend au Testeur a ignorer le rouge.
      - name: boot QEMU
        id: qemu
        if: steps.probe.outputs.present == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail

          # "bash script" et non "./script" : les agents committent par l'API
          # GitHub, qui ecrit tout en mode 100644. Le bit executable n'existe
          # jamais sur leurs fichiers, et un test -x echouerait toujours.
          #
          # Sa sortie part dans le log du verdict, sous "--- iso ---". Avant,
          # elle ne restait que sur la page du run : sur la mission 1, deux
          # tentatives ont echoue sur "could not find Cargo.toml" (script lance
          # depuis la racine du depot) sans que le Codeur puisse le lire.
          if [ -f kernel/scripts/make-iso.sh ]; then
            echo "Construction de l'image via kernel/scripts/make-iso.sh, lance depuis $(pwd)" | tee "$RUNNER_TEMP/iso.log"
            if ! bash kernel/scripts/make-iso.sh 2>&1 | tee -a "$RUNNER_TEMP/iso.log"; then
              echo "error: kernel/scripts/make-iso.sh failed (it runs from the repository root, not from kernel/)" | tee -a "$RUNNER_TEMP/iso.log"
              exit 1
            fi
          fi

          IMAGE=$(find kernel -name '*.iso' -o -name '*.img' | head -n1)
          if [ -z "$IMAGE" ]; then
            echo "Aucune image bootable produite" | tee "$RUNNER_TEMP/qemu.log"
            exit 1
          fi

          # L'ecran aussi (D-033) : QEMU tourne sans fenetre mais garde sa carte
          # graphique, et son moniteur en fait une capture a 25 s, apres le menu
          # de Limine (3 s) et le dessin du kernel. L'etape « ecran » la juge ;
          # la sortie serie reste jugee ici, comme avant.
          MONITOR="$RUNNER_TEMP/qemu-monitor.sock"
          timeout 90 qemu-system-x86_64 -cdrom "$IMAGE" -serial stdio -display none -no-reboot -no-shutdown -m 256M \
            -monitor "unix:$MONITOR,server,nowait" 2>&1 | tee "$RUNNER_TEMP/qemu.log" &
          sleep 25
          python3 scripts/ci-screen.py grab "$MONITOR" "$RUNNER_TEMP/screen.ppm" || true

          # Et les entrees (D-035) : le meme moniteur injecte un vrai mouvement
          # de souris, un vrai clic et de vraies touches. Le kernel doit le dire
          # sur la sortie serie ; l'etape « entrees » le verifie. Un bureau
          # dessine mais sourd est passe deux fois inapercu.
          python3 scripts/ci-screen.py send "$MONITOR" "mouse_move 90 60" "mouse_move -40 25" "mouse_button 1" "mouse_button 0" "sendkey a" "sendkey b" || true
          sleep 5
          wait || true

          # Un exit code propre ne prouve rien : on juge sur la sortie serie.
          if grep -qiE 'panic|triple fault|double fault' "$RUNNER_TEMP/qemu.log"; then
            echo "::error::Le kernel a panique au boot"
            exit 1
          fi
          if ! grep -q 'grenOS' "$RUNNER_TEMP/qemu.log"; then
            echo "::error::Marqueur grenOS absent de la sortie serie"
            exit 1
          fi

      # La capture prise pendant le boot, jugee par scripts/ci-screen.py : au
      # moins trois couleurs, aucune sur plus de 90 % de l'ecran. Exigee depuis
      # la mission du bureau (D-033) : un kernel qui boote sans rien dessiner
      # est rouge. Sa description, carte en lettres comprise, part dans le log
      # du verdict sous « --- screen --- » : c'est tout ce que les agents en voient.
      - name: ecran
        id: screen
        if: steps.qemu.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/ci-screen.py judge "$RUNNER_TEMP/screen.ppm" "$RUNNER_TEMP/screen.png" 2>&1 | tee "$RUNNER_TEMP/screen.log"

      # La souris et le clavier (D-035). QEMU a bouge la souris, clique et tape
      # pendant le boot ; le kernel imprime une ligne au premier paquet souris
      # decode et une au premier code clavier. Sans elles, le pilote PS/2 est
      # muet : c'est exactement la panne rapportee par l'humain le 2026-09-11,
      # invisible pour les etapes precedentes.
      - name: entrees souris et clavier
        id: input
        if: steps.qemu.outcome == 'success'
        continue-on-error: true
        run: |
          grep -E 'input:' "$RUNNER_TEMP/qemu.log" > "$RUNNER_TEMP/input.log" || true
          failed=0
          if ! grep -q 'input: first mouse packet' "$RUNNER_TEMP/qemu.log"; then
            echo "input: FAIL, aucun paquet souris decode alors que QEMU a bouge et clique" | tee -a "$RUNNER_TEMP/input.log"
            failed=1
          fi
          if ! grep -q 'input: first key' "$RUNNER_TEMP/qemu.log"; then
            echo "input: FAIL, aucune touche decodee alors que QEMU en a envoye deux" | tee -a "$RUNNER_TEMP/input.log"
            failed=1
          fi
          if [ "$failed" = "0" ]; then
            echo "input: PASS, la souris et le clavier arrivent au bureau" | tee -a "$RUNNER_TEMP/input.log"
          fi
          cat "$RUNNER_TEMP/input.log"
          exit "$failed"

      # Le reseau (D-037). QEMU met par defaut une carte e1000 derriere son
      # reseau utilisateur : serveur DHCP en 10.0.2.2, adresse 10.0.2.15. Le
      # kernel doit obtenir son adresse tout seul et voir revenir son ping.
      # Etape rendue obligatoire seulement apres l'avoir vue verte (run
      # 34689123565) : on n'exige pas ce qu'on n'a jamais vu passer.
      - name: reseau
        id: net
        if: steps.qemu.outcome == 'success'
        continue-on-error: true
        run: |
          grep -E '^net:' "$RUNNER_TEMP/qemu.log" > "$RUNNER_TEMP/net.log" || true
          failed=0
          if ! grep -q 'net: address ' "$RUNNER_TEMP/qemu.log"; then
            echo "net: FAIL, aucune adresse obtenue par DHCP" | tee -a "$RUNNER_TEMP/net.log"
            failed=1
          fi
          if ! grep -q 'net: gateway replied' "$RUNNER_TEMP/qemu.log"; then
            echo "net: FAIL, la passerelle n'a pas repondu au ping" | tee -a "$RUNNER_TEMP/net.log"
            failed=1
          fi
          if [ "$failed" = "0" ]; then
            echo "net: PASS, adresse obtenue par DHCP et passerelle joignable" | tee -a "$RUNNER_TEMP/net.log"
          fi
          cat "$RUNNER_TEMP/net.log"
          exit "$failed"

      # L'image qui vient de booter, telechargeable depuis la page du run
      # (section Artifacts) : c'est l'OS lui-meme, a lancer avec
      # qemu-system-x86_64 -cdrom <image> -serial stdio. Un souci d'artefact
      # ne doit jamais faire rougir un kernel qui boote.
      - name: Garder l'image qui boote
        if: steps.qemu.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: grenos-${{ github.sha }}
          path: kernel/**/*.iso
          if-no-files-found: ignore
          retention-days: 30

      # Toujours executee : un run qui ne rapporte rien laisse une tache
      # bloquee en awaiting_verification jusqu'a intervention humaine.
      - name: Rapporter le verdict
        if: always()
        env:
          # L'URL du projet n'est pas un secret : elle part deja en clair dans
          # le JavaScript du site a chaque visite. En exiger la configuration
          # ajoutait une etape, et une occasion de se tromper, pour aucun gain.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
          # Celle-ci contourne toute la RLS : uniquement en secret, jamais en
          # variable, car les variables sont lisibles en clair dans les logs.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HAS_VAR_KEY: ${{ vars.SUPABASE_SERVICE_ROLE_KEY != '' }}
          PROBE: ${{ steps.probe.outputs.present }}
          BUILD: ${{ steps.build.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          QEMU: ${{ steps.qemu.outcome }}
          SCREEN: ${{ steps.screen.outcome }}
          INPUT: ${{ steps.input.outcome }}
          NET: ${{ steps.net.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Une branche identique a main ne porte aucun travail d'agent. Juger
          # ce commit, c'est rendre un verdict sur rien, et ce verdict etait
          # impute a la tache comme une tentative ratee avant meme qu'elle ait
          # ecrit une ligne. Pas de travail, pas de verdict.
          git fetch -q --depth=1 origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::notice::Branche identique a main : aucun travail a juger, pas de verdict."
            exit 0
          fi

          # Un commit remplace ne juge plus rien. cancel-in-progress annule le
          # run d'un commit des qu'un plus recent arrive sur la branche, mais
          # cette etape tourne quand meme (always) : elle rapportait "failed"
          # pour un commit que plus personne n'attendait, et le trigger le
          # comptait comme une tentative de la tache qui attendait le verdict
          # du suivant. C'est le run du commit le plus recent qui juge.
          HEAD_NOW=$(git ls-remote --heads origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ -n "$HEAD_NOW" ] && [ "$HEAD_NOW" != "$GITHUB_SHA" ]; then
            echo "::notice::Commit remplace par ${HEAD_NOW:0:7} sur la branche : son run rendra le verdict."
            exit 0
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Verdict non transmis : le secret SUPABASE_SERVICE_ROLE_KEY est absent."
            echo "::error::https://github.com/Grenofar/grenOS/settings/secrets/actions/new"
            exit 1
          fi
          # La longueur et le nombre de points, jamais la valeur. Un secret
          # colle avec un retour a la ligne ou tronque casse le cadrage HTTP :
          # le serveur lit le corps comme un en-tete et repond "Empty or
          # invalid json", en accusant le corps qui n'y est pour rien.
          echo "cle : ${#SUPABASE_SERVICE_ROLE_KEY} caracteres, $(printf %s "$SUPABASE_SERVICE_ROLE_KEY" | tr -cd . | wc -c) points"
          case "$SUPABASE_SERVICE_ROLE_KEY" in
            *[[:space:]]*) echo "::error::Le secret contient une espace ou un retour a la ligne. Recolle-le sans saut de ligne." ;;
          esac

          if [ "$HAS_VAR_KEY" = "true" ]; then
            echo "::warning::Une variable SUPABASE_SERVICE_ROLE_KEY existe. Les variables sont lisibles en clair dans les logs : supprime-la."
          fi

          if [ "$PROBE" != "true" ]; then
            STATUS="error"
            FAILURE="spec_gap"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            # Interrompu sans avoir ete remplace : delai du job depasse, ou
            # annulation a la main. Rien n'a ete juge jusqu'au bout, et dire
            # "compile_error" enverrait le Codeur chercher une erreur qui
            # n'existe pas.
            STATUS="timeout"
            FAILURE=""
          elif [ "$BUILD" != "success" ]; then
            STATUS="failed"
            FAILURE="compile_error"
          elif [ "$CLIPPY" != "success" ]; then
            STATUS="failed"
            FAILURE="compile_error"
          elif [ "$QEMU" != "success" ]; then
            STATUS="failed"
            FAILURE="test_failure"
          elif [ "$SCREEN" != "success" ]; then
            STATUS="failed"
            FAILURE="test_failure"
          elif [ "$INPUT" != "success" ]; then
            STATUS="failed"
            FAILURE="test_failure"
          elif [ "$NET" != "success" ]; then
            STATUS="failed"
            FAILURE="test_failure"
          else
            STATUS="passed"
            FAILURE=""
          fi

          # On garde la fin des logs : l'erreur qui compte est presque toujours
          # la derniere, et un dump complet noie le Codeur au retour.
          : > combined.log
          for f in build clippy iso qemu screen input net; do
            if [ -f "$RUNNER_TEMP/$f.log" ]; then
              echo "--- $f ---" >> combined.log
              cat "$RUNNER_TEMP/$f.log" >> combined.log
            fi
          done
          LOG=$(tail -c 6000 combined.log || true)
          if [ -z "$LOG" ]; then
            LOG="(aucun log : etapes non executees)"
          fi

          # JSON produit par python3, pas par jq : assembler du JSON dans un
          # programme jq passe au shell empile trois niveaux de guillemets, et
          # la moindre erreur produit un fichier vide que PostgREST rejette
          # avec "Empty or invalid json" — un message qui accuse les
          # identifiants alors que le corps etait le probleme. Ici les valeurs
          # passent par l'environnement : le shell ne les interprete jamais.
          export BRANCH="$GITHUB_REF_NAME"
          export SHA="$GITHUB_SHA"
          export ST="$STATUS"
          export FL="$FAILURE"
          export LOGTXT="$LOG"
          export RUNID="$GITHUB_RUN_ID"
          export URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 scripts/ci-payload.py > payload.json

          echo "payload.json : $(wc -c < payload.json) octets"
          if [ ! -s payload.json ]; then
            echo "::error::payload.json est vide, la generation du corps a echoue."
            exit 1
          fi
          # Le corps ne contient aucun secret : branche, sha, statut, extrait de
          # log, URL publique. L'afficher est ce qui manquait pour diagnostiquer
          # un refus que PostgREST decrit comme "Empty or invalid json" sans
          # jamais dire quel caractere le gene.
          echo "--- corps envoye ---"
          cat payload.json
          echo "--- fin du corps ---"

          # --fail-with-body : sans ca curl sort en 0 meme sur un 401, le
          # verdict n'arrive jamais et la tache reste bloquee sans signal.
          if ! curl -sS --fail-with-body -X POST "${SUPABASE_URL}/rest/v1/runs" -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" -H "Content-Type: application/json" -H "Prefer: return=minimal" --data-binary @payload.json; then
            echo "::error::Supabase a refuse le verdict (voir la reponse ci-dessus)."
            exit 1
          fi
          echo "Verdict transmis : $STATUS"

      - name: Echouer si la verification a echoue
        if: always() && steps.probe.outputs.present == 'true'
        run: |
          [ "${{ steps.build.outcome }}" = "success" ] || exit 1
          [ "${{ steps.clippy.outcome }}" = "success" ] || exit 1
          [ "${{ steps.qemu.outcome }}" = "success" ] || exit 1
          [ "${{ steps.screen.outcome }}" = "success" ] || exit 1
          [ "${{ steps.input.outcome }}" = "success" ] || exit 1
          [ "${{ steps.net.outcome }}" = "success" ] || exit 1
