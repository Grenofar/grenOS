# Le correctif de clé et son essai rapide (20 novembre).
#
# Une construction complète prend deux heures. Pour la RTX 5060 de Grenofar
# (écran noir après le chargement), il fallait un chemin court : on prend la
# DERNIÈRE version publiée, on pose dessus le correctif (linux/correctif,
# une couche squashfs que live-boot empile au démarrage), on en fait une clé
# FAT32 comme la sienne, et on la démarre dans QEMU en UEFI Secure Boot.
#
# Trois machines, dans le même passage :
#   - firmware : la carte PCI n'a PAS de pilote (bochs écarté), l'écran est
#     l'image du firmware — ce qu'a sa RTX 5060 quand `nouveau` est écarté —
#     avec le GRUB de la clé corrigée (il ne change plus le mode vidéo) ;
#   - firmware-grub-ancien : pareil avec le GRUB de l'image publiée — pour
#     VOIR la panne (image rayée et verte), pas seulement sa réparation ;
#   - normal : la carte a son pilote — rien ne doit avoir changé.
#
# Le juge de ci-screen.py dit PASS dès trois couleurs : une image rayée et
# verte le trompe (20 novembre). On regarde donc aussi la TAILLE de la
# capture, qui doit être celle que le noyau annonce.
#
# Branches `cle/**` seulement : ni linux.yml ni natif.yml ne partent, donc
# aucune construction en cours n'est annulée.
name: Cle (correctif et essai rapide)

on:
  push:
    branches: ["cle/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version publiee a essayer (vide : la derniere)"
        default: ""

concurrency:
  group: cle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: firmware
            plus: "modprobe.blacklist=bochs"
            grub: linux/correctif/cle/boot/grub/config.cfg
          - nom: firmware-grub-ancien
            plus: "modprobe.blacklist=bochs"
            grub: ""
          - nom: normal
            plus: ""
            grub: linux/correctif/cle/boot/grub/config.cfg
          # L'APRÈS-ASSISTANT sur l'image du firmware (21 novembre) : chez
          # Grenofar, l'assistant fini, lightdm attendait sans fin (écran noir)
          # — aucun essai n'allait jusque-là, ils s'arrêtaient tous à
          # l'assistant. Ici l'assistant est sauté : lightdm doit ouvrir la
          # session tout seul, et le rapport doit le dire.
          - nom: firmware-bureau
            plus: "modprobe.blacklist=bochs systemd.mask=grenos-premier.service"
            grub: linux/correctif/cle/boot/grub/config.cfg
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools xorriso mtools dosfstools fdisk qemu-system-x86 ovmf python3
          sudo chmod 0666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm || echo "pas de KVM : QEMU emulera, plus lentement"

      - name: Le correctif
        run: bash linux/correctif/fabriquer.sh "$RUNNER_TEMP/arbre" "$RUNNER_TEMP/grenos-correctif.squashfs"

      - name: La version publiee
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          V="$VERSION"
          if [ -z "$V" ]; then
            # La derniere IMAGE (linux-...) : la version « createur » (le .exe
            # du createur de cle, 21 novembre) n'en est pas une.
            V=$(gh release list -R "$GITHUB_REPOSITORY" -L 20 --json tagName -q '[.[] | select(.tagName | startswith("linux-"))][0].tagName')
          fi
          echo "version : $V"
          gh release download "$V" -R "$GITHUB_REPOSITORY" -p '*.iso' -D "$RUNNER_TEMP/iso"
          ls -la "$RUNNER_TEMP/iso"

      - name: Ce que le noyau de l'image fait de l'ecran du firmware
        run: |
          ISO=$(ls "$RUNNER_TEMP"/iso/*.iso | head -1)
          xorriso -osirrox on -indev "$ISO" -extract /live/filesystem.squashfs "$RUNNER_TEMP/fs.sq" >/dev/null 2>&1
          unsquashfs -q -n -d "$RUNNER_TEMP/sq" "$RUNNER_TEMP/fs.sq" 'boot/config-*' 'usr/lib/xorg/modules/drivers' >/dev/null 2>&1 || true
          grep -hE 'CONFIG_(SYSFB|SYSFB_SIMPLEFB|DRM_SIMPLEDRM|DRM_EFIDRM|DRM_VESADRM|FB_EFI|DRM_BOCHS|DRM_NOUVEAU)=' "$RUNNER_TEMP"/sq/boot/config-* || echo "configuration du noyau illisible"
          echo "pilotes X livres : $(ls "$RUNNER_TEMP/sq/usr/lib/xorg/modules/drivers" 2>/dev/null | tr '\n' ' ')"
          rm -rf "$RUNNER_TEMP/fs.sq" "$RUNNER_TEMP/sq"

      - name: Ce qui pese dans l'initrd (lu par le firmware avant l'ecran de chargement)
        if: matrix.nom == 'normal'
        run: |
          sudo apt-get install -y -qq initramfs-tools-core zstd >/dev/null 2>&1 || true
          ISO=$(ls "$RUNNER_TEMP"/iso/*.iso | head -1)
          xorriso -osirrox on -indev "$ISO" -extract /live/initrd.img "$RUNNER_TEMP/initrd.img" >/dev/null 2>&1
          ls -la "$RUNNER_TEMP/initrd.img"
          mkdir -p "$RUNNER_TEMP/initrd"
          unmkinitramfs "$RUNNER_TEMP/initrd.img" "$RUNNER_TEMP/initrd" || true
          cd "$RUNNER_TEMP/initrd"
          echo "== total par partie"; du -sh ./* 2>/dev/null
          M=$(find . -type d -path '*/lib/modules/*/kernel' | head -1)
          echo "== modules ($M)"; du -s "$M"/*/ "$M"/drivers/*/ "$M"/drivers/net/*/ 2>/dev/null | sort -rn | head -25
          F=$(find . -type d -path '*/lib/firmware' | head -1)
          echo "== firmware ($F)"; du -s "$F"/*/ "$F"/* 2>/dev/null | sort -rn | head -25
          rm -rf "$RUNNER_TEMP/initrd" "$RUNNER_TEMP/initrd.img"

      - name: La cle FAT32 (${{ matrix.nom }})
        env:
          PLUS: ${{ matrix.plus }}
          GRUB_CONFIG: ${{ matrix.grub }}
        run: |
          ISO=$(ls "$RUNNER_TEMP"/iso/*.iso | head -1)
          bash linux/correctif/cle-fat.sh "$ISO" "$RUNNER_TEMP/grenos-correctif.squashfs" "$RUNNER_TEMP/cle.img" "$PLUS"
          rm -rf "$RUNNER_TEMP/iso"

      - name: Demarrage (${{ matrix.nom }})
        run: bash linux/correctif/essai-qemu.sh "$RUNNER_TEMP/cle.img" "$RUNNER_TEMP/sortie" 270

      - name: Ce que la cle a ecrit
        if: always()
        run: |
          D=$(ls -1d "$RUNNER_TEMP"/sortie/grenos-rapports/2*/ 2>/dev/null | tail -1)
          if [ -z "$D" ]; then
            echo "::warning::Aucun rapport ecrit sur la cle."
            tail -n 60 "$RUNNER_TEMP/sortie/serial.log" 2>/dev/null || true
            exit 0
          fi
          echo "rapport : $D"
          # La taille de l'écran que le noyau croit, contre celle des captures.
          NOYAU=$(grep -ohE 'efifb: mode is [0-9]+x[0-9]+' "$D/30-noyau.txt" | head -1 | sed 's/.* //')
          CAPTURE=$(head -1 "$RUNNER_TEMP"/sortie/ecran-110s.txt 2>/dev/null | cut -d, -f1)
          echo "geometrie : noyau ${NOYAU:-(pas d efifb)}, capture ${CAPTURE:-?}"
          if [ -n "$NOYAU" ] && [ -n "$CAPTURE" ] && [ "$NOYAU" != "$CAPTURE" ]; then
            echo "::warning::L'ecran affiche ${CAPTURE} mais le noyau peint en ${NOYAU} : image rayee."
          fi
          cat "$D/00-resume.txt"
          echo "=================== demarrage"
          head -n 30 "$D/10-demarrage.txt" 2>/dev/null || true
          echo "=================== Xorg"
          grep -hE '\(EE\)|\(WW\)|Fatal|no screens|Cannot run|modeset\(|VESA|Loading .*drivers|kmsdev' "$D/40-xorg.txt" 2>/dev/null | head -80 || true
          echo "=================== lightdm et la session"
          sed -n '/lightdm.log/,/^========/p' "$D/40-xorg.txt" 2>/dev/null | head -40 || true
          grep -hE 'session : |New session|seat0|CanGraphical|souris' "$D/20-journal.txt" 2>/dev/null | head -20 || true
          # Le verdict de l'après-assistant : une session DOIT s'être ouverte.
          if [ "${{ matrix.nom }}" = firmware-bureau ]; then
            if grep -q 'AUCUNE session' "$D/20-journal.txt" 2>/dev/null || \
               ! grep -q 'New session' "$D/20-journal.txt" 2>/dev/null; then
              echo "::error::Image du firmware : lightdm n'a ouvert AUCUNE session (l'ecran noir de Grenofar)."
              exit 1
            fi
            echo "image du firmware : la session s'est ouverte"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cle-${{ matrix.nom }}
          path: ${{ runner.temp }}/sortie
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: matrix.nom == 'firmware'
        with:
          name: grenos-correctif
          path: ${{ runner.temp }}/grenos-correctif.squashfs
          retention-days: 30

  # L'INSTALLATION DE BOUT EN BOUT (21 novembre). Quatre installations de
  # Grenofar ont échoué, chacune une étape plus loin (unsquashfs, apt dans le
  # chroot, la clé prise pour partition EFI). Aucun essai n'allait jusqu'au
  # disque installé : celui-ci installe la dernière version (plus le
  # correctif) sur un disque SATA vierge, comme « Effacer le disque », puis
  # démarre CE disque seul, en Secure Boot, jusqu'à l'assistant. Voir
  # linux/correctif/essai-installation.sh.
  installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Faire de la place (le systeme installe pese plusieurs Go)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      - name: Outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools xorriso mtools dosfstools fdisk e2fsprogs qemu-system-x86 ovmf python3
          sudo chmod 0666 /dev/kvm 2>/dev/null || true

      - name: Le correctif
        run: bash linux/correctif/fabriquer.sh "$RUNNER_TEMP/arbre" "$RUNNER_TEMP/grenos-correctif.squashfs"

      - name: La version publiee
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          V="$VERSION"
          if [ -z "$V" ]; then
            V=$(gh release list -R "$GITHUB_REPOSITORY" -L 20 --json tagName -q '[.[] | select(.tagName | startswith("linux-"))][0].tagName')
          fi
          echo "version : $V"
          gh release download "$V" -R "$GITHUB_REPOSITORY" -p '*.iso' -D "$RUNNER_TEMP/iso"

      - name: Installer, puis demarrer le systeme installe (Secure Boot)
        run: |
          ISO=$(ls "$RUNNER_TEMP"/iso/*.iso | head -1)
          sudo bash linux/correctif/essai-installation.sh "$ISO" "$RUNNER_TEMP/grenos-correctif.squashfs" "$RUNNER_TEMP/installation"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation
          path: |
            ${{ runner.temp }}/installation/*.png
            ${{ runner.temp }}/installation/*.txt
            ${{ runner.temp }}/installation/serie.log
          retention-days: 14
