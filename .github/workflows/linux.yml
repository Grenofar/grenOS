# grenOS, édition Linux : construire l'image, la démarrer pour de vrai, et ne
# publier que ce qui a montré un bureau.
#
# L'image fait plus d'un gigaoctet : Supabase est plafonné à 1 Go, donc la
# publication passe par les Releases GitHub (2 Go par fichier).
name: linux

on:
  push:
    branches: [main, "agent/**", "claude/**"]
    paths:
      - "linux/**"
      - ".github/workflows/linux.yml"
      - "scripts/ci-screen.py"
      # Le script de demarrage vit ici depuis qu'il a depasse les 21 000
      # caracteres d'un « run: ». Sans cette ligne, le modifier ne
      # declencherait aucune construction.
      - "scripts/ci-demarrage.sh"
      - "scripts/verif-vbox-promesse.py"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier une Release avec l'image"
        type: boolean
        default: false

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Le runner a une douzaine de gigaoctets libres, et une image KDE en
      # demande le double le temps de la construire.
      # Trois constructions perdues les 23 et 24 septembre pour la meme raison :
      # une edition de ce fichier qui perd sa continuation de ligne et laisse
      # deux caracteres — une barre oblique inverse suivie d'un n — au milieu
      # d'une commande. Le shell les passe alors comme argument, et la commande
      # echoue vingt minutes plus tard, loin de sa cause. Trois secondes ici
      # valent mieux que vingt minutes la-bas.
      # Ce controle est un fichier a part, et pas un script dans ce YAML : les
      # sequences d'echappement ne survivent pas a une reecriture, et c'est
      # precisement l'accident qu'il sert a attraper. Il a ete casse deux fois
      # en essayant de l'ecrire ici.
      - name: Aucune continuation de ligne perdue
        run: python3 scripts/verif-flux.py .github/workflows/linux.yml

      # Une phrase sans accents se lit encore : c'est pour cela qu'elle passe
      # les relectures. Le 24 septembre, le catalogue en portait deux depuis
      # une semaine ; le 25, l'infobulle du reseau en portait trois, ecrites
      # une heure plus tot, dans un texte que je venais de relire moi-meme.
      # Trois secondes ici, contre une faute d'orthographe dans l'image publiee.
      - name: Les textes affiches ont leurs accents
        run: python3 linux/tools/verif-accents.py

      # Trois fois la meme faute : la page Jeux attendait vulkaninfo vingt-cinq
      # secondes avant de s'afficher, et Connexions interrogeait nmcli et
      # bluetoothctl cinq fois dans son constructeur — DEUX MINUTES d'ecran
      # vide, mesurees par Grenofar le 25 septembre. La fenetre finissait par
      # s'ouvrir, donc rien ne rougissait.
      - name: Aucune fenetre n interroge le materiel en se dessinant
        run: python3 linux/tools/verif-fenetres.py

      # La construction 38588801230 est morte apres dix-huit minutes sur une
      # icone nommee « n ». La cause tenait a deux caracteres : une
      # continuation de ligne dont l anti-slash avait ete mange, arrivee dans
      # le fichier sous la forme d un \n litteral, que le shell lit comme la
      # lettre n. `bash -n` ne voit rien — la ligne est du shell valide.
      # Septieme fois que ce piege mord ce depot, toujours par une edition en
      # heredoc. Une regle qu on relit ne vaut pas une machine qui refuse.
      - name: Aucun echappement egare dans nos scripts shell
        run: python3 linux/tools/verif-shell.py

      # La machine d essai ouvre nos applications en tapant dans le menu. Le
      # bloc de GrenPlace portait ce commentaire : « grenp ne designe que
      # lui ». C etait vrai — jusqu a ce que grenHub et grenPerf arrivent, et
      # que grenperf passe avant grenplace dans l ordre alphabetique. La
      # machine a ouvert grenPerf en croyant ouvrir GrenPlace, et la preuve
      # bloquante n est jamais venue. L hypothese etait ecrite en toutes
      # lettres dans un commentaire, ou aucune machine ne la relisait.
      - name: Chaque recherche du parcours ne designe qu une application
        run: python3 linux/tools/verif-recherches.py

      # LA RECHERCHE QUE J AI AJOUTEE A TUE LE RENOMMAGE, et il a fallu une
      # construction de quarante minutes pour l apprendre. Echap effacait le
      # texte du champ et LAISSAIT le clavier dedans : la barriere « on est en
      # train d ecrire » avalait ensuite F2, Suppr, Retour arriere et Ctrl+H.
      # La machine l a dit par l autre bout — les quatre lettres du renommage
      # sont arrivees dans le champ de recherche.
      #
      # Cet essai extrait `au_clavier` DU FICHIER LIVRE par l arbre
      # syntaxique et l appelle pour de vrai : recopier son corps ferait deux
      # claviers d une meme fenetre, et c est alors la copie qu on croirait.
      # Rejoue sur la version qui a casse, il refuse exactement les deux cas
      # de la panne — un garde qu on n a pas vu refuser n est pas un garde.
      - name: Le clavier de l explorateur, 28 cas
        run: python3 linux/tools/essai-clavier-fichiers.py

      # LA TEMPERATURE ET LES VENTILATEURS, sur de faux /sys fabriques : la
      # machine d integration n a ni sonde ni ventilateur, donc elle ne peut
      # rien prouver de ce qui se passe chez lui. Un arbre de fichiers ecrit
      # exprès, lui, peut porter le portable qui n a que des zones ACPI, la
      # sonde debranchee a -273 et le ventilateur arrete a zero.
      #
      # Le troisieme cas a paye l essai au premier passage : sans `hwmon`, la
      # lecture sortait avant meme de regarder les zones ACPI.
      - name: La temperature et les ventilateurs, 10 cas
        run: python3 linux/tools/essai-sante-thermique.py

      # Le verdict du journal persistant est rendu bien plus loin, dans
      # l etape UEFI — le seul endroit ou la meme machine a deja demarre. Il
      # est exerce ICI, avant la construction, sur sept journaux ecrits
      # exprès : le bloc est extrait du workflow lui-meme, donc l essai et la
      # chose jugee ne peuvent pas diverger.
      - name: Le verdict du journal persistant, 7 cas
        run: sh linux/tools/essai-journal-persistant.sh

      # CE QUE L ASSISTANT FAIT, pas ce qu il dit. I7 est le seul ecran dont
      # le choix installe quelque chose ; neuf ecrans sur dix rangeaient une
      # preference dans un fichier et rien n arrivait. Le controle verifie que
      # chaque profil d usage ne nomme que des fiches QUI EXISTENT au
      # catalogue — c est la faute du 25 septembre, ou `partition.conf`
      # offrait btrfs sans `mkfs.btrfs` — et que l installateur sans ecran
      # s arrete avant la borne de la file plutot que de se faire couper au
      # milieu d un dpkg.
      - name: Ce que l assistant installe vraiment, 17 cas
        run: python3 linux/tools/essai-premier-travaux.py

      # DEUX PAQUETS NE PEUVENT PAS POSSEDER LE MEME CHEMIN, et j'ai paye cette
      # phrase une seconde fois : un glob sur `etc/**/*.conf` a ramasse
      # `etc/lightdm/lightdm-gtk-greeter.conf`, dpkg a repondu « trying to
      # overwrite […] which is also in package lightdm-gtk-greeter », et la
      # construction est morte. La lecon du 24 septembre, dans le fichier meme
      # qui la porte.
      #
      # L'essai juge le tri a trois issues : un reglage a nous part dans le
      # paquet, un chemin partage part en modele pose par appliquer-systeme, et
      # un troisieme cas ARRETE la construction au lieu de laisser une machine
      # mise a jour sans le reglage que l'image a. Rejoue sur la version qui a
      # casse, il refuse cinq cas sur huit.
      - name: Les reglages de /etc, le bon tri, 8 cas
        run: sh linux/tools/essai-reglages-paquet.sh

      # Un document livre par un agent, vert en CI, et faux sur quatre gardes
      # sur cinq — avec en derniere ligne « aucun chemin n'est invente dans ce
      # document ». Une CI verte dit que le fichier se lit ; elle ne dit pas
      # qu'il dit vrai. Ce controle ne verifie que ce qui est mecanique — un
      # chemin cite existe-t-il —, et il le dit lui-meme : juger une
      # description reste a la relecture.
      #
      # RAPPORTE, pas bloquant : deux passages verts avant d'exiger.
      - name: Chaque chemin cite par la documentation existe
        continue-on-error: true
        run: python3 linux/tools/verif-docs.py

      # Un agent a livre `linux/tools/verif-catalogue.py` le 15 octobre, sa
      # tache a ete marquee **done**, et le fichier ne compilait pas : des
      # guillemets echappes a la deuxieme ligne. Rien ne l'a vu, parce que la
      # construction compile ce qui part dans l'image, pas `linux/tools/`, qui
      # reste sur la machine qui construit. Un outil casse y dormait donc
      # jusqu'au jour ou quelqu'un l'appelle — c'est-a-dire le jour ou il
      # devait servir.
      - name: Nos outils compilent-ils
        run: python3 linux/tools/verif-outils.py

      # Le 24 septembre, une branche d'agent a REMPLACE le catalogue au lieu
      # d'y ajouter des fiches, ressuscite le « Magasin » que Grenofar avait
      # demande de retirer, et mis six outils en ligne de commande dans une
      # boutique a boutons « Installer ». La CI etait verte.
      - name: Le catalogue de GrenPlace tient-il debout
        run: python3 linux/tools/verif-catalogue.py

      - name: Faire de la place
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h /

      - name: Outils de l'hôte
        # BORNEE DANS LE TEMPS, ET ELLE NE L ETAIT PAS.
        #
        # Le 7 octobre, cette etape est restee VINGT-CINQ MINUTES sur un
        # `apt-get update` — un miroir du runner qui ne repondait plus. Sans
        # limite, elle aurait tenu la construction entiere jusqu au delai par
        # defaut de GitHub, soit six heures, pour une image que personne
        # n aurait vue. Il a fallu pousser sur la branche pour la tuer, parce
        # que le jeton du worker ne peut pas annuler un run (403, note du
        # 24 septembre).
        #
        # Dix minutes suffisent largement : au tour precedent, les etapes 7 a
        # 11 ont tenu en moins de cinq. Au-dela, ce n est plus de la lenteur.
        timeout-minutes: 10
        run: |
          # Trois essais, chacun borne. Un miroir qui ne repond pas est une
          # panne passagere : la retenter coute quelques secondes, et
          # echouer tout de suite coute une construction.
          for essai in 1 2 3; do
            if timeout 180 sudo apt-get update -qq; then
              break
            fi
            echo "apt-get update : essai $essai sans reponse, on recommence"
            sleep 5
          done
          # gdisk et e2fsprogs servent au disque de persistance, construit avant
          # le demarrage : la machine d'essai doit partir sur celui qu'on livre.
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils zip python3 gdisk e2fsprogs
          # Le peripherique existe sur les runners, mais appartient au groupe
          # kvm : sans droit d'ecriture, QEMU refuse de demarrer au lieu de se
          # rabattre sur l'emulation.
          sudo chmod 0666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm || echo "pas de KVM : QEMU emulera, c'est plus lent"

      # La clé du dépôt APT de grenOS. Elle est fabriquée une seule fois, par
      # la CI, et gardée dans le bucket privé `signing` : personne ne la voit
      # passer, et l'image n'embarque que sa partie publique.
      - name: La cle du depot
        id: key
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -u
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Pas de cle de service : le depot APT ne sera ni signe ni publie."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OBJ="$SUPABASE_URL/storage/v1/object/signing/apt-signing.asc"
          code=$(curl -s -o secret.asc -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "$OBJ")
          if [ "$code" != "200" ]; then
            echo "Pas encore de cle : on en fabrique une, une seule fois."
            rm -f secret.asc
            export GNUPGHOME=$(mktemp -d)
            chmod 700 "$GNUPGHOME"
            gpg --batch --passphrase "" --quick-generate-key \
                "grenOS packages <grenos@grenos-dev.vercel.app>" rsa4096 sign never
            gpg --batch --armor --export-secret-keys > secret.asc
            up=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "content-type: application/pgp-keys" \
              -H "x-upsert: true" \
              --data-binary @secret.asc "$OBJ")
            echo "depot de la cle privee : HTTP $up"
            [ "$up" = "200" ] || { echo "::error::La cle n'a pas pu etre gardee : on n'en fabrique pas une autre."; exit 1; }
            rm -rf "$GNUPGHOME"
          else
            echo "cle relue depuis le bucket prive"
          fi
          # La partie publique, celle que l'image embarque.
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import secret.asc
          gpg --batch --export > linux/grenos-apt.gpg
          gpg --batch --armor --export > linux/grenos-apt.asc
          rm -rf "$GNUPGHOME"
          ls -l linux/grenos-apt.gpg linux/grenos-apt.asc
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Le paquet grenos-desktop et le dépôt APT : c'est par là que grenOS se
      # met à jour depuis grenOS, en plus des correctifs Debian.
      # Le catalogue de GrenPlace vit dans notre backend, pas dans l'image :
      # ajouter une application ne demande ni nouvelle image ni mise a jour du
      # systeme. On le republie a chaque construction, c'est idempotent.
      # Verifie partout, publie seulement depuis `main` : le magasin des vraies
      # machines n'appartient pas a une branche. Le 24 septembre a 19h38, la
      # construction d'une branche d'agent a remplace nos 29 applications par
      # 17 autres, que personne n'avait relues.
      # AUCUNE APPLICATION PERDUE — ET CETTE PORTE ETAIT GRANDE OUVERTE.
      #
      # Le 15 octobre au soir, une branche d'agent a ramene le catalogue de
      # **121 fiches a 23** en annoncant « Added 21 verified applications ».
      # Le controle a parfaitement vu les 97 disparues et les a nommees — et
      # le `continue-on-error` qui couvrait toute l'etape a rendu son refus
      # muet. La branche serait partie en fusion automatique au premier run
      # vert ; seule une regression sans rapport l'en a empechee. Ce n'est pas
      # un garde, c'est une chance.
      #
      # C'est la faute exacte du 15 octobre a l'etage du dessus : un
      # `continue-on-error` rend la CONCLUSION verte alors que l'issue reste
      # rouge. La verification ne demande aucune cle (`--verifier` le dit en
      # toutes lettres), donc elle n'a aucune raison d'etre toleree.
      - name: Aucune application perdue au catalogue
        run: python3 linux/tools/publier-catalogue.py --verifier

      # PUBLIER, en revanche, demande le reseau et la cle de service : son
      # echec peut ne rien devoir a grenOS. Il reste donc tolere, et seulement
      # depuis `main` — le magasin des vraies machines n'appartient pas a une
      # branche.
      - name: Publier le catalogue du magasin
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 linux/tools/publier-catalogue.py

      # Fabriquer, oui, depuis n'importe quelle branche : l'image en a besoin.
      # **Publier**, non — voir l'etape suivante.
      - name: Le paquet grenOS
        id: apt
        if: steps.key.outputs.ready == 'true'
        run: |
          sudo apt-get install -y -qq dpkg-dev python3-numpy
          VERSION="1.0.$(date -u +%Y%m%d%H%M)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          linux/tools/make-deb.sh "$VERSION" dist
          # L'image installe ses propres paquets, au lieu de se contenter d'en
          # copier les fichiers. C'est ce qui manquait pour que la mise a jour
          # fonctionne : sans entree dans dpkg, « apt full-upgrade » ne trouvait
          # rien de grenOS a mettre a jour, et n'apportait que les correctifs
          # Debian. live-build installe ce qui se trouve dans packages.chroot.
          mkdir -p linux/config/packages.chroot
          cp "dist/grenos-systeme_${VERSION}_all.deb" "dist/grenos-desktop_${VERSION}_all.deb" linux/config/packages.chroot/
          ls -l linux/config/packages.chroot/
          APT_SECRET_KEY="$PWD/secret.asc" linux/tools/make-apt-repo.sh apt "dist/grenos-systeme_${VERSION}_all.deb" "dist/grenos-desktop_${VERSION}_all.deb"

      # Le depot APT est ce que les vraies machines interrogent pour se mettre
      # a jour. **Seule `main` a le droit d'y ecrire.**
      #
      # Le 24 septembre a 19h38, la construction d'une branche d'agent l'a
      # ecrase : le depot s'est mis a proposer un paquet que personne n'avait
      # relu, et le catalogue du magasin est passe de nos 29 applications a 17
      # autres. Une machine qui aurait lance « Mettre a jour grenOS » a ce
      # moment-la aurait installe le travail en cours d'un agent.
      #
      # Fabriquer depuis une branche est utile — cela prouve que le paquet se
      # construit. Publier ne l'est pas.
      - name: Publier le depot APT
        if: steps.key.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Un dépôt APT n'est qu'un ensemble de fichiers : on les dépose un à
          # un dans le bucket public, en écrasant les anciens.
          find apt -type f | while read -r file; do
            target="${file#apt/}"
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "x-upsert: true" -H "cache-control: max-age=60" --data-binary @"$file" "$SUPABASE_URL/storage/v1/object/apt/$target")
            echo "$target : HTTP $code"
            [ "$code" = "200" ] || exit 1
          done
          echo "depot publie : $SUPABASE_URL/storage/v1/object/public/apt"

      # La mise a jour depuis l'OS est la promesse qui evite de regraver une
      # image a chaque nouveaute. Elle merite donc d'etre exercee, pas
      # seulement ecrite : on part d'une Debian nue, on ajoute notre depot
      # comme le fait l'image, et on installe. Si cela echoue ici, aucune
      # machine ne pourra se mettre a jour — et rien ne sera publie.
      - name: La mise a jour fonctionne-t-elle
        id: maj
        if: steps.key.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e DEBIAN_FRONTEND=noninteractive -e DEPOT="$SUPABASE_URL/storage/v1/object/public/apt" \
            debian:trixie sh /work/linux/tools/essai-maj.sh

      # live-build monte des systèmes de fichiers et fait un debootstrap : cela
      # se passe dans un conteneur Debian privilégié, jamais sur le runner.
      - name: Construire l'image
        id: build
        run: |
          # `commande | tail` rend le code de TAIL, qui reussit toujours.
          # C'etait ecrit douze lignes plus bas, pour l'etape UEFI, et pourtant
          # ici meme : la construction pouvait echouer sans que l'etape rougisse,
          # et TOUS les controles du hook — icones en 24x24, « Magasin » revenu,
          # tailles de fenetre en dur, autorisations polkit — etaient donc sans
          # dents. Ils refusaient une image que personne n'ecoutait.
          #
          # Le journal complet part dans un fichier, garde en artefact : `tail`
          # coupait a 200 lignes, et le hook parle bien avant la fin, donc ses
          # messages n'arrivaient jamais jusqu'a moi.
          set -o pipefail
          RATE=0
          docker run --privileged --rm \
            -v "$PWD:/work" -w /work \
            -e LB_PARENT_MIRROR_BOOTSTRAP=http://deb.debian.org/debian \
            debian:trixie sh /work/linux/build.sh \
            > "$RUNNER_TEMP/construction.log" 2>&1 || RATE=1

          # Le journal entier fait des dizaines de milliers de lignes — 770
          # paquets qui se telechargent. On garde en artefact ce qui se lit :
          # nos propres lignes, et la fin.
          {
            echo "--- ce que grenOS a verifie pendant la construction ---"
            grep -a "grenos:" "$RUNNER_TEMP/construction.log" || echo "(aucune ligne grenos:)"
            echo "--- les 400 dernieres lignes ---"
            tail -n 400 "$RUNNER_TEMP/construction.log"
          } > "$RUNNER_TEMP/construction-resume.log"
          rm -f "$RUNNER_TEMP/construction.log"

          # Ce que le hook a verifie, en clair : c'est la seule facon de savoir
          # qu'un controle a vraiment tourne plutot que d'etre saute en silence.
          grep -a "grenos:" "$RUNNER_TEMP/construction-resume.log" || true
          if [ "$RATE" = 1 ]; then
            # DIRE POURQUOI, PAS SEULEMENT QUE.
            #
            # Le 7 octobre au soir, cette etape a echoue et le message etait
            # « La construction de l'image a echoue ». Il a fallu descendre
            # dans 6 700 lignes de journal pour trouver la vraie cause, une
            # seule ligne :
            #
            #     xargs: apt-get: terminated by signal 9
            #
            # Signal 9, c'est SIGKILL : le tueur de memoire du runner a abattu
            # apt-get pendant qu'il deballait 997 Mo de paquets. Rien a voir
            # avec notre code — mais rien ne le disait, et on cherche d abord
            # chez soi.
            #
            # Les trois signatures ci-dessous sont celles qu on a vues ou qui
            # se ressemblent assez pour valoir la peine d etre nommees. Quand
            # aucune ne matche, on se tait : inventer une cause est pire que
            # n en donner aucune.
            if grep -aqE 'signal 9|Killed|Out of memory|oom-kill' "$RUNNER_TEMP/construction-resume.log"; then
              echo "::error::PANNE DU RUNNER, PAS DE grenOS : apt-get a ete tue (signal 9 / OOM) pendant l installation. A relancer tel quel."
            elif grep -aqE 'No space left on device' "$RUNNER_TEMP/construction-resume.log"; then
              echo "::error::PANNE DU RUNNER, PAS DE grenOS : plus de place disque. A relancer tel quel."
            elif grep -aqE 'Temporary failure resolving|Connection timed out|Hash Sum mismatch' "$RUNNER_TEMP/construction-resume.log"; then
              echo "::error::PANNE DE MIROIR, PAS DE grenOS : un depot Debian n a pas repondu. A relancer tel quel."
            fi
            free -h || true
            df -h / || true
            echo "::error::La construction de l'image a echoue."
            tail -n 200 "$RUNNER_TEMP/construction-resume.log"
            exit 1
          fi
          tail -n 60 "$RUNNER_TEMP/construction-resume.log"
          # Le conteneur ecrit en root ; la suite (lien, zip, artefact) tourne
          # sous le compte du runner.
          sudo chown -R "$(id -u):$(id -g)" linux || true
          ISO=$(ls linux/*.iso | head -1)
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$ISO")" >> "$GITHUB_OUTPUT"
          ls -la linux/*.iso

      - name: L'image démarre-t-elle vraiment
        id: boot
        continue-on-error: true
        env:
          ISO_CONSTRUITE: ${{ steps.build.outputs.iso }}
        run: bash scripts/ci-demarrage.sh

      # Presque aucun PC vendu depuis dix ans ne demarre en BIOS, et c'est
      # pourtant le seul mode que la machine d'essai avait jamais essaye. On
      # verifiait que la partition EFI existe ; on ne verifiait pas qu'elle
      # demarre. Un firmware UEFI qui refuse l'image dit « aucun support
      # amorcable » et rien d'autre : la panne serait pour lui, pas pour nous.
      #
      # Quatre-vingt-dix secondes suffisent : on ne cherche pas le bureau, on
      # cherche la preuve que le chargeur a pris la main et que le noyau
      # dessine. Un shell UEFI, lui, reste noir avec du texte blanc — deux
      # couleurs, et le noir couvre tout : le juge le refuse.
      - name: L'image demarre-t-elle en UEFI
        id: uefi
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq ovmf
          CODE=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          VARS=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          if [ -z "$CODE" ] || [ -z "$VARS" ]; then
            echo "::warning::OVMF introuvable : le demarrage UEFI n'a pas pu etre essaye."
            exit 0
          fi
          echo "firmware : $CODE"
          cp "$VARS" "$RUNNER_TEMP/uefi-vars.fd"
          ACCEL=""
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; fi
          # Le MEME disque de persistance que le premier demarrage, et c'est
          # nouveau : ce second demarrage devient du meme coup la seule preuve
          # possible de « tout ce que tu fais est garde sur le disque de la
          # machine ». On prouvait que live-boot trouvait sa partition, jamais
          # qu'un fichier ecrit revenait. Une machine qui ne demarre qu'une
          # fois ne peut pas repondre ; celle-ci demarre deux fois.
          GARDE=""
          if [ -f "$RUNNER_TEMP/persistence.vdi" ]; then
            GARDE="-drive file=$RUNNER_TEMP/persistence.vdi,format=vdi,if=none,id=garde2 -device ahci,id=sata2 -device ide-hd,drive=garde2,bus=sata2.0"
          fi
          qemu-system-x86_64 $ACCEL -m 2048 -smp 2 -drive if=pflash,format=raw,readonly=on,file="$CODE" -drive if=pflash,format=raw,file="$RUNNER_TEMP/uefi-vars.fd" -cdrom "$ISO_UEFI" -boot d $GARDE -display none -vga std -serial file:"$RUNNER_TEMP/serial-uefi.log" -monitor unix:"$RUNNER_TEMP/uefi.sock",server,nowait -no-reboot &
          QEMU=$!
          sleep 3
          if ! kill -0 "$QEMU" 2>/dev/null; then
            echo "::error::QEMU n'a pas demarre en UEFI : sa ligne de commande est fautive."
            exit 1
          fi
          sleep 90
          python3 scripts/ci-screen.py grab "$RUNNER_TEMP/uefi.sock" "$RUNNER_TEMP/ecran-uefi.ppm" || true
          kill $QEMU 2>/dev/null || true
          # Le verdict se lit dans la sortie, pas dans le code de retour d'un
          # tube : `commande | tail` rend le code de `tail`, qui reussit
          # toujours. C'est le meme piege que le « grep -c » qui laissait
          # passer un test de souris muet.
          python3 scripts/ci-screen.py judge "$RUNNER_TEMP/ecran-uefi.ppm" "$RUNNER_TEMP/uefi.png" > "$RUNNER_TEMP/uefi-juge.log" 2>&1 || true
          tail -3 "$RUNNER_TEMP/uefi-juge.log" || true
          # Exige depuis le 2026-09-25 : vu vert trois constructions de suite, et
          # la capture montrait mieux que la ligne ne le dit — la machine etait
          # arrivee jusqu'au premier ecran de grenOS. Presque aucun PC vendu
          # depuis dix ans ne demarre autrement : publier une image qui ne
          # demarre pas en UEFI serait publier une image que personne n'allume.
          # Ce que le second demarrage a retrouve du premier.
          #
          # EXIGE depuis aujourd'hui : vu vert trois constructions de suite
          # (36321970850, 36324202295, 36326684530), dont une ou l'ordre
          # d'enumeration SATA s'etait inverse — la preuve ne depend pas du nom
          # du disque, elle compare le `boot_id` du noyau.
          #
          # C'est la premiere phrase de la page de telechargement : « tout ce
          # que tu fais est garde sur le disque de la machine ». Publier une
          # image qui ne la tient pas, c'est mentir a la premiere ligne.
          grep -a 'persistance :' "$RUNNER_TEMP/serial-uefi.log" 2>/dev/null | sed 's/^.*grenos: //' || \
            echo "persistance : le second demarrage n'a rien dit"
          if ! grep -aq "persistance : un fichier d'un demarrage PRECEDENT est revenu" "$RUNNER_TEMP/serial-uefi.log"; then
            echo "::error::Ce qui a ete ecrit au premier demarrage n'est pas revenu au second : la persistance ne tient pas sa promesse."
            exit 1
          fi
          # E1 — LE JOURNAL D'AVANT EST-IL ENCORE LA ? C'est ici, et nulle
          # part ailleurs, que la question a un sens : c'est le seul endroit
          # ou la MEME machine a deja demarre une fois. Au premier demarrage
          # « 1 demarrage connu » ne distingue rien ; au second, deux
          # demarrages connus veulent dire que le journal a traverse
          # l'extinction — et c'est ce journal que le detecteur de demarrage
          # rate interroge pour nommer une cause.
          #
          # RAPPORTE, pas bloquant : jamais vu vert. Deux passages avant
          # d'exiger, regle inchangee depuis le 12 septembre.
          # On lit LE NOMBRE, pas la presence d'une phrase : « au moins deux »
          # est la seule forme qui ne puisse pas se confondre avec « un seul,
          # donc rien de prouve ».
          JOURNAL=$(grep -a 'journal :' "$RUNNER_TEMP/serial-uefi.log" 2>/dev/null \
            | tail -1 | sed 's/^.*grenos: //')
          echo "${JOURNAL:-journal : le second demarrage n'a rien dit}"
          CONNUS=$(printf '%s' "$JOURNAL" | sed -n 's/^journal : persistant, \([0-9]\{1,\}\) demarrage.*/\1/p')
          if [ "${CONNUS:-0}" -ge 2 ]; then
            echo "journal: le journal du demarrage PRECEDENT est encore lisible ($CONNUS connus)"
          else
            echo "::warning::Le journal ne survit pas au redemarrage, ou n'en connait qu'un (rapporte, pas bloquant)."
          fi
          if grep -q "screen: PASS" "$RUNNER_TEMP/uefi-juge.log"; then
            echo "uefi: le chargeur a pris la main et le noyau dessine"
          else
            echo "::error::L'image ne demarre pas en UEFI : l'ecran est reste vide apres 90 s."
            exit 1
          fi
        env:
          ISO_UEFI: ${{ steps.build.outputs.iso }}

      # « Qu'on doive redemarrer le PC pour mettre a jour, comme Windows. »
      #
      # C'est la derniere piece du plan que personne n'a jamais vue tourner, et
      # la seule dont l'echec laisserait une machine SANS DEMARRAGE. Le contrat
      # du script est exerce depuis le 26 dans un conteneur — il rend toujours
      # 0, ecrit son verdict, se desarme, survit a un depot injoignable — mais
      # aucune machine n'avait jamais redemarre dessus.
      #
      # Ce qui le rend possible aujourd'hui : on sait enfin ou vont les
      # fichiers de la persistance. La couche superieure est `<partition>/rw`,
      # pas la racine — d'ou le lien symbolique pose la, qui arme le service
      # exactement comme le ferait le bouton « Mettre a jour et redemarrer ».
      #
      # RAPPORTE, jamais bloquant, et il ne conditionne pas la Release : une
      # etape ne devient obligatoire qu'apres avoir ete vue verte. On travaille
      # de plus sur une COPIE du disque, pour ne pas abimer celui dont les deux
      # premiers demarrages viennent de prouver la persistance.
      - name: La mise a jour au demarrage s applique-t-elle
        id: majdem
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -u
          if [ ! -f "$RUNNER_TEMP/persistence.vdi" ]; then
            echo "pas de disque de persistance : rien a essayer"
            exit 0
          fi
          qemu-img convert -f vdi -O raw "$RUNNER_TEMP/persistence.vdi" "$RUNNER_TEMP/maj-disque.raw"
          # De quoi AVOIR quelque chose a installer.
          #
          # Le premier essai a rendu « termine en 0s » : l'image venait d'etre
          # construite depuis le meme depot, il n'y avait rien de neuf. La
          # plomberie etait prouvee — ordonnancement, message, desarmement,
          # retour du bureau — mais pas qu'elle installe quoi que ce soit dans
          # cette fenetre-la. Une mise a jour qui n'a rien a faire reussit
          # toujours.
          #
          # On fabrique donc une version plus recente de `grenos-desktop`, on
          # la sert depuis le runner, et la machine la voit par le reseau
          # utilisateur de QEMU, ou l'hote repond a 10.0.2.2. `[trusted=yes]`
          # parce que ce depot-la ne sort pas de la machine d'integration ;
          # celui de production, lui, reste signe.
          NEUVE=""
          if [ -n "${VERSION_APT:-}" ] && command -v dpkg-scanpackages >/dev/null 2>&1; then
            NEUVE="${VERSION_APT}+essai1"
            linux/tools/make-deb.sh "$NEUVE" "$RUNNER_TEMP/depot-essai" >/dev/null
            ( cd "$RUNNER_TEMP/depot-essai" && dpkg-scanpackages . /dev/null > Packages 2>/dev/null && gzip -9cf Packages > Packages.gz )
            python3 -m http.server 8000 --directory "$RUNNER_TEMP/depot-essai" --bind 127.0.0.1 >/dev/null 2>&1 &
            SERVEUR=$!
            echo "depot d essai servi : grenos-desktop $NEUVE"
          fi
          BOUCLE=$(sudo losetup --find --show --partscan "$RUNNER_TEMP/maj-disque.raw")
          POINT=$(mktemp -d)
          sudo mount "${BOUCLE}p1" "$POINT"
          # Armer le service, c'est exactement ce que fait le bouton : poser le
          # lien que systemd cherche dans multi-user.target.wants.
          VOULU="$POINT/rw/etc/systemd/system/multi-user.target.wants"
          sudo mkdir -p "$VOULU"
          sudo ln -sf /etc/systemd/system/grenos-maj-demarrage.service \
            "$VOULU/grenos-maj-demarrage.service"
          if [ -n "$NEUVE" ]; then
            sudo mkdir -p "$POINT/rw/etc/apt/sources.list.d"
            echo 'deb [trusted=yes] http://10.0.2.2:8000 ./' \
              | sudo tee "$POINT/rw/etc/apt/sources.list.d/essai-local.list" >/dev/null
          fi
          # Un travail en attente, comme si quelqu'un avait demande un
          # changement de systeme depuis le bureau.
          #
          # « Qu'on puisse changer des systemes importants et que ca s'applique
          # au prochain redemarrage. » La file est exercee hors machine sur
          # quatre cas — reussi, echoue, sans fin, rien rejoue —, mais rien ne
          # prouvait encore qu'un travail depose AVANT un demarrage soit
          # execute par ce demarrage-la. C'est le seul endroit qui peut le dire.
          ATTENTE="$POINT/rw/var/lib/grenos/au-prochain-demarrage"
          sudo mkdir -p "$ATTENTE/faits"
          printf '#!/bin/sh\n# Essai de la machine d integration\nset -u\ntouch /var/lib/grenos/travail-fait\n' \
            | sudo tee "$ATTENTE/001-essai" >/dev/null
          sudo chmod 0755 "$ATTENTE/001-essai"
          sudo sync
          sudo umount "$POINT"
          sudo losetup -d "$BOUCLE"
          rmdir "$POINT" 2>/dev/null || true
          echo "service arme dans la couche superieure de la persistance"
          ACCEL=""
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; fi
          qemu-system-x86_64 $ACCEL -m 3072 -smp 2 -cdrom "$ISO_MAJDEM" -boot d -drive file="$RUNNER_TEMP/maj-disque.raw",format=raw,if=none,id=garde3 -device ahci,id=sata3 -device ide-hd,drive=garde3,bus=sata3.0 -display none -vga std -global VGA.xres=1280 -global VGA.yres=720 -serial file:"$RUNNER_TEMP/serial-maj-demarrage.log" -monitor unix:"$RUNNER_TEMP/majdem.sock",server,nowait -no-reboot &
          QEMU=$!
          sleep 5
          if ! kill -0 "$QEMU" 2>/dev/null; then
            echo "::warning::QEMU n'a pas demarre pour l'essai de mise a jour au demarrage."
            exit 0
          fi
          # On photographiait l'ecran d'APRES, jamais celui de PENDANT — et
          # c'est pourtant le seul que la personne regardera, puisqu'il occupe
          # tout l'ecran le temps que dpkg travaille. Des que le service dit sa
          # premiere ligne, on prend la photo.
          PRISE=non
          ATTENTE=0
          while [ "$ATTENTE" -lt 240 ]; do
            if [ "$PRISE" = non ] && grep -aq 'maj-demarrage :' "$RUNNER_TEMP/serial-maj-demarrage.log" 2>/dev/null; then
              # Trois photos a quatre secondes : la premiere prouve que l'ecran
              # existe, les suivantes montrent la barre avancee. Une seule
              # risquerait de tomber sur un ecran deja rendu, si le depot
              # d'essai n'avait rien a poser.
              for PHOTO in 1 2 3; do
                python3 scripts/ci-screen.py grab "$RUNNER_TEMP/majdem.sock" "$RUNNER_TEMP/ecran-maj-pendant$PHOTO.ppm" || true
                sleep 4
              done
              PRISE=oui
              ATTENTE=$(( ATTENTE + 12 ))
            fi
            sleep 2
            ATTENTE=$(( ATTENTE + 2 ))
          done
          # On attend les 240 s entieres, comme avant : les lignes que les
          # preuves bloquantes cherchent arrivent APRES le bureau, et gagner
          # trois minutes ne vaut pas le risque de les rater.
          echo "maj au demarrage : ecran pendant la mise a jour pris = $PRISE"
          python3 scripts/ci-screen.py grab "$RUNNER_TEMP/majdem.sock" "$RUNNER_TEMP/ecran-maj-demarrage.ppm" || true
          kill $QEMU 2>/dev/null || true
          echo "--- ce que le troisieme demarrage a dit ---"
          grep -a 'grenos:' "$RUNNER_TEMP/serial-maj-demarrage.log" | tail -n 20 || true
          # La seule question qui compte : la machine est-elle revenue ? Une
          # mise a jour qui laisse un PC eteint est pire que pas de mise a jour.
          if grep -aq 'session de bureau ouverte' "$RUNNER_TEMP/serial-maj-demarrage.log"; then
            echo "maj au demarrage : le bureau est REVENU apres l'application"
          else
            echo "::warning::Le bureau n'est pas revenu dans les 240 s : a regarder sur la capture."
          fi
          # Et la question que le premier essai ne posait pas : a-t-elle
          # vraiment INSTALLE quelque chose ? « termine en 0s » veut dire qu'il
          # n'y avait rien a faire, ce qui reussit toujours.
          # Les deux exigences de cette etape, bloquantes depuis aujourd'hui.
          #
          # « Ne plus jamais reinstaller » est la promesse centrale du projet,
          # et son echec est le plus grave de tous : une machine qui ne revient
          # pas. Ces deux lignes sont donc les seules de cette etape qui
          # arretent la publication.
          #
          # La regle est tenue, comme toujours : le paquet reel pose au
          # redemarrage est vu vert CINQ constructions de suite (c9bed865,
          # 89224aed, cc5d29ed, 50e870ad, 9a8051d5), la file de travaux QUATRE
          # — elle n'existait pas a la premiere.
          #
          # Ce qui reste tolerant au-dessus : l'absence de disque, un QEMU qui
          # ne demarre pas, un depot d'essai qu'on n'a pas pu fabriquer. Ce
          # sont des pannes de la machine d'integration, pas de grenOS, et
          # bloquer dessus ferait douter du controle lui-meme.
          MANQUE=0
          if [ -n "$NEUVE" ]; then
            if grep -aq "grenos-desktop $NEUVE est installe" "$RUNNER_TEMP/serial-maj-demarrage.log"; then
              echo "maj au demarrage : la version $NEUVE a ete POSEE avant le bureau"
            else
              echo "::error::La mise a jour au redemarrage n'a rien installe : la promesse « plus jamais d'ISO » ne tient pas."
              MANQUE=1
            fi
          fi
          # Et le travail mis en attente : a-t-il ete execute par CE demarrage ?
          if grep -aq 'Essai de la machine d integration' "$RUNNER_TEMP/serial-maj-demarrage.log"; then
            grep -a 'maj-demarrage : Essai' "$RUNNER_TEMP/serial-maj-demarrage.log" | sed 's/^.*grenos: //'
            echo "travaux : un changement depose avant le demarrage a ete applique"
          else
            echo "::error::Un changement depose pour le prochain demarrage n'a pas ete applique."
            MANQUE=1
          fi
          kill ${SERVEUR:-0} 2>/dev/null || true
          exit "$MANQUE"
        env:
          ISO_MAJDEM: ${{ steps.build.outputs.iso }}
          VERSION_APT: ${{ steps.apt.outputs.version }}

      # A11 : « un peripherique attendu et absent ne doit jamais faire echouer
      # le demarrage » — la ligne qu'il appelle lui-meme la plus importante de
      # sa section materiel, et la seule qui n'avait aucune preuve.
      #
      # La moitie decisive est faite : Calamares ecrivait `defaults` sans
      # `nofail`, donc un disque absent envoyait une machine installee en mode
      # secours derriere un mot de passe root qui n'existe pas. Mais un fichier
      # pose ne prouve rien — `logo.png` etait pose, son garde le voyait, et la
      # barre de titre n'avait pas bouge d'un pixel. Il faut RETIRER le
      # materiel et regarder.
      #
      # On retire les deux absences que la machine d'integration sait produire,
      # et ce sont celles de sa liste : aucun disque, aucune carte reseau. Le
      # verdict refuse de conclure si l'absence n'a pas eu lieu.
      #
      # EXIGE depuis le 15 octobre : vu vert deux fois (38702344584 et
      # 38708826695), et la regle n'a pas change depuis le 12 septembre. Le
      # `continue-on-error` reste, parce que c'est lui qui laisse garder la
      # capture quand la machine ne demarre pas — et c'est la capture qui
      # permet de comprendre. C'est la porte de la Release qui refuse, et le
      # verdict honnete qui le dit.
      #
      # Son premier passage a d'ailleurs refuse, et il avait raison : la sonde
      # ecrivait « depot joignable » sur une machine sans carte reseau. Un
      # garde neuf qui trouve un defaut de l'OS a son premier tour a gagne sa
      # place.
      - name: Une machine sans disque ni reseau ouvre-t-elle son bureau
        id: sansmat
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: scripts/ci-sans-materiel.sh "${{ steps.build.outputs.iso }}"

      - name: Garder les captures
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: grenos-linux-captures
          path: |
            ${{ runner.temp }}/*.ppm
            ${{ runner.temp }}/*.png
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 14

      # La machine VirtualBox toute prête : l'image, un disque vide où
      # l'installer, et le fichier .vbox à double-cliquer.
      - name: La machine VirtualBox
        id: vbox
        if: steps.boot.outcome == 'success'
        run: |
          ISO="${{ steps.build.outputs.iso }}"
          STAMP=$(date -u +%Y%m%d-%H%M)
          NAME="grenos-linux-$STAMP"
          mkdir -p dist
          # Un deplacement, pas une copie : l'image fait presque deux gigaoctets.
          mv "$ISO" "dist/$NAME.iso"
          # Le disque de la machine : formate et etiquete persistence, pour que
          # grenOS garde tout des le premier demarrage sans rien installer.
          sudo apt-get install -y -qq gdisk e2fsprogs
          sudo linux/tools/make-disk.sh "dist/$NAME.vdi" 25
          sudo chown "$(id -u):$(id -g)" "dist/$NAME.vdi"
          python3 scripts/make-vbox.py "$NAME.iso" "dist/$NAME.vbox" --linux --disk "dist/$NAME.vdi" "$NAME.vdi"
          (cd dist && zip -q -9 "$NAME-virtualbox.zip" "$NAME.iso" "$NAME.vbox" "$NAME.vdi")
          ls -la dist

          # Ce qu'il ouvre vraiment, c'est ce zip, et personne ne l'avait
          # jamais regarde. Un fichier que `zip` aurait saute, ou un nom qui ne
          # correspond pas, se verrait chez lui et pas ici.
          echo "--- ce que contient la machine VirtualBox ---"
          unzip -l "dist/$NAME-virtualbox.zip"
          manque=""
          for attendu in "$NAME.iso" "$NAME.vbox" "$NAME.vdi"; do
            unzip -l "dist/$NAME-virtualbox.zip" | grep -q "$attendu" || manque="$manque $attendu"
          done
          if [ -n "$manque" ]; then
            echo "::error::La machine VirtualBox est incomplete :$manque"
            exit 1
          fi
          # Le .vbox doit designer ses deux fichiers par le nom qu'ils portent
          # dans le zip : une fois decompresse, VirtualBox les cherche a cote.
          # Et il doit etre du XML valide, sinon VirtualBox refuse la machine
          # sans expliquer pourquoi.
          for attendu in "$NAME.iso" "$NAME.vdi"; do
            if ! grep -q "$attendu" "dist/$NAME.vbox"; then
              echo "::error::Le .vbox ne designe pas $attendu"
              exit 1
            fi
          done
          python3 -c "import sys, xml.etree.ElementTree as X; X.parse(sys.argv[1]); print('le .vbox est du XML valide')" "dist/$NAME.vbox"
          # Du XML VALIDE n est pas du XML CONFORME. Le 1er octobre, le .vbox
          # portait `driver="Default"` pour la carte son — une valeur que le
          # schema de VirtualBox (TAudioAdapter, 1.20) ne connait pas : il
          # n accepte que Null, OSS, ALSA, Pulse, CoreAudio, MMPM, SolAudio,
          # WinMM ou DirectSound. L etape ci-dessus disait vert depuis des
          # semaines, et la machine livree a Grenofar aurait pu n avoir aucun
          # son. Meme famille que la regle polkit nommant une action inexistante.
          python3 scripts/verif-vbox.py "dist/$NAME.vbox"
          echo "machine VirtualBox : les trois fichiers sont la, et le .vbox les designe"
          # La page /download promet quatre nombres — 8 Go, quatre coeurs,
          # 256 Mo de video, un disque de 25 Go — que quelqu'un verifiera d'un
          # coup d'oeil dans VirtualBox. Rien ne verifiait la correspondance :
          # changer make-vbox.py sans toucher la page, ou l'inverse, passait
          # sans un mot. Une promesse chiffree est soit tenue, soit fausse.
          python3 scripts/verif-vbox-promesse.py "dist/$NAME.vbox" "dist/$NAME.vdi"
          # Demarre-t-elle sur un PC recent ? Presque aucun ne demarre plus en
          # BIOS. Le controle est un fichier a part, pas du Python ecrit dans
          # ce YAML : du code indente dans `python3 -c` leve une erreur
          # d'indentation, et c'est la lecon deja payee avec le garde-fou.
          python3 scripts/verif-iso-uefi.py "dist/$NAME.iso"

          SIZE=$(stat -c %s "dist/$NAME.iso")
          echo "image : $((SIZE / 1024 / 1024)) Mio"
          if [ "$SIZE" -gt 2100000000 ]; then
            echo "::error::L'image depasse 2 Go : une Release GitHub la refusera."
            exit 1
          fi
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Le verdict, pour que le Maitre et les taches sachent ou en est une
      # branche : linux.yml juge l'image comme verify.yml juge le noyau.
      - name: Rapporter le verdict
        if: always() && github.ref != 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DOMAIN: linux
          PROBE: "true"
          IMAGE: ${{ steps.build.outcome }}
          BOOT: ${{ steps.boot.outcome }}
          SCREEN: ${{ steps.boot.outcome }}
          JOB_STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUNID: ${{ github.run_id }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch -q --depth=1 origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::notice::Branche identique a main : rien a juger."
            exit 0
          fi
          HEAD_NOW=$(git ls-remote --heads origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ -n "$HEAD_NOW" ] && [ "$HEAD_NOW" != "$GITHUB_SHA" ]; then
            echo "::notice::Commit remplace : son run rendra le verdict."
            exit 0
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Verdict non transmis : secret SUPABASE_SERVICE_ROLE_KEY absent."
            exit 1
          fi
          if [ "$IMAGE" != "success" ]; then
            ST=failed; FL=compile_error
          elif [ "$BOOT" != "success" ]; then
            ST=failed; FL=test_failure
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            ST=timeout; FL=""
          else
            ST=passed; FL=""
          fi
          : > combined.log
          for f in ecran serial; do
            [ -f "$RUNNER_TEMP/$f.log" ] && { echo "--- $f ---" >> combined.log; tail -n 60 "$RUNNER_TEMP/$f.log" >> combined.log; }
          done
          LOGTXT=$(tail -c 6000 combined.log 2>/dev/null || true)
          export ST FL LOGTXT
          python3 scripts/ci-payload.py > payload.json
          code=$(curl -s -o response.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/runs" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "content-type: application/json" \
            -H "prefer: return=minimal" \
            --data-binary @payload.json)
          echo "verdict $ST : HTTP $code"
          [ "$code" = "201" ] || { cat response.json; exit 1; }

      - name: Publier la Release
        # Rien n'est publie sans les deux preuves : un bureau qui s'ouvre, et
        # une mise a jour qui s'installe depuis notre depot. Une image qu'on ne
        # peut pas mettre a jour obligerait a tout regraver.
        if: steps.boot.outcome == 'success' && steps.maj.outcome == 'success' && steps.uefi.outcome == 'success' && steps.majdem.outcome == 'success' && steps.sansmat.outcome == 'success' && (github.ref == 'refs/heads/main' || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${{ steps.vbox.outputs.name }}"
          TAG="linux-${{ steps.vbox.outputs.stamp }}"
          # Ces notes disaient « bureau KDE Plasma » — retire le 18 septembre,
          # et l'inverse exact de ce que grenOS revendique. Chaque Release
          # publiee depuis une semaine annoncait donc le contraire de la verite.
          cat > notes.md <<NOTES
          grenOS sur Debian trixie. Le bureau est le notre : barre, menu,
          Reglages, magasin et accueil sont ecrits pour grenOS, sur X11 sans
          composition — c'est ce qui le garde fluide sans carte graphique.

          - \`$NAME.iso\` : l'image a graver, a copier sur une cle USB ou a monter dans une machine virtuelle.
          - \`$NAME-virtualbox.zip\` : la machine VirtualBox deja reglee, son disque et l'image.

          Avant d'etre publiee, cette image a ete construite, puis DEMARREE
          dans QEMU en 1280x720, avec un vrai clic de souris sur la barre. La
          construction refuse de publier si le bureau ne s'ouvre pas, si une
          fenetre deborde de l'ecran, si la touche Windows n'ouvre pas le menu,
          si le magasin ne trouve pas son catalogue, ou si la mise a jour ne
          s'installe pas depuis notre depot.
          NOTES
          sed -i 's/^          //' notes.md
          # Une seule ligne, sans continuation : c'est elle qui se perd en
          # chemin, et le garde-fou de la premiere etape la reclame.
          gh release create "$TAG" --title "grenOS Linux ${{ steps.vbox.outputs.stamp }}" --notes-file notes.md "dist/$NAME.iso" "dist/$NAME-virtualbox.zip"

      # LE JOB DOIT ETRE ROUGE QUAND L IMAGE NE DEMARRE PAS.
      #
      # Le 2 octobre, la construction 36948925395 s est declaree VERTE alors
      # que l image n a jamais ouvert de bureau : ecran noir, serial.log de
      # 216 octets, et « La touche Windows n a pas ouvert le menu » suivi d un
      # exit 1 dans le journal.
      #
      # Rien n a ete publie — la Release exige `steps.boot.outcome == success`,
      # et cette protection-la a parfaitement joue. Mais au premier coup d oeil
      # le run disait « success », et c est exactement la couleur qu on regarde
      # avant de regarder le reste.
      #
      # Le `continue-on-error` de l etape de demarrage reste : il est VOULU,
      # c est lui qui permet de garder les captures et de rendre un verdict
      # meme quand l image ne demarre pas, et ces captures sont la seule chose
      # qui permette de comprendre pourquoi. On ne le retire pas ; on ajoute
      # une derniere etape qui rend la couleur honnete.
      #
      # Elle est APRES la Release et apres les artefacts, donc elle ne prive de
      # rien : tout ce qui devait etre garde l a deja ete.
      - name: Le verdict honnete
        if: always()
        # IL N'ETAIT HONNETE QU'AUX TROIS QUARTS, ET CA A COUTE UNE IMAGE.
        #
        # La Release est gardee par cinq portes. Celle-ci n'en nommait que
        # trois : `majdem` manquait. Or `majdem` porte un `continue-on-error`,
        # qui rend la *conclusion* verte en laissant l'*outcome* rouge. Le
        # 15 octobre, la construction 38683006441 s'est donc declaree
        # **success** avec ses vingt etapes vertes a l'API, n'a rien publie,
        # et n'a rien dit : il a fallu lire le journal de l'etape pour
        # trouver « La mise a jour au redemarrage n'a rien installe ».
        #
        # Meme famille que le `| tail` du 25 septembre : un garde dont
        # l'echec n'arrive jamais jusqu'a une oreille. `verif-flux.py` refuse
        # desormais le flux si une porte a `continue-on-error` sans etre
        # nommee ici — les deux listes ne peuvent plus diverger en silence.
        run: |
          echo "demarrage : ${{ steps.boot.outcome }}"
          echo "uefi      : ${{ steps.uefi.outcome }}"
          echo "maj       : ${{ steps.maj.outcome }}"
          echo "maj-dem   : ${{ steps.majdem.outcome }}"
          echo "sans-mat  : ${{ steps.sansmat.outcome }}"
          FERMEES=""
          [ "${{ steps.boot.outcome }}" = success ] || FERMEES="$FERMEES demarrage"
          [ "${{ steps.uefi.outcome }}" = success ] || FERMEES="$FERMEES uefi"
          [ "${{ steps.maj.outcome }}" = success ] || FERMEES="$FERMEES maj"
          [ "${{ steps.majdem.outcome }}" = success ] || FERMEES="$FERMEES maj-au-demarrage"
          [ "${{ steps.sansmat.outcome }}" = success ] || FERMEES="$FERMEES sans-materiel"
          if [ -n "$FERMEES" ]; then
            echo "::error::Rien n'a ete publie. Portes fermees :$FERMEES"
            exit 1
          fi
          # On ne dit PAS « l'image est publiee » : la Release demande aussi
          # d'etre sur `main`. Promettre ici une publication qu'une branche
          # n'aura pas serait une promesse a l'ecran sans rien derriere.
          echo "les cinq preuves sont vertes : rien ne s'oppose a la publication"
