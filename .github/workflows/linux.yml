# grenOS, édition Linux : construire l'image, la démarrer pour de vrai, et ne
# publier que ce qui a montré un bureau.
#
# L'image fait plus d'un gigaoctet : Supabase est plafonné à 1 Go, donc la
# publication passe par les Releases GitHub (2 Go par fichier).
name: linux

on:
  push:
    branches: [main, "agent/**", "claude/**"]
    paths:
      - "linux/**"
      - ".github/workflows/linux.yml"
      - "scripts/ci-screen.py"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier une Release avec l'image"
        type: boolean
        default: false

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Le runner a une douzaine de gigaoctets libres, et une image KDE en
      # demande le double le temps de la construire.
      # Trois constructions perdues les 23 et 24 septembre pour la meme raison :
      # une edition de ce fichier qui perd sa continuation de ligne et laisse
      # deux caracteres — une barre oblique inverse suivie d'un n — au milieu
      # d'une commande. Le shell les passe alors comme argument, et la commande
      # echoue vingt minutes plus tard, loin de sa cause. Trois secondes ici
      # valent mieux que vingt minutes la-bas.
      # Ce controle est un fichier a part, et pas un script dans ce YAML : les
      # sequences d'echappement ne survivent pas a une reecriture, et c'est
      # precisement l'accident qu'il sert a attraper. Il a ete casse deux fois
      # en essayant de l'ecrire ici.
      - name: Aucune continuation de ligne perdue
        run: python3 scripts/verif-flux.py .github/workflows/linux.yml

      # Une phrase sans accents se lit encore : c'est pour cela qu'elle passe
      # les relectures. Le 24 septembre, le catalogue en portait deux depuis
      # une semaine ; le 25, l'infobulle du reseau en portait trois, ecrites
      # une heure plus tot, dans un texte que je venais de relire moi-meme.
      # Trois secondes ici, contre une faute d'orthographe dans l'image publiee.
      - name: Les textes affiches ont leurs accents
        run: python3 linux/tools/verif-accents.py

      - name: Faire de la place
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h /

      - name: Outils de l'hôte
        run: |
          sudo apt-get update -qq
          # gdisk et e2fsprogs servent au disque de persistance, construit avant
          # le demarrage : la machine d'essai doit partir sur celui qu'on livre.
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils zip python3 gdisk e2fsprogs
          # Le peripherique existe sur les runners, mais appartient au groupe
          # kvm : sans droit d'ecriture, QEMU refuse de demarrer au lieu de se
          # rabattre sur l'emulation.
          sudo chmod 0666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm || echo "pas de KVM : QEMU emulera, c'est plus lent"

      # La clé du dépôt APT de grenOS. Elle est fabriquée une seule fois, par
      # la CI, et gardée dans le bucket privé `signing` : personne ne la voit
      # passer, et l'image n'embarque que sa partie publique.
      - name: La cle du depot
        id: key
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -u
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Pas de cle de service : le depot APT ne sera ni signe ni publie."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OBJ="$SUPABASE_URL/storage/v1/object/signing/apt-signing.asc"
          code=$(curl -s -o secret.asc -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "$OBJ")
          if [ "$code" != "200" ]; then
            echo "Pas encore de cle : on en fabrique une, une seule fois."
            rm -f secret.asc
            export GNUPGHOME=$(mktemp -d)
            chmod 700 "$GNUPGHOME"
            gpg --batch --passphrase "" --quick-generate-key \
                "grenOS packages <grenos@grenos-dev.vercel.app>" rsa4096 sign never
            gpg --batch --armor --export-secret-keys > secret.asc
            up=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "content-type: application/pgp-keys" \
              -H "x-upsert: true" \
              --data-binary @secret.asc "$OBJ")
            echo "depot de la cle privee : HTTP $up"
            [ "$up" = "200" ] || { echo "::error::La cle n'a pas pu etre gardee : on n'en fabrique pas une autre."; exit 1; }
            rm -rf "$GNUPGHOME"
          else
            echo "cle relue depuis le bucket prive"
          fi
          # La partie publique, celle que l'image embarque.
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import secret.asc
          gpg --batch --export > linux/grenos-apt.gpg
          gpg --batch --armor --export > linux/grenos-apt.asc
          rm -rf "$GNUPGHOME"
          ls -l linux/grenos-apt.gpg linux/grenos-apt.asc
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Le paquet grenos-desktop et le dépôt APT : c'est par là que grenOS se
      # met à jour depuis grenOS, en plus des correctifs Debian.
      # Le catalogue de GrenPlace vit dans notre backend, pas dans l'image :
      # ajouter une application ne demande ni nouvelle image ni mise a jour du
      # systeme. On le republie a chaque construction, c'est idempotent.
      # Verifie partout, publie seulement depuis `main` : le magasin des vraies
      # machines n'appartient pas a une branche. Le 24 septembre a 19h38, la
      # construction d'une branche d'agent a remplace nos 29 applications par
      # 17 autres, que personne n'avait relues.
      - name: Le catalogue du magasin
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python3 linux/tools/publier-catalogue.py
          else
            python3 linux/tools/publier-catalogue.py --verifier
          fi

      # Fabriquer, oui, depuis n'importe quelle branche : l'image en a besoin.
      # **Publier**, non — voir l'etape suivante.
      - name: Le paquet grenOS
        id: apt
        if: steps.key.outputs.ready == 'true'
        run: |
          sudo apt-get install -y -qq dpkg-dev python3-numpy
          VERSION="1.0.$(date -u +%Y%m%d%H%M)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          linux/tools/make-deb.sh "$VERSION" dist
          # L'image installe ses propres paquets, au lieu de se contenter d'en
          # copier les fichiers. C'est ce qui manquait pour que la mise a jour
          # fonctionne : sans entree dans dpkg, « apt full-upgrade » ne trouvait
          # rien de grenOS a mettre a jour, et n'apportait que les correctifs
          # Debian. live-build installe ce qui se trouve dans packages.chroot.
          mkdir -p linux/config/packages.chroot
          cp "dist/grenos-systeme_${VERSION}_all.deb" "dist/grenos-desktop_${VERSION}_all.deb" linux/config/packages.chroot/
          ls -l linux/config/packages.chroot/
          APT_SECRET_KEY="$PWD/secret.asc" linux/tools/make-apt-repo.sh apt "dist/grenos-systeme_${VERSION}_all.deb" "dist/grenos-desktop_${VERSION}_all.deb"

      # Le depot APT est ce que les vraies machines interrogent pour se mettre
      # a jour. **Seule `main` a le droit d'y ecrire.**
      #
      # Le 24 septembre a 19h38, la construction d'une branche d'agent l'a
      # ecrase : le depot s'est mis a proposer un paquet que personne n'avait
      # relu, et le catalogue du magasin est passe de nos 29 applications a 17
      # autres. Une machine qui aurait lance « Mettre a jour grenOS » a ce
      # moment-la aurait installe le travail en cours d'un agent.
      #
      # Fabriquer depuis une branche est utile — cela prouve que le paquet se
      # construit. Publier ne l'est pas.
      - name: Publier le depot APT
        if: steps.key.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Un dépôt APT n'est qu'un ensemble de fichiers : on les dépose un à
          # un dans le bucket public, en écrasant les anciens.
          find apt -type f | while read -r file; do
            target="${file#apt/}"
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "x-upsert: true" -H "cache-control: max-age=60" --data-binary @"$file" "$SUPABASE_URL/storage/v1/object/apt/$target")
            echo "$target : HTTP $code"
            [ "$code" = "200" ] || exit 1
          done
          echo "depot publie : $SUPABASE_URL/storage/v1/object/public/apt"

      # La mise a jour depuis l'OS est la promesse qui evite de regraver une
      # image a chaque nouveaute. Elle merite donc d'etre exercee, pas
      # seulement ecrite : on part d'une Debian nue, on ajoute notre depot
      # comme le fait l'image, et on installe. Si cela echoue ici, aucune
      # machine ne pourra se mettre a jour — et rien ne sera publie.
      - name: La mise a jour fonctionne-t-elle
        id: maj
        if: steps.key.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e DEBIAN_FRONTEND=noninteractive -e DEPOT="$SUPABASE_URL/storage/v1/object/public/apt" \
            debian:trixie sh /work/linux/tools/essai-maj.sh

      # live-build monte des systèmes de fichiers et fait un debootstrap : cela
      # se passe dans un conteneur Debian privilégié, jamais sur le runner.
      - name: Construire l'image
        id: build
        run: |
          docker run --privileged --rm \
            -v "$PWD:/work" -w /work \
            -e LB_PARENT_MIRROR_BOOTSTRAP=http://deb.debian.org/debian \
            debian:trixie sh /work/linux/build.sh 2>&1 | tail -n 200
          # Le conteneur ecrit en root ; la suite (lien, zip, artefact) tourne
          # sous le compte du runner.
          sudo chown -R "$(id -u):$(id -g)" linux || true
          ISO=$(ls linux/*.iso | head -1)
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$ISO")" >> "$GITHUB_OUTPUT"
          ls -la linux/*.iso

      - name: L'image démarre-t-elle vraiment
        id: boot
        continue-on-error: true
        run: |
          ISO="${{ steps.build.outputs.iso }}"
          ACCEL=""
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL="-enable-kvm -cpu host"
            echo "KVM disponible"
          else
            echo "sans KVM : l'emulation est lente, le bureau met plusieurs minutes"
          fi
          # Deux disques, sur un controleur SATA comme en a un PC et comme en
          # donne VirtualBox.
          #
          # Le premier est **celui qu'on livre** : une partition ext4 etiquetee
          # « persistence », avec le fichier que live-boot y cherche. C'est ce
          # qui fait tenir la promesse de la page de telechargement — « tout ce
          # que tu fais est garde ». Personne ne l'avait jamais verifie : la
          # machine d'essai demarrait sans disque, donc live-boot cherchait une
          # persistance, n'en trouvait pas, et continuait. Le chemin que
          # Grenofar emprunte vraiment n'etait pas celui qu'on testait.
          #
          # Le second est vierge : c'est celui que l'installateur proposerait.
          sudo linux/tools/make-disk.sh "$RUNNER_TEMP/persistence.vdi" 8
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/persistence.vdi"
          qemu-img create -f qcow2 "$RUNNER_TEMP/disque.qcow2" 20G
          qemu-system-x86_64 $ACCEL -m 3072 -smp 2 \
            -cdrom "$ISO" -boot d \
            -drive file="$RUNNER_TEMP/persistence.vdi",format=vdi,if=none,id=garde \
            -drive file="$RUNNER_TEMP/disque.qcow2",format=qcow2,if=none,id=dur \
            -device ahci,id=sata \
            -device ide-hd,drive=garde,bus=sata.0 \
            -device ide-hd,drive=dur,bus=sata.1 \
            -display none -vga std \
            -global VGA.xres=1280 -global VGA.yres=720 \
            -usb -device usb-tablet \
            -audiodev none,id=silence \
            -device intel-hda -device hda-duplex,audiodev=silence \
            -serial file:"$RUNNER_TEMP/serial.log" \
            -monitor unix:"$RUNNER_TEMP/monitor.sock",server,nowait \
            -qmp unix:"$RUNNER_TEMP/qmp.sock",server,nowait \
            -no-reboot &
          QEMU=$!
          # QEMU a-t-il seulement demarre ? Une option mal ecrite le fait
          # sortir aussitot, et sans ce controle on attend six minutes devant
          # un ecran qui n'existe pas avant de comprendre. C'est arrive trois
          # fois le 23 septembre.
          sleep 3
          if ! kill -0 "$QEMU" 2>/dev/null; then
            echo "::error::QEMU n'a pas demarre : sa ligne de commande est fautive."
            exit 1
          fi
          # Vingt secondes pour arriver au menu de démarrage, puis Entrée,
          # comme le ferait la personne devant l'écran. Sans cela, un menu qui
          # attend passe pour un système qui a démarré.
          sleep 20
          python3 scripts/ci-screen.py grab "$RUNNER_TEMP/monitor.sock" "$RUNNER_TEMP/ecran-menu.ppm" || true
          python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey ret" || true
          # Le premier écran demande un nom, et la session ne s'ouvre pas tant
          # qu'il n'en a pas. Il l'annonce sur le port série : on l'attend, on
          # tape « ci », et on valide — exactement ce que fait une personne.
          for essai in $(seq 1 60); do
            if grep -q 'premier ecran affiche' "$RUNNER_TEMP/serial.log" 2>/dev/null; then
              echo "premier ecran vu apres $((essai * 5))s"
              python3 scripts/ci-screen.py grab "$RUNNER_TEMP/monitor.sock" "$RUNNER_TEMP/ecran-nom.ppm" || true
              for touche in c i ret; do
                python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey $touche" || true
                sleep 1
              done
              break
            fi
            sleep 5
          done
          if ! grep -q 'nom choisi' "$RUNNER_TEMP/serial.log" 2>/dev/null; then
            echo "le nom n'a pas encore ete pris en compte, on continue d'observer"
          fi
          sleep 15
          # Le premier ecran doit accepter ce qu'on tape. S'il ne l'accepte pas,
          # la personne reste devant une fenetre qui ignore son clavier — et le
          # bureau finit par s'ouvrir tout seul, ce qui masque la panne. C'est
          # exactement ce qui s'est passe le 18 septembre a 19h54.
          if grep -q 'nom choisi' "$RUNNER_TEMP/serial.log" 2>/dev/null; then
            grep -a 'nom choisi' "$RUNNER_TEMP/serial.log"
          else
            echo "::error::Le premier ecran n'a pas pris le nom tape : il ignore le clavier."
            kill $QEMU 2>/dev/null || true
            exit 1
          fi
          # Le bureau met du temps à venir : on regarde à intervalles, et on
          # garde chaque capture pour pouvoir les lire ensuite.
          for minute in 1 2 3 4 5; do
            sleep 60
            python3 scripts/ci-screen.py grab "$RUNNER_TEMP/monitor.sock" "$RUNNER_TEMP/ecran-${minute}min.ppm" || true
          done
          # Le bureau s'affiche-t-il, ou obeit-il ? Une capture d'ecran ne
          # repond qu'a la premiere question. On lui parle donc : on ouvre le
          # menu au clavier, on le referme, on ouvre le gestionnaire de taches,
          # et le bureau dit sur le port serie ce qu'il a fait. Sans cela, une
          # barre qui tombe au premier clic passerait au vert — c'est ce qui a
          # failli arriver le 23 septembre.
          echo "--- la souris, pour de vrai ---"
          # Le clic passe par QMP, pas par le moniteur. La source de QEMU est
          # sans appel : `hmp_mouse_move` finit toujours par un deplacement
          # RELATIF, et `qemu_input_find_handler` ne remet un evenement qu'a un
          # peripherique dont le masque le reconnait. Une tablette USB est
          # ABSOLUE : son masque ne contient pas REL. Nos trois tentatives
          # parlaient donc a la souris PS/2, et lui disaient « avance de 15900
          # pixels » — le pointeur partait dans un coin. `input-send-event`,
          # lui, porte de vraies coordonnees absolues.
          # Ce test ne bloque pas encore la publication : on ne rend une etape
          # obligatoire qu'apres l'avoir vue verte.
          # `grep -c` rend 0 et sort en erreur quand il ne trouve rien : le
          # « || echo 0 » ajoutait alors un second zero, et la comparaison
          # d'entiers plus bas recevait « 0 0 ». On prend la premiere ligne.
          AVANT=$(grep -ac 'menu ouvert' "$RUNNER_TEMP/serial.log" 2>/dev/null | head -1)
          AVANT=${AVANT:-0}
          # La barre dit ou se trouve son bouton : on vise ce point plutot que
          # de deviner. Elle est centree, donc sa position depend du nombre
          # d'icones — un clic au juge tombe a cote, et c'est ce qui est arrive.
          # Attendre que la barre ait annonce sa position : elle le fait trois
          # secondes apres son demarrage, et le premier essai cliquait avant
          # que la ligne ne soit arrivee — donc au mauvais endroit.
          for essai in $(seq 1 30); do
            grep -aq 'bouton grenos en' "$RUNNER_TEMP/serial.log" && break
            sleep 2
          done
          # `tr -d` enleve le retour chariot : une console serie termine ses
          # lignes par CR LF, et « 774 » arrivait ici en « 774\r ». Le calcul
          # echouait, la souris recevait une abscisse sans ordonnee, et le clic
          # tombait n'importe ou — sans que rien ne le dise.
          POINT=$(grep -a 'bouton grenos en' "$RUNNER_TEMP/serial.log" \
                  | tail -1 | tr -d '\r' | sed 's/.*en //')
          # La taille de l'ecran se lit dans la capture, au lieu de la supposer :
          # X ne choisit pas forcement la resolution qu'on croit, et un clic
          # converti avec la mauvaise taille tombe a cote sans rien dire.
          python3 scripts/ci-screen.py grab "$RUNNER_TEMP/monitor.sock" "$RUNNER_TEMP/avant-clic.ppm" || true
          TAILLE=$(python3 scripts/ci-screen.py taille "$RUNNER_TEMP/avant-clic.ppm" || echo "1280 800")
          LARGEUR=${TAILLE%% *}
          HAUTEUR=${TAILLE##* }
          echo "souris: l ecran fait ${LARGEUR}x${HAUTEUR}"
          if [ -n "$POINT" ]; then
            PX=${POINT%,*}
            PY=${POINT#*,}
            echo "souris: le bouton grenOS est en $PX,$PY"
          else
            PX=$(( LARGEUR / 2 ))
            PY=$(( HAUTEUR - 24 ))
            echo "souris: position inconnue, on vise le centre de la barre"
          fi
          python3 scripts/ci-screen.py clic "$RUNNER_TEMP/qmp.sock" "$PX" "$PY" "$LARGEUR" "$HAUTEUR" || true
          sleep 5
          python3 scripts/ci-screen.py grab "$RUNNER_TEMP/monitor.sock" "$RUNNER_TEMP/ecran-clic.ppm" || true
          # `grep -c` rend « 0 » ET sort en erreur quand il ne trouve rien : le
          # « || echo 0 » ajoutait un second zero, et la comparaison recevait
          # « 0 0 ». Cela ne se voyait pas, parce que le `if` avalait l'erreur
          # et prenait la bonne branche par accident. C'est le meme piege qui
          # bloquait l'indicateur de mises a jour sur « je ne sais pas ».
          APRES=$(grep -ac 'menu ouvert' "$RUNNER_TEMP/serial.log" 2>/dev/null | head -1)
          APRES=${APRES:-0}
          CLIC=1
          if [ "$APRES" -gt "$AVANT" ]; then
            echo "souris: le clic sur grenOS a ouvert le menu"
          else
            CLIC=0
            echo "souris: le clic n'a rien ouvert"
          fi
          python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey esc" || true
          sleep 3

          echo "--- le bureau repond-il ---"
          python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey ctrl-esc" || true
          sleep 6
          python3 scripts/ci-screen.py grab "$RUNNER_TEMP/monitor.sock" "$RUNNER_TEMP/ecran-menu-ouvert.ppm" || true
          python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey esc" || true
          sleep 4
          python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey ctrl-shift-esc" || true
          sleep 10
          python3 scripts/ci-screen.py grab "$RUNNER_TEMP/monitor.sock" "$RUNNER_TEMP/ecran-taches.ppm" || true

          echo "--- le magasin s ouvre-t-il ---"
          # GrenPlace est la vitrine, et personne ne l'avait jamais ouvert ici :
          # il aurait pu ne plus demarrer du tout sans qu'une seule etape ne
          # rougisse. On l'ouvre comme le ferait une personne — le menu, quatre
          # lettres, Entree.
          #
          # « grenp » ne designe que lui, et ses cinq lettres sont a la meme
          # place en AZERTY qu'en QWERTY. « a » ne l'est pas : `sendkey a`
          # donnerait « q » dans la machine, et la recherche ne trouverait rien.
          python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey esc" || true
          sleep 2
          python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey ctrl-esc" || true
          sleep 4
          for touche in g r e n p ret; do
            python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey $touche" || true
            sleep 1
          done
          sleep 20
          python3 scripts/ci-screen.py grab "$RUNNER_TEMP/monitor.sock" "$RUNNER_TEMP/ecran-grenplace.ppm" || true
          # Il dit aussi d'ou vient son catalogue : du reseau, du dernier connu,
          # ou de celui livre avec l'image. Les trois sont des reponses valables,
          # et savoir laquelle vaut mieux que de supposer.
          if grep -aq 'grenplace ouvert' "$RUNNER_TEMP/serial.log"; then
            grep -a 'grenplace ouvert' "$RUNNER_TEMP/serial.log" | tail -1 | tr -d '[:cntrl:]' | sed 's/^.*grenos: //'
          else
            echo "magasin: il ne s est pas annonce (test non bloquant, a affiner)"
          fi

          echo "--- le mode Jeux s ouvre-t-il ---"
          # La page dont il attend le plus, et la derniere qui n'avait jamais
          # ete ouverte ici. « jeux » ne designe qu'elle dans le menu, et ses
          # quatre lettres sont a la meme place en AZERTY qu'en QWERTY.
          python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey ctrl-esc" || true
          sleep 4
          for touche in j e u x ret; do
            python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey $touche" || true
            sleep 1
          done
          sleep 20
          python3 scripts/ci-screen.py grab "$RUNNER_TEMP/monitor.sock" "$RUNNER_TEMP/ecran-jeux.ppm" || true
          if grep -aq 'jeux ouvert' "$RUNNER_TEMP/serial.log"; then
            grep -a 'jeux ouvert' "$RUNNER_TEMP/serial.log" | tail -1 | tr -d '[:cntrl:]' | sed 's/^.*grenos: //'
          else
            echo "jeux: la page ne s est pas annoncee (test non bloquant, a affiner)"
          fi
          python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey esc" || true
          sleep 2

          echo "--- le son repond-il ---"
          # Le seul reproche de Grenofar qu'on n'ait pas encore pu prouver
          # autrement qu'en comptant les sorties. On clique sur le petit
          # haut-parleur en bas a gauche — la barre dit ou il est, comme pour
          # le bouton grenOS — et le panneau annonce ce qu'il lit du melangeur :
          # combien de sorties, quel volume, muet ou non. Lire l'etat, pas
          # seulement lister des peripheriques.
          POINT_SON=$(grep -a 'bouton son en' "$RUNNER_TEMP/serial.log" | tail -1 | tr -d '[:cntrl:]' | sed 's/.*en //')
          if [ -n "$POINT_SON" ]; then
            SX=${POINT_SON%,*}
            SY=${POINT_SON#*,}
            echo "son: le bouton est en $SX,$SY"
            python3 scripts/ci-screen.py clic "$RUNNER_TEMP/qmp.sock" "$SX" "$SY" "$LARGEUR" "$HAUTEUR" || true
            sleep 12
            python3 scripts/ci-screen.py grab "$RUNNER_TEMP/monitor.sock" "$RUNNER_TEMP/ecran-son.ppm" || true
            if grep -aq 'son ouvert' "$RUNNER_TEMP/serial.log"; then
              grep -a 'son ouvert' "$RUNNER_TEMP/serial.log" | tail -1 | tr -d '[:cntrl:]' | sed 's/^.*grenos: //'
            else
              echo "son: le panneau ne s est pas annonce (test non bloquant, a affiner)"
            fi
            python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey esc" || true
            sleep 2
          else
            echo "son: la barre n a pas dit ou est son bouton"
          fi

          echo "--- les reglages s ouvrent-ils ---"
          # C'est la porte des mises a jour, du son et du mot de passe, et
          # personne ne l'avait jamais ouverte ici. Huit pages construites,
          # c'est huit occasions qu'une exception passe inapercue.
          #
          # Meta+I, comme sous Windows : le raccourci existe deja dans
          # openbox, on ne l'invente pas pour le test.
          python3 scripts/ci-screen.py send "$RUNNER_TEMP/monitor.sock" "sendkey meta_l-i" || true
          sleep 18
          python3 scripts/ci-screen.py grab "$RUNNER_TEMP/monitor.sock" "$RUNNER_TEMP/ecran-reglages.ppm" || true
          if grep -aq 'reglages ouvert' "$RUNNER_TEMP/serial.log"; then
            grep -a 'reglages ouvert' "$RUNNER_TEMP/serial.log" | tail -1 | tr -d '[:cntrl:]' | sed 's/^.*grenos: //'
          else
            echo "reglages: ils ne se sont pas annonces (test non bloquant, a affiner)"
          fi

          grep -a 'grenos:' "$RUNNER_TEMP/serial.log" | tail -n 24 || true

          if ! cp "$RUNNER_TEMP/ecran-5min.ppm" "$RUNNER_TEMP/final.ppm" 2>/dev/null; then
            python3 scripts/ci-screen.py grab "$RUNNER_TEMP/monitor.sock" "$RUNNER_TEMP/final.ppm" || true
          fi
          python3 scripts/ci-screen.py judge "$RUNNER_TEMP/final.ppm" "$RUNNER_TEMP/final.png" | tee "$RUNNER_TEMP/ecran.log"
          kill $QEMU 2>/dev/null || true
          tail -n 40 "$RUNNER_TEMP/serial.log" || true
          # La preuve qui ne trompe pas : le bureau ecrit une ligne sur le port
          # serie quand il s'ouvre. Une image ou personne ne peut se connecter
          # affiche un bel ecran de connexion et n'ecrit rien.
          if grep -q 'session de bureau ouverte' "$RUNNER_TEMP/serial.log"; then
            echo "session: le bureau s'est ouvert"
          else
            echo "::error::Aucune session de bureau : personne ne peut entrer dans cette image."
            exit 1
          fi
          # Le bureau a-t-il obei ? Trois lignes, et chacune prouve autre chose :
          # la barre a demarre, son menu s'ouvre a la demande, et une fenetre
          # s'ouvre au clavier. Une image ou l'une manque est une image ou
          # quelque chose ne repond pas.
          MUET=0
          for attendu in "barre prete" "menu ouvert" "taches ouvert"; do
            if grep -q "grenos: $attendu" "$RUNNER_TEMP/serial.log"; then
              echo "repond: $attendu"
            else
              echo "::error::Le bureau n'a pas repondu : « $attendu » n'est jamais venu."
              MUET=1
            fi
          done
          # Le clic de souris devient obligatoire : vu vert trois fois
          # (36018497394, 36023450708, 36047160557). La regle tenue depuis le
          # debut est qu'une etape ne devient exigee qu'apres avoir ete vue
          # verte — et une barre qui tomberait au premier clic passerait au
          # vert sans lui, puisque tout le reste se fait au clavier.
          if [ "$CLIC" != 1 ]; then
            echo "::error::Le clic sur le bouton grenOS n'ouvre pas le menu : la barre ne repond pas a la souris."
            MUET=1
          fi

          # Ce qui a ete vu vert plusieurs fois devient exige. La regle n'a pas
          # change : une etape ne devient obligatoire qu'apres avoir ete vue
          # verte — mais une fois qu'elle l'a ete, la laisser facultative
          # reviendrait a publier une image ou le magasin ne s'ouvre plus.
          for preuve in "grenplace ouvert" "maj: depot grenOS configure" "maj: trousseau du depot present" "maj: grenos-desktop" "disques : " "persistance : active" "son ouvert" "reglages ouvert" "jeux ouvert"; do
            if grep -aq "grenos: $preuve" "$RUNNER_TEMP/serial.log"; then
              echo "prouve: $preuve"
            else
              echo "::error::L'image n'a jamais dit « $preuve »."
              MUET=1
            fi
          done
          if grep -aq 'grenos: disques : aucun' "$RUNNER_TEMP/serial.log"; then
            echo "::error::Le systeme ne voit aucun disque : l'installateur n'aurait rien a proposer."
            MUET=1
          fi
          # Le clavier ne se contente pas d'exister : il doit etre celui qu'on a
          # choisi. La session dit « X en place alors que Y a ete choisi » quand
          # les deux different, et cette phrase-la est un echec.
          if grep -aq 'grenos: clavier :.*alors que' "$RUNNER_TEMP/serial.log"; then
            grep -a 'grenos: clavier :' "$RUNNER_TEMP/serial.log" | tail -1 | tr -d '[:cntrl:]' | sed 's/^.*grenos: //'
            echo "::error::Le clavier choisi au premier ecran n'est pas celui que la session utilise."
            MUET=1
          fi
          if [ "$MUET" = 1 ]; then
            exit 1
          fi

          echo "--- les fenetres tiennent-elles dans l ecran ---"
          # Grenofar a demarre grenOS en 1280x720 : « il est casse, on voit pas
          # tout ». Il avait raison — les Reglages demandaient 660 pixels de
          # haut, la page Jeux et GrenPlace 720, et sous la barre il n'en reste
          # que 668. Les boutons du bas tombaient hors de l'ecran.
          #
          # La machine d'essai demarre desormais en 720p, et chaque fenetre dit
          # sa taille REELLE une fois affichee — demander une taille n'est pas
          # l'obtenir, GTK agrandit des qu'un enfant exige plus de place.
          grep -a 'grenos: fenetre ' "$RUNNER_TEMP/serial.log" | tr -d '[:cntrl:]' | sed 's/^.*grenos: //' | sort -u
          DEBORDE=$(grep -ac 'grenos: fenetre .*DEBORDE' "$RUNNER_TEMP/serial.log" || true)
          DEBORDE=$(echo "$DEBORDE" | head -1)
          if [ "${DEBORDE:-0}" -gt 0 ]; then
            echo "::warning::$DEBORDE fenetre(s) depassent l ecran en 720p."
          else
            echo "aucune fenetre ne deborde en 720p"
          fi

          # Cette image peut-elle se mettre a jour ? L'essai en conteneur prouve
          # que le depot marche ; il ne prouve pas que l'IMAGE le connait. Le
          # depot arrive par config/archives/grenos.list.binary, et personne
          # n'avait jamais verifie qu'il atteignait le systeme demarre. Sans
          # lui, « Mettre a jour grenOS » n'apporte que les correctifs Debian.
          # Rapporte, pas encore bloquant : une etape ne devient obligatoire
          # qu'apres avoir ete vue verte.
          echo "--- y a-t-il un disque ou s installer ---"
          # QEMU lui donne un disque SATA de 20 Go. Si le systeme ne le voit
          # pas, l'installateur n'aurait rien a proposer — et on l'apprendrait
          # devant l'ecran de Calamares, sur la machine de quelqu'un.
          if ! grep -a 'grenos: disques' "$RUNNER_TEMP/serial.log" | tail -1 | tr -d '[:cntrl:]' | sed 's/^.*grenos: //'; then
            echo "disques : l image n a rien dit"
          fi

          echo "--- ce que la personne ecrit est-il garde ---"
          # La promesse de la machine VirtualBox, jamais verifiee : la machine
          # d'essai demarrait sans disque, donc live-boot ne trouvait aucune
          # persistance et continuait. Elle demarre maintenant sur le disque
          # qu'on livre.
          if ! grep -a 'grenos: persistance' "$RUNNER_TEMP/serial.log" | tail -1 | tr -d '[:cntrl:]' | sed 's/^.*grenos: //'; then
            echo "persistance : l image n a rien dit"
          fi

          echo "--- le clavier choisi est-il celui en place ---"
          # Le premier ecran ecrit /etc/default/keyboard, mais le service qui
          # le lit a peut-etre deja tourne au demarrage. Si la session garde un
          # clavier americain alors que la France a ete choisie, la personne
          # s'en apercoit a la premiere apostrophe. Rapporte, pas encore
          # bloquant.
          if ! grep -a 'grenos: clavier :' "$RUNNER_TEMP/serial.log" | tail -1 | tr -d '[:cntrl:]' | sed 's/^.*grenos: //'; then
            echo "clavier : l image n a rien dit"
          fi

          echo "--- cette image peut-elle se mettre a jour ---"
          if ! grep -a 'grenos: maj:' "$RUNNER_TEMP/serial.log" | sed 's/^.*grenos: //'; then
            echo "maj: l image n a rien dit du tout"
          fi

          # Un bureau couvre son fond de fenetres, d'icones et d'un panneau :
          # sa couleur dominante ne depasse jamais 70 % de l'ecran. Un menu de
          # demarrage, lui, est noir a 90 %.
          PART=$(sed -n 's/.*covers \([0-9]*\)%.*/\1/p' "$RUNNER_TEMP/ecran.log" | head -1)
          echo "couleur dominante : ${PART:-?} %"
          if [ -z "$PART" ] || [ "$PART" -gt 70 ]; then
            echo "::error::L'ecran n'est pas un bureau : la couleur dominante couvre ${PART:-?} % apres cinq minutes."
            exit 1
          fi

      # Presque aucun PC vendu depuis dix ans ne demarre en BIOS, et c'est
      # pourtant le seul mode que la machine d'essai avait jamais essaye. On
      # verifiait que la partition EFI existe ; on ne verifiait pas qu'elle
      # demarre. Un firmware UEFI qui refuse l'image dit « aucun support
      # amorcable » et rien d'autre : la panne serait pour lui, pas pour nous.
      #
      # Quatre-vingt-dix secondes suffisent : on ne cherche pas le bureau, on
      # cherche la preuve que le chargeur a pris la main et que le noyau
      # dessine. Un shell UEFI, lui, reste noir avec du texte blanc — deux
      # couleurs, et le noir couvre tout : le juge le refuse.
      - name: L'image demarre-t-elle en UEFI
        id: uefi
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq ovmf
          CODE=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          VARS=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          if [ -z "$CODE" ] || [ -z "$VARS" ]; then
            echo "::warning::OVMF introuvable : le demarrage UEFI n'a pas pu etre essaye."
            exit 0
          fi
          echo "firmware : $CODE"
          cp "$VARS" "$RUNNER_TEMP/uefi-vars.fd"
          ACCEL=""
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; fi
          qemu-system-x86_64 $ACCEL -m 2048 -smp 2 -drive if=pflash,format=raw,readonly=on,file="$CODE" -drive if=pflash,format=raw,file="$RUNNER_TEMP/uefi-vars.fd" -cdrom "$ISO_UEFI" -boot d -display none -vga std -serial file:"$RUNNER_TEMP/serial-uefi.log" -monitor unix:"$RUNNER_TEMP/uefi.sock",server,nowait -no-reboot &
          QEMU=$!
          sleep 3
          if ! kill -0 "$QEMU" 2>/dev/null; then
            echo "::error::QEMU n'a pas demarre en UEFI : sa ligne de commande est fautive."
            exit 1
          fi
          sleep 90
          python3 scripts/ci-screen.py grab "$RUNNER_TEMP/uefi.sock" "$RUNNER_TEMP/ecran-uefi.ppm" || true
          kill $QEMU 2>/dev/null || true
          # Le verdict se lit dans la sortie, pas dans le code de retour d'un
          # tube : `commande | tail` rend le code de `tail`, qui reussit
          # toujours. C'est le meme piege que le « grep -c » qui laissait
          # passer un test de souris muet.
          python3 scripts/ci-screen.py judge "$RUNNER_TEMP/ecran-uefi.ppm" "$RUNNER_TEMP/uefi.png" > "$RUNNER_TEMP/uefi-juge.log" 2>&1 || true
          tail -3 "$RUNNER_TEMP/uefi-juge.log" || true
          # Exige depuis le 2026-09-25 : vu vert trois constructions de suite, et
          # la capture montrait mieux que la ligne ne le dit — la machine etait
          # arrivee jusqu'au premier ecran de grenOS. Presque aucun PC vendu
          # depuis dix ans ne demarre autrement : publier une image qui ne
          # demarre pas en UEFI serait publier une image que personne n'allume.
          if grep -q "screen: PASS" "$RUNNER_TEMP/uefi-juge.log"; then
            echo "uefi: le chargeur a pris la main et le noyau dessine"
          else
            echo "::error::L'image ne demarre pas en UEFI : l'ecran est reste vide apres 90 s."
            exit 1
          fi
        env:
          ISO_UEFI: ${{ steps.build.outputs.iso }}

      - name: Garder les captures
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: grenos-linux-captures
          path: |
            ${{ runner.temp }}/*.ppm
            ${{ runner.temp }}/*.png
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 14

      # La machine VirtualBox toute prête : l'image, un disque vide où
      # l'installer, et le fichier .vbox à double-cliquer.
      - name: La machine VirtualBox
        id: vbox
        if: steps.boot.outcome == 'success'
        run: |
          ISO="${{ steps.build.outputs.iso }}"
          STAMP=$(date -u +%Y%m%d-%H%M)
          NAME="grenos-linux-$STAMP"
          mkdir -p dist
          # Un deplacement, pas une copie : l'image fait presque deux gigaoctets.
          mv "$ISO" "dist/$NAME.iso"
          # Le disque de la machine : formate et etiquete persistence, pour que
          # grenOS garde tout des le premier demarrage sans rien installer.
          sudo apt-get install -y -qq gdisk e2fsprogs
          sudo linux/tools/make-disk.sh "dist/$NAME.vdi" 25
          sudo chown "$(id -u):$(id -g)" "dist/$NAME.vdi"
          python3 scripts/make-vbox.py "$NAME.iso" "dist/$NAME.vbox" --linux --disk "dist/$NAME.vdi" "$NAME.vdi"
          (cd dist && zip -q -9 "$NAME-virtualbox.zip" "$NAME.iso" "$NAME.vbox" "$NAME.vdi")
          ls -la dist

          # Ce qu'il ouvre vraiment, c'est ce zip, et personne ne l'avait
          # jamais regarde. Un fichier que `zip` aurait saute, ou un nom qui ne
          # correspond pas, se verrait chez lui et pas ici.
          echo "--- ce que contient la machine VirtualBox ---"
          unzip -l "dist/$NAME-virtualbox.zip"
          manque=""
          for attendu in "$NAME.iso" "$NAME.vbox" "$NAME.vdi"; do
            unzip -l "dist/$NAME-virtualbox.zip" | grep -q "$attendu" || manque="$manque $attendu"
          done
          if [ -n "$manque" ]; then
            echo "::error::La machine VirtualBox est incomplete :$manque"
            exit 1
          fi
          # Le .vbox doit designer ses deux fichiers par le nom qu'ils portent
          # dans le zip : une fois decompresse, VirtualBox les cherche a cote.
          # Et il doit etre du XML valide, sinon VirtualBox refuse la machine
          # sans expliquer pourquoi.
          for attendu in "$NAME.iso" "$NAME.vdi"; do
            if ! grep -q "$attendu" "dist/$NAME.vbox"; then
              echo "::error::Le .vbox ne designe pas $attendu"
              exit 1
            fi
          done
          python3 -c "import sys, xml.etree.ElementTree as X; X.parse(sys.argv[1]); print('le .vbox est du XML valide')" "dist/$NAME.vbox"
          echo "machine VirtualBox : les trois fichiers sont la, et le .vbox les designe"
          # Demarre-t-elle sur un PC recent ? Presque aucun ne demarre plus en
          # BIOS. Le controle est un fichier a part, pas du Python ecrit dans
          # ce YAML : du code indente dans `python3 -c` leve une erreur
          # d'indentation, et c'est la lecon deja payee avec le garde-fou.
          python3 scripts/verif-iso-uefi.py "dist/$NAME.iso"

          SIZE=$(stat -c %s "dist/$NAME.iso")
          echo "image : $((SIZE / 1024 / 1024)) Mio"
          if [ "$SIZE" -gt 2100000000 ]; then
            echo "::error::L'image depasse 2 Go : une Release GitHub la refusera."
            exit 1
          fi
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Le verdict, pour que le Maitre et les taches sachent ou en est une
      # branche : linux.yml juge l'image comme verify.yml juge le noyau.
      - name: Rapporter le verdict
        if: always() && github.ref != 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DOMAIN: linux
          PROBE: "true"
          IMAGE: ${{ steps.build.outcome }}
          BOOT: ${{ steps.boot.outcome }}
          SCREEN: ${{ steps.boot.outcome }}
          JOB_STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUNID: ${{ github.run_id }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch -q --depth=1 origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::notice::Branche identique a main : rien a juger."
            exit 0
          fi
          HEAD_NOW=$(git ls-remote --heads origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ -n "$HEAD_NOW" ] && [ "$HEAD_NOW" != "$GITHUB_SHA" ]; then
            echo "::notice::Commit remplace : son run rendra le verdict."
            exit 0
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Verdict non transmis : secret SUPABASE_SERVICE_ROLE_KEY absent."
            exit 1
          fi
          if [ "$IMAGE" != "success" ]; then
            ST=failed; FL=compile_error
          elif [ "$BOOT" != "success" ]; then
            ST=failed; FL=test_failure
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            ST=timeout; FL=""
          else
            ST=passed; FL=""
          fi
          : > combined.log
          for f in ecran serial; do
            [ -f "$RUNNER_TEMP/$f.log" ] && { echo "--- $f ---" >> combined.log; tail -n 60 "$RUNNER_TEMP/$f.log" >> combined.log; }
          done
          LOGTXT=$(tail -c 6000 combined.log 2>/dev/null || true)
          export ST FL LOGTXT
          python3 scripts/ci-payload.py > payload.json
          code=$(curl -s -o response.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/runs" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "content-type: application/json" \
            -H "prefer: return=minimal" \
            --data-binary @payload.json)
          echo "verdict $ST : HTTP $code"
          [ "$code" = "201" ] || { cat response.json; exit 1; }

      - name: Publier la Release
        # Rien n'est publie sans les deux preuves : un bureau qui s'ouvre, et
        # une mise a jour qui s'installe depuis notre depot. Une image qu'on ne
        # peut pas mettre a jour obligerait a tout regraver.
        if: steps.boot.outcome == 'success' && steps.maj.outcome == 'success' && steps.uefi.outcome == 'success' && (github.ref == 'refs/heads/main' || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${{ steps.vbox.outputs.name }}"
          TAG="linux-${{ steps.vbox.outputs.stamp }}"
          cat > notes.md <<NOTES
          grenOS sur Debian trixie, bureau KDE Plasma, installateur Calamares.

          - \`$NAME.iso\` : l'image a graver, a copier sur une cle USB ou a monter dans une machine virtuelle.
          - \`$NAME-virtualbox.zip\` : la machine VirtualBox deja reglee, son disque et l'image.

          Construit par la CI a partir de \`linux/\`, demarre dans QEMU avant publication.
          NOTES
          sed -i 's/^          //' notes.md
          # Une seule ligne, sans continuation : c'est elle qui se perd en
          # chemin, et le garde-fou de la premiere etape la reclame.
          gh release create "$TAG" --title "grenOS Linux ${{ steps.vbox.outputs.stamp }}" --notes-file notes.md "dist/$NAME.iso" "dist/$NAME-virtualbox.zip"
