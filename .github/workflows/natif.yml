# La barre et le bureau natifs (linux/natif) compilent-ils, et leurs tests
# passent-ils ? Quelques minutes, contre deux heures pour l'image entière.
#
# Pourquoi un workflow à part : gtk-rs ne se compile pas sous Windows (il lui
# faut les en-têtes de GTK 3), donc on ne peut pas vérifier en local. Sans ce
# raccourci, chaque faute de frappe coûterait une construction d'image — et
# chaque push sur une branche `claude/**` ANNULE celle qui tourne.
name: natif

on:
  push:
    branches: ["natif/**", "claude/**", main]
    paths:
      - "linux/natif/**"
      - "linux/adaptateur-xbox/**"
      - "linux/ui/**"
      - "linux/config/includes.chroot/usr/lib/grenos/grenosui.py"
      - ".github/workflows/natif.yml"
  workflow_dispatch:

concurrency:
  group: natif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compiler et tester dans Debian trixie
        run: |
          docker run --rm -v "$PWD:/work" -w /work/linux/natif \
            -e CARGO_TERM_COLOR=never \
            rust:1-trixie sh -ec '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                libgtk-3-dev build-essential pkg-config >/dev/null
              cargo test --release
              cargo build --release
              ls -l target/release/grenos-shell-natif target/release/grenos-bureau-natif
            '
      # Le pilote de l'adaptateur sans fil Xbox (25 novembre) : aucune
      # dépendance, rien à installer. Le même Rust que la construction.
      - name: Le pilote de l adaptateur sans fil Xbox
        run: |
          RUST=$(sed -n 's/^RUST=//p' scripts/construire-binaires.sh)
          docker run --rm -v "$PWD:/work" -w /work/linux/adaptateur-xbox \
            -e CARGO_TERM_COLOR=never "$RUST" sh -ec '
              cargo test --release --locked
              cargo build --release --locked
              ls -l target/release/grenos-adaptateur-xbox
            '

  # grenos-ui (Tauri) : la même raison, depuis le 18 novembre. Ses pages
  # utilisent GIO et GTK sous Linux seulement (l'explorateur, le sélecteur
  # de fond) : `cargo test` sous Windows ne les compile pas, et attendre
  # trente minutes dans la construction complète pour lire une faute de
  # frappe coûterait la construction entière.
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Compiler et tester grenos-ui dans Debian trixie
        run: |
          docker run --rm -v "$PWD:/work" -w /work/linux/ui             -e CARGO_TERM_COLOR=never             rust:1-trixie sh -ec '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends                 libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev                 build-essential pkg-config >/dev/null
              cargo test
            '
