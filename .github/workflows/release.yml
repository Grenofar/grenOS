# Publie l'OS (D-030, D-032). A chaque kernel qui arrive sur main, l'image est
# reconstruite, demarree dans QEMU avec le critere de verify.yml, puis deposee
# dans Supabase Storage, bucket public « releases » : la page /download du site
# la sert de la, sans compte et sans passer par GitHub.

name: release

on:
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - ".github/workflows/release.yml"
      - "scripts/ci-screen.py"
      - "scripts/make-vbox.py"
  workflow_dispatch:

# Deux fusions rapprochees publient chacune leur image, dans l'ordre.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust
        working-directory: kernel
        run: |
          rustup toolchain install || true
          rustup show

      - name: Outils image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso mtools

      - name: Image
        run: bash kernel/scripts/make-iso.sh

      # On ne publie que ce qui boote, avec le meme critere que verify.yml.
      - name: Boot QEMU
        run: |
          set -o pipefail
          IMAGE=$(find kernel -name '*.iso' | head -n1)
          test -n "$IMAGE"
          MONITOR="$PWD/qemu-monitor.sock"
          timeout 90 qemu-system-x86_64 -cdrom "$IMAGE" -serial stdio -display none -no-reboot -no-shutdown -m 256M \
            -monitor "unix:$MONITOR,server,nowait" 2>&1 | tee qemu.log &
          sleep 25
          python3 scripts/ci-screen.py grab "$MONITOR" screen.ppm || true
          wait || true
          if grep -qiE 'panic|triple fault|double fault' qemu.log; then
            echo "::error::Le kernel a panique au boot : rien n'est publie."
            exit 1
          fi
          if ! grep -q 'grenOS' qemu.log; then
            echo "::error::Marqueur grenOS absent : rien n'est publie."
            exit 1
          fi
          cp "$IMAGE" grenos.iso
          # L'apercu de /download, quand le kernel dessine (D-033). Il n'empeche
          # jamais une publication : ici, c'est la sortie serie qui juge le boot.
          if python3 scripts/ci-screen.py judge screen.ppm screen.png; then
            echo "Apercu publie avec l'image."
          else
            rm -f screen.png
          fi

      # builds/grenos-<build>.iso ne change plus une fois deposee ; index.json
      # liste les dix dernieres, la plus recente en tete, et c'est lui que lit
      # le site. Ce qui sort des dix est efface : le stockage gratuit fait 1 Go.
      - name: Publier sur Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tpqzhzuoyqpfairatdrw.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY absent : rien n'est publie."
            exit 1
          fi
          BUILD="$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          OBJECT="builds/grenos-${BUILD}.iso"
          STORAGE="$SUPABASE_URL/storage/v1"
          AUTH=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")

          curl -fsS -X POST "${AUTH[@]}" -H "x-upsert: true" \
            -H "Content-Type: application/x-iso9660-image" -H "cache-control: max-age=31536000" \
            --data-binary @grenos.iso "$STORAGE/object/releases/$OBJECT" > /dev/null

          # La machine VirtualBox qui va avec (D-033) : un .vbox a garder dans le
          # meme dossier que l'ISO, qu'il designe par son nom.
          VBOX="builds/grenos-${BUILD}.vbox"
          python3 scripts/make-vbox.py "grenos-${BUILD}.iso" grenos.vbox
          curl -fsS -X POST "${AUTH[@]}" -H "x-upsert: true" \
            -H "Content-Type: application/x-virtualbox-vbox" -H "cache-control: max-age=31536000" \
            --data-binary @grenos.vbox "$STORAGE/object/releases/$VBOX" > /dev/null

          # Le choix « VirtualBox » de /download : l'ISO et sa machine dans un
          # seul zip, a extraire puis ouvrir ; le .vbox designe l'ISO par ce nom.
          ZIP="builds/grenos-${BUILD}-virtualbox.zip"
          cp grenos.iso "grenos-${BUILD}.iso"
          cp grenos.vbox "grenos-${BUILD}.vbox"
          python3 -c 'import sys, zipfile; z = zipfile.ZipFile(sys.argv[1], "w", zipfile.ZIP_DEFLATED, compresslevel=9); [z.write(f) for f in sys.argv[2:]]; z.close()' \
            grenos-virtualbox.zip "grenos-${BUILD}.iso" "grenos-${BUILD}.vbox"
          curl -fsS -X POST "${AUTH[@]}" -H "x-upsert: true" \
            -H "Content-Type: application/zip" -H "cache-control: max-age=31536000" \
            --data-binary @grenos-virtualbox.zip "$STORAGE/object/releases/$ZIP" > /dev/null

          # L'apercu, quand le kernel dessine quelque chose (etape Boot QEMU).
          SCREEN=""
          if [ -f screen.png ]; then
            SCREEN="builds/grenos-${BUILD}.png"
            curl -fsS -X POST "${AUTH[@]}" -H "x-upsert: true" \
              -H "Content-Type: image/png" -H "cache-control: max-age=31536000" \
              --data-binary @screen.png "$STORAGE/object/releases/$SCREEN" > /dev/null
          fi

          # L'index en place, lu avec la cle : le cache public a une minute de retard.
          if ! curl -fsS "${AUTH[@]}" "$STORAGE/object/releases/index.json" -o previous.json \
             || ! jq -e 'type == "array"' previous.json > /dev/null; then
            echo '[]' > previous.json
          fi
          jq --arg build "$BUILD" --arg path "$OBJECT" --arg vbox "$VBOX" --arg screen "$SCREEN" \
             --arg zip "$ZIP" --argjson zsize "$(stat -c %s grenos-virtualbox.zip)" \
             --arg commit "$GITHUB_SHA" --argjson size "$(stat -c %s grenos.iso)" \
             --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '[{build: $build, path: $path, vbox: $vbox, screen: (if $screen == "" then null else $screen end),
                virtualbox: $zip, virtualbox_size: $zsize,
                commit: $commit, size: $size, published_at: $at}] + .' \
             previous.json > all.json
          jq '.[:10]' all.json > index.json

          curl -fsS -X POST "${AUTH[@]}" -H "x-upsert: true" \
            -H "Content-Type: application/json" -H "cache-control: max-age=60" \
            --data-binary @index.json "$STORAGE/object/releases/index.json" > /dev/null

          DROPPED=$(jq -c '[.[10:][] | .path, .vbox, .screen, .virtualbox | select(. != null)]' all.json)
          if [ "$DROPPED" != "[]" ]; then
            curl -fsS -X DELETE "${AUTH[@]}" -H "Content-Type: application/json" \
              -d "{\"prefixes\": $DROPPED}" "$STORAGE/object/releases" > /dev/null
            echo "Effacees : $DROPPED"
          fi
          echo "Publiee : $SUPABASE_URL/storage/v1/object/public/releases/$OBJECT"
