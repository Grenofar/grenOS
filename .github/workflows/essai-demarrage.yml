# Boucle courte, provisoire (22 novembre) : le disque installe qui perd son
# lobby. Branches essai/** seulement ; ne publie rien.
name: Essai du demarrage installe

on:
  push:
    branches: ["essai/**"]

concurrency:
  group: essai-demarrage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  demarrage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Faire de la place
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      - name: Outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools xorriso dosfstools fdisk e2fsprogs qemu-system-x86 ovmf os-prober python3
          sudo chmod 0666 /dev/kvm 2>/dev/null || true

      - name: La version publiee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download linux-20261122-2300 -R "$GITHUB_REPOSITORY" -p '*.iso' -D "$RUNNER_TEMP/iso"

      - name: Installer, demarrer comme son PC
        run: |
          ISO=$(ls "$RUNNER_TEMP"/iso/*.iso | head -1)
          sudo env JUGER=oui bash linux/correctif/essai-demarrage-installe.sh "$ISO" - "$RUNNER_TEMP/demarrage"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demarrage
          path: |
            ${{ runner.temp }}/demarrage/*.png
            ${{ runner.temp }}/demarrage/*.txt
            ${{ runner.temp }}/demarrage/*.log
          retention-days: 14
